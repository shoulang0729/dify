# ---------------------------------------------------------------------------
# DC-02 議事録作成と次回論点整理 — Dify DSL（Workflow）
# 設計    : docs/dify/usecases/DC-02.md（System は §5-1 を最小構成〔file-list/iteration/Vision 無し、
#           meeting_date の代わりに meeting_title〕に合わせて調整。出力は §5-3 の要素を簡略化した JSON）
# 参照 DSL : docs/dify/templates/07-excel-document-extractor-echarts.yml（start → llm → end の骨子）
#            docs/dify/templates/01-translation-reflection-workflow.yml（LLM ノードの変数参照 {{#node_id.var#}}）
# 構成    : Start(transcript_text / meeting_title / lang) → LLM → End(output = LLM の text)
# モデル   : openrouter / qwen/qwen3.8-max を既定（dify/env/cloud-master/env.yml の models.chat）。変えるときは env とマスタを同時に（dify/README.md）
# 注意    : 最小構成のため、録音・ホワイトボード写真の取込（PC-03）と Outline 連携（PC-05）は持たない。
#           文字起こし・メモのテキストのみを受ける。期限は本文の表現をそのまま使い、絶対日付への換算はしない
#           （meeting_date 変数を持たないため）。
# ---------------------------------------------------------------------------
app:
  description: 'DC-02 議事録作成と次回論点整理。文字起こし・メモのテキストから、決定事項・宿題（担当／期限）・未決事項・次回論点の議事録を日中 2 版で返す。担当・期限が本文に無い場合は「要確認」。【インポート後】(1) LLM ノードのモデルを環境のプロバイダーに合わせて選び直す (2) 公開。'
  icon: 🗒️
  icon_background: '#E0F2FE'
  mode: workflow
  name: DC-02 議事録作成と次回論点整理
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: 1757250000001-source-1757250000002-target
      source: '1757250000001'
      sourceHandle: source
      target: '1757250000002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: 1757250000002-source-1757250000003-target
      source: '1757250000002'
      sourceHandle: source
      target: '1757250000003'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 開始（フォーム）
        type: start
        variables:
        - default: ''
          hint: ''
          label: 文字起こし・メモ（日中混在可）
          max_length: 8000
          options: []
          placeholder: ''
          required: true
          type: paragraph
          variable: transcript_text
        - default: ''
          hint: ''
          label: 会議タイトル
          max_length: 96
          options: []
          placeholder: ''
          required: true
          type: text-input
          variable: meeting_title
        - default: ''
          hint: ''
          label: 表示言語
          max_length: 48
          options:
          - ja
          - zh
          placeholder: ''
          required: true
          type: select
          variable: lang
      height: 170
      id: '1757250000001'
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 'System は docs/dify/usecases/DC-02.md §5-1（最小構成向けに調整。meeting_date を持たないため期限は原文表現のまま）。モデルは環境に合わせて変更'
        model:
          completion_params:
            exclude_reasoning_tokens: true
            max_tokens: 8192
            reasoning_effort: low
            temperature: 0.2
          mode: chat
          name: qwen/qwen3.8-max
          provider: langgenius/openrouter/openrouter
        prompt_template:
        - id: 8e3f1c2a-6b72-4d18-9a0e-1b2c3d4e5f01
          role: system
          text: |-
            あなたは青嶺精工（蘇州）の会議記録担当です。日本語と中国語が混在してもよい会議の文字起こし・メモから、議事録を作ります。
            守るルール：
            - 決定事項・宿題（ToDo）・未決事項は、入力テキストに書かれている内容だけから作る。書かれていない事実を作らない。
            - 担当者が本文に無ければ「要確認」と書く。期限も本文に無ければ「要確認」。**「未定」「未決」「不明」等の言い換え・空欄・省略を使わず、必ず「要確認」の 3 文字を書く**（宿題・未決事項のどちらにも適用する）。本文にある期限表現（「来週前半」「9/12」等）はそのまま使い、自分で絶対日付に変換・推定しない。
            - 管理番号（CL-／ECR-／NC- 等）・数値（n=125、192,000 個 等）は原文どおり。丸めない。
            - 「検討する」「持ち帰る」「後で決める」は決定事項ではなく未決事項に分類する。
            - **未決事項にも担当を書く**。誰がやるか本文に無い項目には「（担当：要確認）」を付ける。宿題が 1 件も無い場合でも、担当が決まっていない未決事項があれば必ずこの形で「要確認」を出す。
            - 次回論点は未決事項と宿題の期限から 4〜6 件にまとめる。本文に出ていない新しいテーマを足さない。
            - 個人名は「姓」まで（フルネーム・電話番号・従業員番号・給与や処遇の話題は書かない。処遇の議論があれば「人事と協議」に丸め「※記録対象外の議題あり」と注記する）。
            - 表示言語 {{#1757250000001.lang#}} に関わらず、成果物は**日本語版・中国語版の 2 版を必ず出す**（同じ項目数・同じ順序）。
            回答言語＝日本語版は日本語、中国語版は中国語（表示言語に関わらず 2 版とも出す）。
            言語の扱い（地の文と引用の区別。全サービス共通）：
            - 地の文（見出し・小見出し・分析・コメント・注記・箇条書き・自分で書いた表の見出し）は、例外なく回答言語で書く。1 つの文の中で日本語と中国語を混ぜない。
            - 原語のまま出してよいのは、引用符「」の中・引用ブロック（行頭 >）の中・番号や記号（E-47、7-12、ORG、MODE、SK-3310-A、TR-2024-007、§6.2）・文書の正式名称（取扱説明書、员工手册）だけ。
            - 対応語がある概念は必ず回答言語の語を使う（手順→步骤、根拠→依据、備考→备注、版ズレ→版本差异、現地スタッフ→当地员工、保全課長→保全科长、ページ→页）。文書に「保全課長（保全科长）」のように両方の語が併記されているときも、回答言語の側の語だけを書く（併記の形のまま持ち込まない）。対応語が本当に無い語だけ、原語のまま書いて直後の括弧に回答言語の説明を添える。
            - 引用した原文が回答言語と違う言語のときは、引用はそのままにして、その直後に回答言語で 1 行の要約を添える。引用を地の文の代わりに使わない。
            - 文字起こしに決定事項・宿題いずれも無ければ、議事録を作らず次の定型だけを返す。
              ja「文字起こし・メモに決定事項や宿題が見当たりません。内容を確認して再度お試しください」
              zh「转写内容中未发现决定事项或待办事项，请确认后重试」
            出力：日本語版 Markdown（見出し固定：決定事項／宿題（担当・期限）／未決事項／次回論点）→ 区切り線 `---` → 同じ見出しの中国語版 Markdown → 区切り線 `---` → JSON（下のスキーマ）。
            JSON スキーマ：
            {"title": "…", "decisions": [{"no": 1, "ja": "…", "zh": "…"}],
             "todos": [{"no": 1, "ja": "…", "zh": "…", "owner": "要確認 または 姓", "due": "本文の表現のまま または 要確認"}],
             "open_items": [{"no": 1, "ja": "…", "zh": "…"}],
             "next_agenda": [{"no": 1, "ja": "…", "zh": "…"}]}
        - id: 8e3f1c2a-6b72-4d18-9a0e-1b2c3d4e5f02
          role: user
          text: |-
            会議タイトル：{{#1757250000001.meeting_title#}}
            表示言語：{{#1757250000001.lang#}}
            文字起こし・メモ：
            {{#1757250000001.transcript_text#}}

            上記の内容から、決定事項・宿題（担当・期限）・未決事項・次回論点の議事録を作成してください。
        selected: false
        title: LLM（議事録・次回論点）
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: '1757250000002'
      position:
        x: 382
        y: 282
      positionAbsolute:
        x: 382
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - '1757250000002'
          - text
          value_type: string
          variable: output
        selected: false
        title: 終了
        type: end
      height: 88
      id: '1757250000003'
      position:
        x: 684
        y: 282
      positionAbsolute:
        x: 684
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.9
  rag_pipeline_variables: []
