# ---------------------------------------------------------------------------
# GN-02 請求書（発票）処理 — Dify DSL（Workflow）
# 設計    : docs/dify/usecases/GN-02.md（System は §5-1 を最小構成〔PO・入庫との三点照合の Code 無し〕に合わせて
#           調整。ここでは発票テキストの項目抽出〔JSON〕→ 基幹取込用 CSV 整形のみを行う。金額の検算・照合はしない）
# 参照 DSL : docs/dify/templates/07-excel-document-extractor-echarts.yml（start(file) → document-extractor → llm → end の骨子）
#            docs/dify/templates/02-long-document-chunk-iteration-translate.yml（Code ノードの構造：code/code_language/
#            dependencies/outputs/variables）
#            docs/dify/templates/06-text-to-sql-http-api-echarts.yml（LLM ノードの structured_output_enabled）
# 構成    : Start(invoice_text / invoice_file) → Document Extractor(invoice_file) → LLM（構造化 JSON 抽出）
#           → Code（JSON → CSV 整形。計算はしない）→ End(csv / warnings)
# モデル   : openrouter / qwen/qwen3.8-max を既定（dify/env/cloud-master/env.yml の models.chat）。変えるときは env とマスタを同時に（dify/README.md）
# 注意    : invoice_text・invoice_file はどちらか一方の入力を想定（どちらも required: false）。file が無いときは
#           Document Extractor の出力が空文字になる想定（Dify 側の実際の挙動は未確認。PR に不安な点として記載）。
#           structured_output_enabled は参照 DSL 06 にあるフィールドをそのまま使用（スキーマ定義フィールドは
#           参照 DSL に見当たらなかったため、System プロンプト側で JSON スキーマを明示する運用にした）。
# ---------------------------------------------------------------------------
app:
  description: 'GN-02 請求書（発票）処理。発票（増値税発票）のテキスト（またはアップロードしたファイル）から項目を JSON で抽出し、基幹システム取込用 CSV に整形する。金額の計算・照合はしない（転記のみ）。【インポート後】(1) LLM ノードのモデルを環境のプロバイダーに合わせて選び直す (2) 公開。'
  icon: 🧾
  icon_background: '#FCE7F3'
  mode: workflow
  name: GN-02 請求書（発票）処理
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
