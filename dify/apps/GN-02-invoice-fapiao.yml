        - allowed_file_extensions: []
          allowed_file_types:
          - document
          allowed_file_upload_methods:
          - local_file
          - remote_url
          default: ''
          hint: ''
          label: 発票のファイル（invoice_text が無いとき）
          options: []
          placeholder: ''
          required: false
          type: file
          variable: invoice_file
      height: 114
      id: '1757280000001'
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        is_array_file: false
        selected: false
        title: 文書抽出（invoice_file）
        type: document-extractor
        variable_selector:
        - '1757280000001'
        - invoice_file
      height: 92
      id: '1757280000002'
      position:
        x: 382
        y: 282
      positionAbsolute:
        x: 382
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 'System は docs/dify/usecases/GN-02.md §5-1（最小構成向けに調整。三点照合の Code が無いため、ここでは項目抽出のみを行う）。モデルは環境に合わせて変更'
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: qwen/qwen3.8-max
          provider: langgenius/openrouter/openrouter
        prompt_template:
        - id: 2b3c4d5e-9fa5-4041-ad3b-4e5f6a7b8c01
          role: system
          text: |-
            あなたは青嶺精工 蘇州工場 財務課 買掛担当の補助です。増値税発票（fapiao）のテキストから、基幹システム取込用に項目を抽出します。
            守ること：
            1. 発票番号・取引先名・税号・日付・金額（税抜・税率・税額・税込）・品目は、入力に書かれた値をそのまま転記する。自分で計算・換算・検算をしない。読み取れない項目は null にする。
            2. 税務判断（真偽・控除可否）をしない。
            3. 個人情報・機密：取引先の口座番号は出力しない。発票の抬頭が個人名の場合は氏名を書かず「个人名」と記す。
            4. 入力に複数の発票が含まれる場合はすべて抽出する。
            5. 出力は JSON のみ。説明文・前置きの挨拶は書かない。
            JSON スキーマ：
            {"invoices": [{"invoice_no": "…", "vendor_name": "…", "tax_id": "…", "date": "YYYY-MM-DD",
             "amount_excl_tax": 0, "tax_rate": 0, "tax_amount": 0, "amount_incl_tax": 0, "items": ["…"]}],
             "warnings": ["読み取れなかった項目 等"]}
        - id: 2b3c4d5e-9fa5-4041-ad3b-4e5f6a7b8c02
          role: user
          text: |-
            発票テキスト：
            {{#1757280000001.invoice_text#}}
            アップロードされたファイルからの抽出内容（あれば）：
            {{#1757280000002.text#}}

            上記から JSON を作成してください。
        selected: false
        structured_output_enabled: true
        title: LLM（発票項目抽出）
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: '1757280000003'
      position:
        x: 684
        y: 282
      positionAbsolute:
        x: 684
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |-
          import json
          import re


          def main(llm_text: str) -> dict:
              warnings = []
              text = (llm_text or "").strip()
              match = re.search(r"\{.*\}", text, re.DOTALL)
              if not match:
                  return {"csv": "", "warnings": ["LLM の出力から JSON を取り出せませんでした"]}
              try:
                  data = json.loads(match.group(0))
              except Exception:
                  return {"csv": "", "warnings": ["JSON の解析に失敗しました"]}

              invoices = data.get("invoices") or []
              if isinstance(data.get("warnings"), list):
                  warnings.extend(str(w) for w in data.get("warnings"))

              columns = ["invoice_no", "vendor_name", "tax_id", "date",
                         "amount_excl_tax", "tax_rate", "tax_amount", "amount_incl_tax"]
              lines = [",".join(columns)]
              for inv in invoices:
                  if not isinstance(inv, dict):
                      continue
                  if not inv.get("invoice_no"):
                      warnings.append("invoice_no が無い行があります（CSV には含めていません）")
                      continue
                  row = []
                  for col in columns:
                      v = inv.get(col)
                      s = "" if v is None else str(v)
                      if "," in s:
                          s = '"' + s.replace('"', '""') + '"'
                      row.append(s)
                  lines.append(",".join(row))

              return {"csv": "\n".join(lines), "warnings": warnings}
        code_language: python3
        dependencies: []
        desc: 'LLM が抽出した JSON テキストを基幹取込用 CSV に整形する。金額の計算・検算はしない（転記のみ）'
        outputs:
          csv:
            children: null
            type: string
          warnings:
            children: null
            type: array[string]
        selected: false
        title: コード（CSV 整形）
        type: code
        variables:
        - value_selector:
          - '1757280000003'
          - text
          variable: llm_text
      height: 98
      id: '1757280000004'
      position:
        x: 986
        y: 282
      positionAbsolute:
        x: 986
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - '1757280000004'
          - csv
          value_type: string
          variable: csv
        - value_selector:
          - '1757280000004'
          - warnings
          value_type: array[string]
          variable: warnings
        selected: false
        title: 終了
        type: end
      height: 88
      id: '1757280000005'
      position:
        x: 1288
        y: 282
      positionAbsolute:
        x: 1288
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.8
  rag_pipeline_variables: []
