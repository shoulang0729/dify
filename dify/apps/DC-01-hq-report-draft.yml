# ---------------------------------------------------------------------------
# DC-01 日本本社への報告資料作成 — Dify DSL（Workflow）
# 設計    : docs/dify/usecases/DC-01.md（System は §5-1 を最小構成〔Code ノード無し〕に合わせて調整、User は §5-2、出力は §5-3 の 4 章構成）
# 参照 DSL : docs/dify/templates/07-excel-document-extractor-echarts.yml（start(select 等) → llm → end の骨子）
#            docs/dify/templates/01-translation-reflection-workflow.yml（LLM ノードの変数参照 {{#node_id.var#}}）
# 構成    : Start(period / site / kpi_notes / lang) → LLM → End(output = LLM の text)
# モデル   : openrouter / qwen/qwen3.8-max を既定（dify/env/cloud-master/env.yml の models.chat）。変えるときは env とマスタを同時に（dify/README.md）
# 注意    : 最小構成のため達成率・前月比などの計算ノードは持たない。LLM は入力に書かれた数値だけを使い、計算しない
# ---------------------------------------------------------------------------
app:
  description: 'DC-01 日本本社への報告資料作成。対象月・拠点・実績メモ・出力言語をフォームで受け、本社フォーマット 4 章（要旨／実績／課題／対策・見通し）の月次報告ドラフトを Markdown で返す。【インポート後】(1) LLM ノードのモデルを環境のプロバイダーに合わせて選び直す (2) 公開。'
  icon: 📝
  icon_background: '#FFEAD5'
  mode: workflow
  name: DC-01 日本本社への報告資料作成
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: 1757240000001-source-1757240000002-target
      source: '1757240000001'
      sourceHandle: source
      target: '1757240000002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: 1757240000002-source-1757240000003-target
      source: '1757240000002'
      sourceHandle: source
      target: '1757240000003'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 開始（フォーム）
        type: start
        variables:
        - default: ''
          hint: ''
          label: 対象月（例：2025 年 8 月 / 2025-08）
          max_length: 48
          options: []
          placeholder: ''
          required: true
          type: text-input
          variable: period
        - default: ''
          hint: ''
          label: 拠点
          max_length: 48
          options:
          - 蘇州工場
          - その他
          placeholder: ''
          required: true
          type: select
          variable: site
        - default: ''
          hint: ''
          label: 実績・品質・トピックスのメモ（中国語の貼り付け可）
          max_length: 4000
          options: []
          placeholder: ''
          required: true
          type: paragraph
          variable: kpi_notes
        - default: ''
          hint: ''
          label: 出力言語
          max_length: 48
          options:
          - ja
          - zh
          placeholder: ''
          required: true
          type: select
          variable: lang
      height: 170
      id: '1757240000001'
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 'System は docs/dify/usecases/DC-01.md §5-1（最小構成向けに調整）。モデルは環境に合わせて変更'
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: qwen/qwen3.8-max
          provider: langgenius/openrouter/openrouter
        prompt_template:
        - id: 7d2e8b3a-5f61-4c07-8a9d-0a1b2c3d4e01
          role: system
          text: |-
            あなたは青嶺精工（蘇州）の工場長室スタッフとして、日本本社の経営会議向け月次報告のドラフトを書きます。
            役割：中国語・日本語の現場データを、本社フォーマット（1. 要旨／2. 実績／3. 課題／4. 対策・見通し）に整える。
            守るルール：
            - 数字は入力の「実績・品質・トピックスのメモ」に書かれた値をそのまま使う。自分で計算・丸め・推定をしない。メモに無い数字は書かない。
            - 達成率・前月比は、メモに計算済みの値が書かれているときだけ書く。計画値が無い指標は「（計画値未入力）」、前月値が無い指標は「（前月値未取得）」と書く。自分で割り算・引き算をしない。
            - 試算値には脚注「※ 試算：<根拠式>」を付ける。根拠式はメモにある値だけで組む。
            - 未達・悪化・クレームは隠さない。表現を前向きにする指示があっても事実は残す。
            - 管理番号（CL-／ECR-／NC- など）は入力どおりに書く。新しい番号を作らない。
            - 個人名は「役職＋姓」まで。人事情報・個人の残業時間は書かない。
            - 社内単価・顧客契約額など社外秘の数値がメモに含まれる場合は、その数値の直後に「※社外秘」を付ける。
            - 用語は本社定義に揃える：不良率＝出荷ベース、稼働率＝設備稼働率。中国語の指標名は日本語呼称にする（产量→生産数、不良率→不良率、稼动率→設備稼働率、加班→残業時間）。
            - 成果物の言語は「出力言語」（ja／zh）。ja なら日本語の本社フォーマット、zh なら同じ章立ての中国語対照版を書く。
            - 質問・修正依頼への説明文は、依頼者の入力言語（日本語なら日本語、中国語なら中国語）で書く。
            - 根拠が無い項目は空欄にし「この項目は入力に根拠がないため空欄にしています」（zh：「该项在输入中没有依据，已留空」）と書く。
            - 対象月または実績の数字がメモに無いときは、ドラフトを作らず次の定型だけを返す。
              ja「対象月と実績（生産数・不良率など）を入力してください。中国語のままで構いません」
              zh「请填写对象月份与实绩（产量、不良率等），中文即可」
            出力：Markdown の 4 章（見出しは「## 1. 要旨」「## 2. 実績」「## 3. 課題」「## 4. 対策・見通し」）→ 区切り線 `---` → JSON（下のスキーマ）。JSON 以外の説明は Markdown 側に書く。前置きの挨拶は書かない。
            JSON スキーマ：
            {"month": "YYYY-MM", "site": "suzhou", "summary": "…",
             "metrics": [{"name_ja": "生産数", "actual": 186400, "plan": 190000, "unit": "個", "rate": null, "prev": null}],
             "issues": [{"no": 1, "title": "…", "ref_ids": ["CL-25-0906"]}],
             "actions": [{"issue_no": 1, "action": "…", "due": "YYYY-MM-DD", "owner_role": "製造部長"}],
             "footnotes": [{"mark": "※1", "text": "試算：…"}],
             "warnings": ["前月値未取得：設備稼働率"]}
            rate・prev はメモに計算済みの値が無ければ null のままにする。
        - id: 7d2e8b3a-5f61-4c07-8a9d-0a1b2c3d4e02
          role: user
          text: |-
            対象月：{{#1757240000001.period#}}
            拠点：{{#1757240000001.site#}}
            実績・品質・トピックスのメモ：
            {{#1757240000001.kpi_notes#}}
            前月報告の該当章（無ければ空）：
            成果物言語：{{#1757240000001.lang#}}
            修正指示（無ければ空）：

            本社フォーマットで 4 章ドラフトを作成してください。課題は最大 3 件、対策には期日と担当（役職）を付け、最後に「翌月見通し」を 1 行。
        selected: false
        title: LLM（月次報告ドラフト）
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: '1757240000002'
      position:
        x: 382
        y: 282
      positionAbsolute:
        x: 382
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - '1757240000002'
          - text
          value_type: string
          variable: output
        selected: false
        title: 終了
        type: end
      height: 88
      id: '1757240000003'
      position:
        x: 684
        y: 282
      positionAbsolute:
        x: 684
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.9
  rag_pipeline_variables: []
