# ---------------------------------------------------------------------------
# GN-01 経費精算チェック — Dify DSL（Workflow）
# 設計    : docs/dify/usecases/GN-01.md（System は §5-1 を最小構成〔Code による三点照合・OCR・マスク処理 無し〕に
#           合わせて調整。判定は Code ではなく LLM が規程 KB の検索結果〔<context>〕と照合して行う）
# 参照 DSL : docs/dify/templates/07-excel-document-extractor-echarts.yml（start(file) → document-extractor → llm → end の骨子）
#            docs/dify/templates/03-document-chat-classifier-multi-kb.yml（knowledge-retrieval → llm の骨子。KN-01 で採用済み）
# 構成    : Start(claim_text / claim_file / lang) → Document Extractor(claim_file) → Knowledge Retrieval(規程KB)
#           → LLM → End(output = LLM の text)
# モデル   : openrouter / qwen/qwen3.8-max を既定（dify/env/cloud-master/env.yml の models.chat）。変えるときは env とマスタを同時に（dify/README.md）
# 注意    : claim_text・claim_file はどちらか一方の入力を想定（どちらも required: false）。file が無いときは
#           Document Extractor の出力が空文字になる想定（Dify 側の実際の挙動は未確認。CLAUDE.md 不安な点として
#           PR に記載）。金額・差額の計算は行わない（原文の値を転記するだけ）。
# ---------------------------------------------------------------------------
app:
  description: 'GN-01 経費精算チェック。精算明細のテキスト（またはアップロードしたファイル）を経費規程 KB と照合し、不備・規程超過の指摘と差し戻し文ドラフトを返す。金額は原文の転記のみ。個人情報はマスクして扱う。【インポート後】(1) LLM ノードのモデルを環境のプロバイダーに合わせて選び直す (2) ナレッジベースを作成し dify/kb/GN-01/ の 2 文書をアップロードして知識検索ノードに紐づける (3) 公開。'
  icon: 💰
  icon_background: '#DCFCE7'
  mode: workflow
  name: GN-01 経費精算チェック
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: document-extractor
      id: 1757270000001-source-1757270000002-target
      source: '1757270000001'
      sourceHandle: source
      target: '1757270000002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: document-extractor
        targetType: knowledge-retrieval
      id: 1757270000002-source-1757270000003-target
      source: '1757270000002'
      sourceHandle: source
      target: '1757270000003'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: knowledge-retrieval
        targetType: llm
      id: 1757270000003-source-1757270000004-target
      source: '1757270000003'
      sourceHandle: source
      target: '1757270000004'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: 1757270000004-source-1757270000005-target
      source: '1757270000004'
      sourceHandle: source
      target: '1757270000005'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 開始（フォーム）
        type: start
        variables:
        - default: ''
          hint: ''
          label: 精算明細のテキスト（claim_file が無いとき）
          max_length: 4000
          options: []
          placeholder: ''
          required: false
          type: paragraph
          variable: claim_text
        - allowed_file_extensions: []
          allowed_file_types:
          - document
          allowed_file_upload_methods:
          - local_file
          - remote_url
          default: ''
          hint: ''
          label: 精算明細のファイル（claim_text が無いとき）
          options: []
          placeholder: ''
          required: false
          type: file
          variable: claim_file
        - default: ''
          hint: ''
          label: 表示言語
          max_length: 48
          options:
          - ja
          - zh
          placeholder: ''
          required: true
          type: select
          variable: lang
      height: 170
      id: '1757270000001'
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        is_array_file: false
        selected: false
        title: 文書抽出（claim_file）
        type: document-extractor
        variable_selector:
        - '1757270000001'
        - claim_file
      height: 92
      id: '1757270000002'
      position:
        x: 382
        y: 282
      positionAbsolute:
        x: 382
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        dataset_ids: []
        desc: 'インポート後に UI でナレッジベース（dify/kb/GN-01/ の 2 文書：旅費規程・交際費規程）を選び直す'
        multiple_retrieval_config:
          reranking_enable: false
          reranking_mode: reranking_model
          reranking_model:
            model: ''
            provider: ''
          score_threshold: null
          top_k: 4
        query_variable_selector:
        - '1757270000001'
        - claim_text
        retrieval_mode: multiple
        selected: false
        title: 知識検索（経費規程・出張規程）
        type: knowledge-retrieval
      height: 92
      id: '1757270000003'
      position:
        x: 684
        y: 282
      positionAbsolute:
        x: 684
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: true
          variable_selector:
          - '1757270000003'
          - result
        desc: 'System は docs/dify/usecases/GN-01.md §5-1（最小構成向けに調整。Code の findings が無いため、規程照合は LLM が <context> を見て行う）。モデルは環境に合わせて変更'
        model:
          completion_params:
            exclude_reasoning_tokens: true
            max_tokens: 8192
            reasoning_effort: low
            temperature: 0.2
          mode: chat
          name: qwen/qwen3.8-max
          provider: langgenius/openrouter/openrouter
        prompt_template:
        - id: 1a2b3c4d-8e94-4f30-9c2a-3d4e5f6a7b01
          role: system
          text: |-
            あなたは青嶺精工 蘇州工場 財務課の経費精算チェック補助です。精算明細のテキストと、<context> にある経費規程・出張規程の条文を照合し、担当者向けの説明を作ります。
            守ること：
            1. 金額はテキストに書かれた値をそのまま転記する。自分で計算・換算・合計をしない。
            2. 規程は <context> にある条文番号と原文だけを引用する。<context> に無い規程・閾値を作らない。該当条文が無ければ「規程に該当条文なし。財務課長の判断をお願いします」と書く。
            3. 個人情報：申請者は「姓＋役職」または社員 ID で書く。フルネーム・身分証番号・電話・口座・住所を書かない。入力にマスク（[ID] 等）があればそのまま残す。発票の抬頭が個人名の場合は氏名を書かず「個人名」と記す。
            4. 発票の真偽・税務上の可否を判定しない。必要なら「税務総局の発票査験または税理士確認」と案内する。
            5. 「承認」「却下」を決定しない。「判定候補：差し戻し／確認／問題なし」と書く。
            6. 申請者の傾向や人物評価を書かない。
            7. 出力言語：{{#1757270000001.lang#}} が ja なら日本語、zh なら中国語で書く。根拠となる条文は言語を問わない。出力言語と同じ言語の条文が <context> に無ければ、他言語の条文を根拠にしてよく、それだけを理由に「規程に該当条文なし」とはしない。その場合も説明文は出力言語で書き、役職・部署名は出力言語の表記にする（対応語が無ければ原語のまま書き、括弧で説明を添える）。条文原文の引用はそのまま原語で示す。
            回答言語＝出力言語 {{#1757270000001.lang#}}（ja なら日本語、zh なら中国語）。
            言語の扱い（地の文と引用の区別。全サービス共通）：
            - 地の文（見出し・小見出し・分析・コメント・注記・箇条書き・自分で書いた表の見出し）は、例外なく回答言語で書く。1 つの文の中で日本語と中国語を混ぜない。
            - 原語のまま出してよいのは、引用符「」の中・引用ブロック（行頭 >）の中・番号や記号（E-47、7-12、ORG、MODE、SK-3310-A、TR-2024-007、§6.2）・文書の正式名称（取扱説明書、员工手册）だけ。
            - 対応語がある概念は必ず回答言語の語を使う（手順→步骤、根拠→依据、備考→备注、版ズレ→版本差异、現地スタッフ→当地员工、保全課長→保全科长、ページ→页）。文書に「保全課長（保全科长）」のように両方の語が併記されているときも、回答言語の側の語だけを書く（併記の形のまま持ち込まない）。対応語が本当に無い語だけ、原語のまま書いて直後の括弧に回答言語の説明を添える。
            - 引用した原文が回答言語と違う言語のときは、引用はそのままにして、その直後に回答言語で 1 行の要約を添える。引用を地の文の代わりに使わない。
            出力形式：「結果」（内容・金額・検出事項（条文引用）・判定候補）→「不備の指摘」→「要判断（財務課長）」の順の Markdown。
        - id: 1a2b3c4d-8e94-4f30-9c2a-3d4e5f6a7b02
          role: user
          text: |-
            <context>
            {{#context#}}
            </context>

            精算明細のテキスト：
            {{#1757270000001.claim_text#}}
            アップロードされたファイルからの抽出内容（あれば）：
            {{#1757270000002.text#}}

            出力言語：{{#1757270000001.lang#}}

            上記の精算明細を規程と照合し、不備の指摘と差し戻し文ドラフトを作成してください。
        selected: false
        title: LLM（規程照合・不備指摘）
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: '1757270000004'
      position:
        x: 986
        y: 282
      positionAbsolute:
        x: 986
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - '1757270000004'
          - text
          value_type: string
          variable: output
        selected: false
        title: 終了
        type: end
      height: 88
      id: '1757270000005'
      position:
        x: 1288
        y: 282
      positionAbsolute:
        x: 1288
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.8
  rag_pipeline_variables: []
