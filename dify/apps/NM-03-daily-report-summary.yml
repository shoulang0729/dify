    - data:
        is_array_file: false
        selected: false
        title: Document Extractor（日報ファイル）
        type: document-extractor
        variable_selector:
        - '1757270000001'
        - report_file
      height: 92
      id: '1757270000002'
      position:
        x: 382
        y: 282
      positionAbsolute:
        x: 382
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import re\nimport json\n\n\ndef main(doc_text: str, pasted_text: str) -> dict:\n\
          \    \"\"\"抽出テキストとテキスト貼り付けを合わせ、「ラベル: 数値」の形をすべて拾って\n\
          \    ラベルごとに件数・合計・平均を集計する。LLM には計算させず、この Code の出力を転記させる。\"\"\"\n\
          \    src = '\\n'.join([t for t in [doc_text or '', pasted_text or ''] if t])\n\
          \    pattern = re.compile(r'([\\u3040-\\u30ff\\u4e00-\\u9fff\\w]{2,12})\\s*[:\\uff1a]\\\
          s*([0-9]+(?:[.,][0-9]+)?)\\s*(%|h|\\u4ef6|\\u4e2a|\\u53f0)?')\n    buckets: dict = {}\n\
          \    for m in pattern.finditer(src):\n        label = m.group(1)\n        value\
          \ = float(m.group(2).replace(',', ''))\n        unit = m.group(3) or ''\n     \
          \   key = f'{label}{unit}'\n        buckets.setdefault(key, []).append(value)\n\n\
          \    items = []\n    for key, values in buckets.items():\n        items.append({\n\
          \            'label': key,\n            'count': len(values),\n            'sum':\
          \ round(sum(values), 2),\n            'avg': round(sum(values) / len(values), 2),\n\
          \            'values': values,\n        })\n\n    aggregate = {\n        'items':\
          \ items,\n        'labels_found': len(items),\n        'source_chars': len(src),\n\
          \    }\n    return {\n        'aggregate_json': json.dumps(aggregate, ensure_ascii=False),\n\
          \        'source_text': src,\n        'labels_found': len(items),\n    }\n"
        code_language: python3
        dependencies: []
        desc: '数値の集計のみ。合計・平均を LLM に計算させないための Code ノード（NM-03.md §3「数値はすべて Code の集計結果を転記」に対応）'
        outputs:
          aggregate_json:
            children: null
            type: string
          labels_found:
            children: null
            type: number
          source_text:
            children: null
            type: string
        selected: false
        title: Code（数値集計）
        type: code
        variables:
        - value_selector:
          - '1757270000002'
          - text
          variable: doc_text
        - value_selector:
          - '1757270000001'
          - text
          variable: pasted_text
      height: 98
      id: '1757270000003'
      position:
        x: 684
        y: 282
      positionAbsolute:
        x: 684
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 'System は docs/dify/usecases/NM-03.md §5-1 を最小構成向けに調整（Iteration・KB 無し。Code の集計 JSON をそのまま転記する）。モデルは環境に合わせて変更'
        model:
          completion_params:
            exclude_reasoning_tokens: true
            max_tokens: 8192
            reasoning_effort: low
            temperature: 0.2
          mode: chat
          name: qwen/qwen3.8-max
          provider: langgenius/openrouter/openrouter
        prompt_template:
        - id: a1b2c3d4-e5f6-4708-8192-0a1b2c3d4e01
          role: system
          text: |-
            あなたは青嶺精工 蘇州工場 製造二課の週報作成アシスタントです。Code ノードが集計した数値（JSON、items 配列。各要素はラベル・件数・合計・平均・個々の値）と、日報の原文（備考欄を含む）から、週報のドラフトを書きます。

            守ること：
            1. 数値は Code の JSON（items の sum／avg／values）をそのまま転記する。合計・平均・達成率などを自分で計算しない。JSON に無い数値は書かない。
            2. 異常値・トピックスのコメントは、日報原文（source_text）に実際に書かれている文だけを引く。書かれていなければ「理由は日報に記載なし。班長に確認」と書く。
            3. 「対処済み」「収束」などの評価語は、日報原文に日付・数値の推移が書かれているときだけ使う。無ければ使わない。
            4. 作業者・班長個人の氏名は書かない。設備名・ライン名・金型番号は書く。
            5. items が空、または labels_found が 0 の場合はドラフトを作らず、次の定型文だけを返す。
               ja「集計できる数値が見つかりませんでした。日報ファイルまたはテキスト貼り付けの内容を確認してください。」
               zh「未能找到可汇总的数值。请确认日报文件或粘贴的文本内容。」
            6. 出力言語は lang（既定は日本語）。日報原文は言語を問わず使ってよい（lang と違う言語で書かれていても集計・要約の対象から外さない）。日報原文の引用は原語のまま示し、必要なら訳を添える。異常値・トピックスの説明（地の文）の役職・設備名・ライン名は出力言語の表記にする（対応語が無ければ原語のまま書き、括弧で説明を添える）。日本語は本社向けの簡潔な報告文体（「〜です・ます」不要、体言止め可）。
            回答言語＝出力言語 {{#1757270000001.lang#}}（ja なら日本語、zh なら中国語）。
            言語の扱い（地の文と引用の区別。全サービス共通）：
            - 地の文（見出し・小見出し・分析・コメント・注記・箇条書き・自分で書いた表の見出し）は、例外なく回答言語で書く。1 つの文の中で日本語と中国語を混ぜない。
            - 原語のまま出してよいのは、引用符「」の中・引用ブロック（行頭 >）の中・番号や記号（E-47、7-12、ORG、MODE、SK-3310-A、TR-2024-007、§6.2）・文書の正式名称（取扱説明書、员工手册）だけ。
            - 対応語がある概念は必ず回答言語の語を使う（手順→步骤、根拠→依据、備考→备注、版ズレ→版本差异、現地スタッフ→当地员工、保全課長→保全科长、ページ→页）。文書に「保全課長（保全科长）」のように両方の語が併記されているときも、回答言語の側の語だけを書く（併記の形のまま持ち込まない）。対応語が本当に無い語だけ、原語のまま書いて直後の括弧に回答言語の説明を添える。
            - 引用した原文が回答言語と違う言語のときは、引用はそのままにして、その直後に回答言語で 1 行の要約を添える。引用を地の文の代わりに使わない。
            7. 質問・追加指示が中国語で来た場合、その回答は中国語で書く。ただし週報本体は lang の指定に従う。

            出力形式：
            - 「集計結果」：Code の items を表または箇条書きで転記（ラベル｜件数｜合計｜平均）。
            - 「トピックス・異常値コメント」：箇条書き 2〜4 件。日報原文の引用を添える。
            - 「注記」：集計できなかった項目や不明点があれば書く。無ければ「特になし」。
        - id: a1b2c3d4-e5f6-4708-8192-0a1b2c3d4e02
          role: user
          text: |-
            【出力言語】{{#1757270000001.lang#}}
            【集計結果（Code 出力・転記のみ）】
            {{#1757270000003.aggregate_json#}}
            【日報原文（備考欄を含む）】
            {{#1757270000003.source_text#}}

            上記から週報ドラフトを作成してください。
        selected: false
        title: LLM（週報ドラフト）
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: '1757270000004'
      position:
        x: 986
