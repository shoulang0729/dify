# ---------------------------------------------------------------------------
# NM-03 日報・実績の集計と要約 — Dify DSL（Workflow）
# 設計    : docs/dify/usecases/NM-03.md（System は §5-1 を最小構成向けに調整。原文は Iteration による複数ファイル処理・
#           KB（KPI 定義）・xlsx 列名の日中辞書を前提にしているが、本 DSL は Start で 1 ファイルを受け、
#           Document Extractor で文字列化 → Code ノードで「ラベル: 数値」形式の値をすべて拾って合計・平均・件数を
#           集計 → LLM が Code の集計結果（JSON。転記のみ）と日報備考を読んで週報文を書く、という最小構成にした）
# 参照 DSL : docs/dify/templates/07-excel-document-extractor-echarts.yml（start(file)→document-extractor→llm→end の骨子）
#            docs/dify/templates/02-long-document-chunk-iteration-translate.yml（code ノードの書き方：code / code_language /
#            dependencies / outputs の形。§5-3 の JSON 構造の参考）
# 構成    : Start(report_file file 1件／text 貼り付け（file が無いときのテスト用。file と排他）／lang select)
#           → Document Extractor（report_file）→ Code（aggregate：Document Extractor の text と text を合わせて数値集計）
#           → LLM（Code の JSON を転記して週報を書く。計算はしない）→ End
# 注意    : report_file が無い場合（Service API のテスト等）は text（貼り付け）を使う。両方無い場合は Code の集計が
#           空になり、LLM は「集計できるデータがありません」の定型で返す（§3 の「不確実時の定型文」を援用）
# モデル   : openrouter / qwen/qwen3.8-max を既定（dify/env/cloud-master/env.yml の models.chat）。変えるときは env とマスタを同時に（dify/README.md）
# ---------------------------------------------------------------------------
app:
  description: 'NM-03 日報・実績の集計と要約。当週の生産日報・品質日報・設備稼働記録（xlsx/csv、またはテキスト貼り付け）から、Code ノードが数値を集計し、LLM が日本語（または中国語）の週報ドラフトを書く。数値は Code の集計結果をそのまま転記し、LLM は計算しない。【インポート後】(1) LLM ノードのモデルを環境のプロバイダーに合わせて選び直す (2) 公開。'
  icon: 📊
  icon_background: '#FEF3C7'
  mode: workflow
  name: NM-03 日報・実績の集計と要約
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
