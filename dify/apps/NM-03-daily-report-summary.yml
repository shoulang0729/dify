          label: 日報のテキスト貼り付け
          max_length: 8000
          options: []
          placeholder: ''
          required: false
          type: paragraph
          variable: text
        - default: ja
          hint: ''
          label: 出力言語
          max_length: 48
          options:
          - ja
          - zh
          placeholder: ''
          required: true
          type: select
          variable: lang
      height: 178
      id: '1757270000001'
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
