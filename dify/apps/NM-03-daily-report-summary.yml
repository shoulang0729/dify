      sourceHandle: source
      target: '1757270000002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: document-extractor
        targetType: code
      id: 1757270000002-source-1757270000003-target
      source: '1757270000002'
      sourceHandle: source
      target: '1757270000003'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
