          default: ''
          hint: '生産日報・品質日報・設備稼働記録（xlsx/csv）を 1 ファイルずつ実行する。複数ファイルをまとめる場合はテキスト貼り付けを使う'
          label: 日報ファイル（xlsx/csv）
