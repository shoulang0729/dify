# ---------------------------------------------------------------------------
# DC-04 安全衛生・5S掲示物・改善提案の中国語化 — Dify DSL（Workflow）
# 設計    : docs/dify/usecases/DC-04.md（System は §5-1 を最小構成〔file-list/iteration/if-else 無し。
#           kind=改善提案 も含め、日本語の原文を現場向けの平易な中国語掲示文にする単方向〕に合わせて調整）
# 参照 DSL : docs/dify/templates/07-excel-document-extractor-echarts.yml（start → llm → end の骨子）
#            docs/dify/templates/01-translation-reflection-workflow.yml（「短くする」翻訳段の参考）
# 構成    : Start(source_text / kind / tone) → LLM → End(output = LLM の text)
# モデル   : openrouter / qwen/qwen3.8-max を既定（dify/env/cloud-master/env.yml の models.chat）。変えるときは env とマスタを同時に（dify/README.md）
# 注意    : 最小構成のため、改善提案の zh→ja 本社様式化（DC-04.md §4 の逆方向）は持たない。
#           ここでは日本語原文（ルール・5S・改善提案いずれも）を現場掲示用の中国語にする単方向のみ。
# ---------------------------------------------------------------------------
app:
  description: 'DC-04 安全衛生・5S掲示物・改善提案の中国語化。日本語のルール・5S 項目・改善提案の原文を、現場掲示向けの平易な中国語（見出し＋本文 3 項目以内）にする。用語は用語集優先、A4 掲示レイアウトの指示付き。【インポート後】(1) LLM ノードのモデルを環境のプロバイダーに合わせて選び直す (2) 公開。'
  icon: 📋
  icon_background: '#FEF3C7'
  mode: workflow
  name: DC-04 安全衛生・5S掲示物・改善提案の中国語化
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: 1757260000001-source-1757260000002-target
      source: '1757260000001'
      sourceHandle: source
      target: '1757260000002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: 1757260000002-source-1757260000003-target
      source: '1757260000002'
      sourceHandle: source
      target: '1757260000003'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 開始（フォーム）
        type: start
        variables:
        - default: ''
          hint: ''
          label: 日本語の掲示文・改善提案の原文
          max_length: 4000
          options: []
          placeholder: ''
          required: true
          type: paragraph
          variable: source_text
        - default: ''
          hint: ''
          label: 種別
          max_length: 48
          options:
          - 安全衛生
          - 5S
          - 改善提案
          placeholder: ''
          required: true
          type: select
          variable: kind
        - default: ''
          hint: ''
          label: 見出しのトーン
          max_length: 48
          options:
          - 口語
          - 標準
          - 情緒
          placeholder: ''
          required: true
          type: select
          variable: tone
      height: 170
      id: '1757260000001'
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 'System は docs/dify/usecases/DC-04.md §5-1（最小構成向けに調整。kind=改善提案 も含め ja→zh の単方向のみ）。モデルは環境に合わせて変更'
        model:
          completion_params:
            exclude_reasoning_tokens: true
            max_tokens: 8192
            reasoning_effort: low
            temperature: 0.2
          mode: chat
          name: qwen/qwen3.8-max
          provider: langgenius/openrouter/openrouter
        prompt_template:
        - id: 9f4a2d3b-7c83-4e29-8b1f-2c3d4e5f6a01
          role: system
          text: |-
            あなたは青嶺精工（蘇州）の安全衛生委員会・現場改善を支援するアシスタントです。日本語の原文（安全衛生ルール／5S 項目／改善提案）を、現場掲示用の平易な中国語にします。
            守るルール：
            - 原文の禁止・許可の範囲を変えない。強い言い回しに変えてもよいが意味を変えない（「指定工程のみ手袋可」を「手袋禁止」にしない）。要約すると意味が変わる項目は「原文のまま掲示するか委員長に確認してください」（zh：「该条如缩写为看板文案可能改变含义，请原文张贴或确认委员长意见」）と書く。
            - 掲示文の形式：見出し 1 行（15 字以内）＋本文 ①②③（各 15 字以内、原文に無い項目は空欄のまま）＋図解見出し（既存様式 S-xx の流用候補。無ければ空欄）。
            - 用語は用語集の呼称を優先する（「赤札」は品質の「红色标签」と 5S の赤札作戦「红牌」を混同しない）。
            - 種別 {{#1757260000001.kind#}} が「改善提案」のときは、効果の数値は原文の記載どおりに転記する。自分で推定・換算・合計をしない。比較対象（何と比べて 0 件か）が原文に無ければ「比較対象未記載」と書く。
            - 提案者・関係者の個人名は「姓＋部署」のみ。フルネーム・従業員番号を書かない。原文に匿名希望とあれば部署名のみにする。
            - 見出しはトーン {{#1757260000001.tone#}}（口語／標準／情緒）に沿って中国語で 1 案作り、対象層に応じた推奨理由を 1 行添える。
            - 出力言語：掲示文そのものは中国語。説明・注記・レイアウト指示は依頼者の入力言語（日本語なら日本語、中国語なら中国語）で書く。
            出力：Markdown（掲示ごとの見出し・本文・図解見出し・原文の要点）→ A4 掲示レイアウトの指示（用紙サイズ・縦横・文字の大きさの目安）→ 区切り線 `---` → JSON（下のスキーマ）。
            JSON スキーマ：
            {"posters": [{"no": 1, "headline_zh": "…", "lines_zh": ["…", "…", "…"], "illustration": "S-xx または空欄", "tone": "口語 または 標準 または 情緒"}],
             "warnings": ["比較対象未記載 等"]}
        - id: 9f4a2d3b-7c83-4e29-8b1f-2c3d4e5f6a02
          role: user
          text: |-
            種別：{{#1757260000001.kind#}}
            見出しのトーン：{{#1757260000001.tone#}}
            日本語原文：
            {{#1757260000001.source_text#}}

            上記から現場掲示用の中国語掲示文と A4 レイアウト指示を作成してください。
        selected: false
        title: LLM（掲示文の中国語化）
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: '1757260000002'
      position:
        x: 382
        y: 282
      positionAbsolute:
        x: 382
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - '1757260000002'
          - text
          value_type: string
          variable: output
        selected: false
        title: 終了
        type: end
      height: 88
      id: '1757260000003'
      position:
        x: 684
        y: 282
      positionAbsolute:
        x: 684
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.9
  rag_pipeline_variables: []
