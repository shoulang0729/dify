# ---------------------------------------------------------------------------
# GN-05 文書要約 — Dify DSL（Workflow）
# 設計    : docs/dify/usecases/GN-05.md（System は §5-1 を最小構成向けに調整。原文は章単位分割・Iteration・
#           KB（company-facts）による「当社への影響」判定を前提にしているが、本 DSL は 1 回の LLM 呼び出しで
#           Document Extractor の全文から直接要約する最小構成にした。粒度は task 指定の 3 種
#           〔要旨／論点／アクション〕に単純化し、原文の granularity（one_page 等）は使わない）
# 参照 DSL : docs/dify/templates/07-excel-document-extractor-echarts.yml（start(file)→document-extractor→llm→end の骨子）
#            docs/dify/templates/02-long-document-chunk-iteration-translate.yml（長文要約の定番構成。今回は
#            Iteration までは持たず、Document Extractor 直後に LLM が要約する）
# 構成    : Start(doc_file file 1件／text 貼り付け（file が無いときのテスト用。file と排他）／purpose select
#           （要旨／論点／アクション）／lang select）→ Document Extractor（doc_file）→ LLM（GN-05.md §5-1）→ End
# 注意    : doc_file が無い場合（Service API のテスト等）は text（貼り付け）を使う。両方無い場合は Document
#           Extractor の出力が空になり、LLM は「本文を抽出できません」の定型で返す（GN-05.md §2 を援用）
# モデル   : openrouter / qwen/qwen3.8-max を既定（dify/env/cloud-master/env.yml の models.chat）。変えるときは env とマスタを同時に（dify/README.md）
# ---------------------------------------------------------------------------
app:
  description: 'GN-05 文書要約。長文（通達・報告書等の PDF/docx、またはテキスト貼り付け）を、目的（要旨／論点／アクション）と出力言語に合わせて要約する。原文にページ番号があれば要点に付ける。【インポート後】(1) LLM ノードのモデルを環境のプロバイダーに合わせて選び直す (2) 公開。'
  icon: 📄
  icon_background: '#DBEAFE'
  mode: workflow
  name: GN-05 文書要約
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: document-extractor
      id: 1757280000001-source-1757280000002-target
      source: '1757280000001'
      sourceHandle: source
      target: '1757280000002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: document-extractor
        targetType: llm
      id: 1757280000002-source-1757280000003-target
      source: '1757280000002'
      sourceHandle: source
      target: '1757280000003'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: 1757280000003-source-1757280000004-target
      source: '1757280000003'
      sourceHandle: source
      target: '1757280000004'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 開始
        type: start
        variables:
        - allowed_file_extensions: []
          allowed_file_types:
          - document
          allowed_file_upload_methods:
          - local_file
          - remote_url
          default: ''
          hint: 'PDF・docx・txt を 1 件アップロードする'
          label: 要約する文書
          max_length: 5
          options: []
          placeholder: ''
          required: false
          type: file
          variable: doc_file
        - default: ''
          hint: 'doc_file が無いとき（Service API のテスト・コピー貼り付け運用）に使う。doc_file と排他（両方入力された場合は doc_file の抽出結果を優先する）'
          label: 文書のテキスト貼り付け
          max_length: 8000
          options: []
          placeholder: ''
          required: false
          type: paragraph
          variable: text
        - default: 要旨
          hint: ''
          label: 目的（粒度）
          max_length: 48
          options:
          - 要旨
          - 論点
          - アクション
          placeholder: ''
          required: true
          type: select
          variable: purpose
        - default: ja
          hint: ''
          label: 出力言語
          max_length: 48
          options:
          - ja
          - zh
          placeholder: ''
          required: true
          type: select
          variable: lang
      height: 234
      id: '1757280000001'
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        is_array_file: false
        selected: false
        title: Document Extractor（要約対象文書）
        type: document-extractor
        variable_selector:
        - '1757280000001'
        - doc_file
      height: 92
      id: '1757280000002'
      position:
        x: 382
        y: 282
      positionAbsolute:
        x: 382
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 'System は docs/dify/usecases/GN-05.md §5-1 を最小構成向けに調整（章分割・Iteration・KB 無し。1 回の LLM 呼び出しで全文を要約する）。モデルは環境に合わせて変更'
        model:
          completion_params:
            exclude_reasoning_tokens: true
            max_tokens: 8192
            reasoning_effort: low
            temperature: 0.2
          mode: chat
          name: qwen/qwen3.8-max
          provider: langgenius/openrouter/openrouter
        prompt_template:
        - id: b2c3d4e5-f607-4819-9203-0a1b2c3d4e01
          role: system
          text: |-
            あなたは青嶺精工 蘇州工場の文書要約アシスタントです。渡された文書全文（Document Extractor の抽出結果、または貼り付けテキスト）を、依頼者の目的・出力言語に合わせて要約します。

            守ること：
            1. 原文に書かれていることだけを書く。外部知識で補わない。
            2. 数値・期限・罰則・条文番号は原文どおり転記する。原文にページ番号・章番号があれば、要点の後に（p.N）のように付ける。無ければ付けない。
            3. 法的助言をしない。「違反になる／ならない」を断定せず、原文の記載と「法務・当局への確認を推奨」に留める。
            4. 担当部署・対応案を書く場合は「案」と明記する。期限は原文に記載された日付のみ書き、自分で期限を作らない。
            5. 個人名・電話番号（当局の公開窓口を除く）を転記しない。
            6. 出力言語は lang。原文は言語を問わない（lang と違う言語の文書でもそのまま要約してよく、「対応不可」とはしない）。地の文の役職・部署名・帳票名・手順名は出力言語の表記にする（対応語が無ければ原語のまま書き、括弧で説明を添える）。見出し・分類名も入力言語で書く（例：版ズレ → 版本差异）。原文の重要箇所（数値・条文番号など）は原語のまま引用し、必要なら訳を添える。
            7. 本文を抽出できなかった場合（空欄・意味のある文章が無い場合）は要約を作らず、次の定型文だけを返す。
               ja「本文を抽出できませんでした。ファイル形式やスキャン品質を確認してください。」
               zh「未能提取正文。请确认文件格式或扫描质量。」
            8. purpose（目的）に応じて出力の見出しを変える：
               - 「要旨」：要点（3〜7 項目、原文の重要箇所があればページ付き）
               - 「論点」：論点（原文に書かれている、判断や確認が必要な箇所を箇条書きで。断定はしない）
               - 「アクション」：要点を 1〜2 行に短くまとめた後、対応案（担当部署案・期限は原文記載のみ）を箇条書きで

            出力形式：見出し（purpose に応じたもの）→ 本文。前置きの挨拶は書かない。
        - id: b2c3d4e5-f607-4819-9203-0a1b2c3d4e02
          role: user
          text: |-
            【目的】{{#1757280000001.purpose#}}
            【出力言語】{{#1757280000001.lang#}}
            【文書全文（抽出結果）】
            {{#1757280000002.text#}}
            【文書全文（テキスト貼り付け。抽出結果が無い場合はこちらを使う）】
            {{#1757280000001.text#}}

            上記の文書を要約してください。
        selected: false
        title: LLM（要約）
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: '1757280000003'
      position:
        x: 684
        y: 282
      positionAbsolute:
        x: 684
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - '1757280000003'
          - text
          value_type: string
          variable: output
        selected: false
        title: 終了
        type: end
      height: 88
      id: '1757280000004'
      position:
        x: 986
        y: 282
      positionAbsolute:
        x: 986
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.9
  rag_pipeline_variables: []
