schema: 1
name: customer-a
description: 顧客 A のセルフホスト Dify（中国拠点）。実名・URL・dataset id・キーは環境変数で渡す
dify:
  base_url: ${DIFY_BASE_URL}
  console_url: ${DIFY_CONSOLE_URL}
  edition: selfhost
  dsl_version: '0.6.0'
models:                                        # DP-01 (a)：中国拠点は SiliconFlow（エンドポイントは資格情報側で選ぶ）。2026-09-07 時点で未確認
  chat:       { provider: langgenius/siliconflow/siliconflow, name: Qwen/Qwen3.5-397B-A17B, mode: chat, completion_params: { temperature: 0.2 } }
  reasoning:  { provider: langgenius/siliconflow/siliconflow, name: Pro/moonshotai/Kimi-K2.6, mode: chat }
  kimi:       { provider: langgenius/siliconflow/siliconflow, name: Pro/moonshotai/Kimi-K2.6, mode: chat }
  qwen_small: { provider: langgenius/siliconflow/siliconflow, name: Qwen/Qwen3.6-35B-A3B, mode: chat }
  embedding:  { provider: langgenius/siliconflow/siliconflow, name: BAAI/bge-m3 }
  rerank:     { provider: langgenius/siliconflow/siliconflow, name: BAAI/bge-reranker-v2-m3 }
  local:      { provider: langgenius/ollama/ollama, name: '${LOCAL_MODEL_NAME}', mode: chat }   # DP-03 越境ゼロ帯
  overrides:
    - { app: KN-03, node_title: 'LLM（根拠付き回答・版ズレ判定）', role: local }     # HR 帯は自前モデル
    - { app: KN-04, node_title: 'LLM', role: local }
knowledge:
  KN-01: { name: '${KB_NAME_KN01}', id: '${DIFY_DATASET_ID_KN01}' }
  KN-02: { name: '${KB_NAME_KN02}', id: '${DIFY_DATASET_ID_KN02}' }
  KN-03: { name: '${KB_NAME_KN03}', id: '${DIFY_DATASET_ID_KN03}' }
  GN-01: { name: '${KB_NAME_GN01}', id: '${DIFY_DATASET_ID_GN01}' }
brand:
  company:      { ja: '${BRAND_COMPANY_JA}', zh: '${BRAND_COMPANY_ZH}', en: '${BRAND_COMPANY_EN}' }
  local_entity: { ja: '${BRAND_ENTITY_JA}',  zh: '${BRAND_ENTITY_ZH}',  en: '${BRAND_ENTITY_EN}' }
  sites:
    - { id: suzhou, ja: '${BRAND_SITE1_JA}', zh: '${BRAND_SITE1_ZH}', en: '${BRAND_SITE1_EN}' }
    - { id: jp_hq,  ja: '${BRAND_SITE2_JA}', zh: '${BRAND_SITE2_ZH}', en: '${BRAND_SITE2_EN}' }
  replace:
    - { from: 青嶺精工, to: '${BRAND_COMPANY_JA}' }
    - { from: 青岭精工, to: '${BRAND_COMPANY_ZH}' }
    - { from: 蘇州工場, to: '${BRAND_SITE1_JA}' }
    - { from: 苏州工厂, to: '${BRAND_SITE1_ZH}' }
    - { from: 日本本社, to: '${BRAND_SITE2_JA}' }
    - { from: 日本总部, to: '${BRAND_SITE2_ZH}' }
flags: { cross_border: deny, partner_mode: mock, pipl_mask: on }
variables: { site: '${BRAND_SITE1_JA}', lang: ja }
# Cloud/セルフホストのアプリ id（scripts/dify/cloud_deploy.py が使う。§2-2 の冪等性の核）。
# 顧客・社内 env は値をリポジトリに書かず ${DIFY_APP_ID_<番号ハイフン無し>} で渡す（CLAUDE.md §2-10）
apps:
  KN-01: { id: '${DIFY_APP_ID_KN01}' }
  KN-02: { id: '${DIFY_APP_ID_KN02}' }
  KN-03: { id: '${DIFY_APP_ID_KN03}' }
  DC-01: { id: '${DIFY_APP_ID_DC01}' }
  DC-02: { id: '${DIFY_APP_ID_DC02}' }
  DC-04: { id: '${DIFY_APP_ID_DC04}' }
  GN-01: { id: '${DIFY_APP_ID_GN01}' }
  GN-02: { id: '${DIFY_APP_ID_GN02}' }
  GN-05: { id: '${DIFY_APP_ID_GN05}' }
  LG-01: { id: '${DIFY_APP_ID_LG01}' }
  LG-04: { id: '${DIFY_APP_ID_LG04}' }
  NM-03: { id: '${DIFY_APP_ID_NM03}' }
