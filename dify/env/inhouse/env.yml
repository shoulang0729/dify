schema: 1
name: inhouse
description: 社内デモ・検証用のセルフホスト Dify。架空世界のまま（顧客ブランドに置換しない）
dify:
  base_url: ${DIFY_BASE_URL}
  console_url: ${DIFY_CONSOLE_URL}
  edition: selfhost
  dsl_version: '0.6.0'
models:                                        # 社内セルフホストは Ollama 想定（2026-09-07 時点で未確認）。モデル名は環境変数で渡す
  chat:       { provider: langgenius/ollama/ollama, name: '${INHOUSE_CHAT_MODEL}', mode: chat, completion_params: { temperature: 0.2 } }
  reasoning:  { provider: langgenius/ollama/ollama, name: '${INHOUSE_REASON_MODEL}', mode: chat }
  kimi:       { provider: langgenius/ollama/ollama, name: '${INHOUSE_REASON_MODEL}', mode: chat }         # role を全 env に定義する（F7）
  qwen_small: { provider: langgenius/ollama/ollama, name: '${INHOUSE_SMALL_MODEL}', mode: chat }
  embedding:  { provider: langgenius/ollama/ollama, name: '${INHOUSE_EMBED_MODEL}' }
  rerank:     { provider: '', name: '' }
  overrides: []
knowledge:
  KN-01: { name: 'KN-01 技術ナレッジQA', id: '${DIFY_DATASET_ID_KN01}' }
  KN-02: { name: 'KN-02 設備マニュアル・取扱説明書の検索', id: '${DIFY_DATASET_ID_KN02}' }
  KN-03: { name: 'KN-03 社内規程・就業規則QA', id: '${DIFY_DATASET_ID_KN03}' }
  GN-01: { name: 'GN-01 経費精算チェック', id: '${DIFY_DATASET_ID_GN01}' }
brand:
  company:      { ja: 青嶺精工株式会社, zh: 青岭精工株式会社, en: 'Seirei Seiko Co., Ltd.' }
  local_entity: { ja: 青嶺精工（蘇州）有限公司, zh: 青岭精工（苏州）有限公司, en: 'Seirei Seiko (Suzhou) Co., Ltd.' }
  sites:
    - { id: suzhou, ja: 蘇州工場, zh: 苏州工厂, en: Suzhou Plant }
    - { id: jp_hq,  ja: 日本本社, zh: 日本总部, en: Japan HQ }
  replace: []
flags: { cross_border: allow, partner_mode: mock, pipl_mask: off }
variables: { site: 蘇州工場, lang: ja }
