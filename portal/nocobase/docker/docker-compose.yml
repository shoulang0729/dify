# portal/nocobase/docker/docker-compose.yml — NocoBase Community + PostgreSQL
#
# 設計書: docs/handoff/2026-09-10-portal-nocobase.md §8-2'（PR-B）・
# docs/handoff/2026-09-11-repo-layout-v3.md §2-3。
#
# 実行場所は run:mac（shoulang0729/dify CLAUDE.md §7。PM の手元でしか動かせないもの）。
# この docker-compose 自体は「定義」であり、実データは含まない。値はすべて .env（ここには無い）から。
#
# G-1〜G-3（方式 (a) の歯止め。schema/README.md 参照）はここと .env.example の両方に同じ値を書く：
#   DB_UNDERSCORED=true / DB_TABLE_PREFIX=nb_ / 業務テーブルの主キーは Flyway 側で bigint IDENTITY

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - portal_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: nocobase/nocobase:1.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT}:80"
    environment:
      APP_KEY: ${APP_KEY}
      APP_PORT: 80
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # ---- G-1〜G-3（方式 (a) の歯止め。初日に決めて以後変更しない。schema/README.md 参照） ----
      DB_UNDERSCORED: "true"
      DB_TABLE_PREFIX: "nb_"
    volumes:
      - portal_app_storage:/app/nocobase/storage

volumes:
  portal_db_data:
  portal_app_storage:
