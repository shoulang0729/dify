name: dify-ops

# W1（#121）：KB 投入（kb_upload.py）とテスト実行（run_tests.py）を GitHub ホストランナーで回す。
# W4-1 PR-2（#121）：kb_refresh（--refresh。更新のみ・削除しない）と kb_replace（--replace。削除して
# 入れ直す）を追加。設計書: docs/handoff/2026-09-08-cloud-auth-and-w4.md §4-2（歯止め K1〜K8）。
# W4-3 PR-5（#121）：op: probe を追加。cloud.dify.ai の前段（Cloudflare）にホストランナーから
# 到達できるかだけを、秘密を一切使わずに確かめる（V5）。設計書: 同ファイル §10・§11「W4-3」。
# 設計書: docs/handoff/2026-09-08-execution-split-and-runner.md（W1 の節・§9 セルフホストランナーの安全性）
#
# PR-1b（#195・#121。2026-09-09）：op: inspect を追加。読み取り専用（GET のみ）で
# Rerank の provider/model 等 6 項目を下書きから採取する（E1。設計書
# docs/handoff/2026-09-09-rerank-decision.md §8 PR-1b・§9-1）。run_tests と同じ理由
# （Dify の状態を変えない読み取り）で承認ゲートの外に出し、DIFY_CONSOLE_REFRESH を
# 読むためだけに environment: dify-cloud-master を宣言する（新しい専用ジョブ inspect。
# 既存 6 op・既存 3 ジョブの挙動は変えない）。
#
# PM 決定（#121。2026-09-09、案 B）：読み取り系の op（probe・run_tests）を承認ゲートの
# 外に出す。probe は秘密を一切使わない疎通確認、run_tests は Dify の状態を変えない読み取りで、
# どちらも「ゲートを通す安全上の意味」が無い。inspect も同じ理由でゲートの外に出す。
#
# **ゲートの外し方は「Environment `dify-cloud-master` の Required reviewers チェックを外す」
# （PM が GitHub の UI で 1 回行う）。ワークフロー側は tests ジョブにも
# `environment: dify-cloud-master` を宣言したままにする**（Required reviewers が無い
# Environment は承認を発生させず、単に secrets/vars のスコープとして機能する）。
# こうすることで DIFY_APP_KEY_* を Repository secret に複製する必要が無くなる
# （12 個のコピーは PM の負担が大きいため却下。案 A は不採用）。
# KB を書き換える op（kb_upload / kb_refresh / kb_replace / both）は元から
# `environment: dify-cloud-master` を宣言しており、変更なし。
# ジョブを 3 つに分け、op ごとに if: でどれか 1 つだけが走るようにする（下の対応表）。
#
# W4-4 PR-6（#121）：op: deploy を追加。`scripts/dify/cloud_deploy.py` を呼び、
# dify/apps/*.yml を render → インポート → 公開する（Mac のドラッグ＆ドロップ 12 回を置き換える本丸。
# 設計書 docs/handoff/2026-09-08-cloud-auth-and-w4.md §9-2・§9-3・§11「W4-4」）。
# 書き込み系のため、`kb` ジョブと同じ扱い（environment を宣言。現状 Required reviewers は
# 外れているため承認は発生しないが、外した／戻した場合の挙動は `kb` と揃う）。
# P1（cloud_deploy.py 側で実装。§9-2）：1 本でもインポートに失敗したら公開は 1 本も行わない。
# B3（cloud_deploy.py 側で実装。§8-7）：DIFY_CONSOLE_REFRESH で認証したセッションは、
# import/publish の成否によらずジョブの最後に必ず logout を試みる。
# `confirm` に固定文字列 `deploy` の入力を要求する（`codes` は最大 12 件のうち何本でもよいため、
# `kb_replace` のように対象そのものを打たせる方式にはしていない。§9-3）。
#
# PR-1（#212。2026-09-09）：op: token_selftest を追加。リフレッシュトークンの自動更新（rotate した
# 値をジョブが Environment secret へ書き戻す）の前段として、**Dify を一切呼ばず**、固定のダミー値を
# 捨て用の別 secret `DIFY_CONSOLE_REFRESH_SELFTEST` に `gh secret set` するだけの自己診断。
# 本物のリフレッシュトークンを 1 回も消費せずに、書き戻し用 PAT `GH_SECRETS_PAT`（Environment secret）
# の権限（V-A：`Secrets` だけで足りるか `Environments` も要るか）・`gh` の封印・Environment 名の綴りを
# 実測できる。設計書 docs/handoff/2026-09-09-refresh-token-writeback.md §4-1・§10 PR-1・§11 V-A・V-D。
#
# PR-2（#212）：`deploy`・`inspect` に書き戻し（Preflight → 本体 → Write back。if: always()）と
# `concurrency`（`cancel-in-progress: false`。load-bearing）を追加。`cloud_deploy.py` 側で B3
# （ジョブ末尾の自動 logout）を書き戻し運用時にスキップする（`safe_logout()`）。
#
# PR-3（#212）：op: token_refresh を追加。`scripts/dify/console_session.py refresh` を呼び、
# `DIFY_CONSOLE_REFRESH` でセッションが有効なことを `list_apps()`（GET のみ）で確かめるだけ
# （Dify のアプリ・KB は一切書き換えない）。**logout はしない**（次回もこのセッションを引き継ぐ
# ため）。rotate した値は `console_api.py` が sink へ自動で書き、`deploy`・`inspect` と同じ
# 書き戻しステップ・concurrency グループを持つ。設計書 §4-6・§10 PR-3。
#
# PR-4（#212）：op: token_revoke を追加。書き戻し運用（PR-2）で失った B3（実行後に必ず
# セッションを殺す）の代わりとなる**手動キルスイッチ**（B3'。設計書 §4-4・§4-6・§10-5）。
# `scripts/dify/console_session.py revoke` が `client.logout()` を呼んで Dify サーバ側の
# セッションを無効化し、続けてこのジョブが `gh secret delete DIFY_CONSOLE_REFRESH` で
# Environment secret も消す（**revoke が失敗しても secret 削除は試みる**。安全側＝次回の実行を
# 確実に「未設定」で止める。§4-4 の対応表 B3'）。書き込み・無効化系のため `confirm` に固定文字列
# `revoke` を要求する。`deploy`・`inspect`・`token_refresh` と同じ concurrency グループに入れる
# （書き戻し中の実行と競合させないため。cancel-in-progress は false のまま）。
#
#   op              | 走るジョブ    | environment          | 使う secrets
#   ----------------|--------------|-----------------------|----------------------------------------------
#   probe           | probe        | 無し                  | 無し
#   run_tests       | tests        | dify-cloud-master     | DIFY_APP_KEY_*（Environment secret。承認は
#                   |              | （承認ゲート無し）    | 発生しない＝Required reviewers を外したため）
#   inspect         | inspect      | dify-cloud-master     | DIFY_CONSOLE_REFRESH（Environment secret。
#                   |              | （承認ゲート無し）    | 承認は発生しない。読み取りのみ＝GET だけ。#195 E1）
#   kb_upload       | kb           | dify-cloud-master     | DIFY_DATASET_KEY・DIFY_APP_KEY_*
#   kb_refresh      | kb           | dify-cloud-master     | DIFY_DATASET_KEY・DIFY_APP_KEY_*
#   kb_replace      | kb           | dify-cloud-master     | DIFY_DATASET_KEY・DIFY_APP_KEY_*
#   both            | kb           | dify-cloud-master     | DIFY_DATASET_KEY・DIFY_APP_KEY_*（kb_upload と
#                   |              |                       | run_tests の両方を行う＝KB を書くためゲート内）
#   deploy          | deploy       | dify-cloud-master     | DIFY_CONSOLE_REFRESH（Environment secret。
#                   |              |                       | 書き込み系。§11「W4-4」）
#   token_selftest  | token_selftest | dify-cloud-master   | GH_SECRETS_PAT（Environment secret。Dify は
#                   |              |                       | 一切呼ばない。#212 PR-1）
#   token_refresh   | token_refresh | dify-cloud-master    | DIFY_CONSOLE_REFRESH・GH_SECRETS_PAT
#                   |              |                       | （読み取りのみ。logout はしない。#212 PR-3）
#   token_revoke    | token_revoke | dify-cloud-master     | DIFY_CONSOLE_REFRESH・GH_SECRETS_PAT
#                   |              |                       | （logout ＋ secret 削除。confirm="revoke"
#                   |              |                       | が必須。#212 PR-4）
#
# 前提（PM が先に行う。dify/DEPLOY.md §7 参照）：
#   - Settings → Environments → `dify-cloud-master` → **Required reviewers のチェックを外す**
#     （これだけ。secrets の再配置は不要）。
#
# ゲートを戻すには Required reviewers を再度有効にすればよい（`tests` と `kb` の両方に
# 承認が復活する。`probe` は environment を持たないので影響を受けない）。`kb` だけに
# 戻したい場合は `kb` 専用の Environment を別に作り、DIFY_DATASET_KEY と DIFY_APP_KEY_*
# をそちらへ移す（`dify/DEPLOY.md` §7 に詳細）。
#
# 重要：トリガは workflow_dispatch だけ。pull_request 系・push 系は絶対に付けない
# （fork PR や push から secrets を含むこのワークフローが起動しないようにするため）。
on:
  workflow_dispatch:
    inputs:
      op:
        description: "実行する操作（kb_refresh=同名文書の中身だけ差し替え／kb_replace=削除して入れ直し。まず kb_refresh を試すこと／probe=秘密を使わない Dify Cloud への到達性確認。codes 不要／inspect=下書きから Rerank 関連 6 項目だけを読み取り専用で採取。#195 E1／deploy=render→インポート→公開。全件インポート成功後にまとめて公開〔P1〕。confirm に \"deploy\" が必須。#121 W4-4／token_selftest=Dify を一切呼ばず、捨て用 secret に書き戻しの自己診断。codes 不要。#212 PR-1／token_refresh=DIFY_CONSOLE_REFRESH でセッションが有効か確認するだけ（読み取りのみ・logout しない）。codes 不要。#212 PR-3／token_revoke=今すぐ Dify のセッションを無効化し DIFY_CONSOLE_REFRESH を削除する手動キルスイッチ。codes 不要。confirm に \"revoke\" が必須。#212 PR-4）"
        required: true
        type: choice
        options:
          - kb_upload
          - kb_refresh
          - kb_replace
          - run_tests
          - both
          - probe
          - inspect
          - deploy
          - token_selftest
          - token_refresh
          - token_revoke
        default: run_tests
      codes:
        description: "対象の管理番号（空白区切り、例: KN-01 DC-01）。kb_replace は削除を伴うため 1 件のみ。op=probe・op=token_selftest・op=token_refresh・op=token_revoke では不要（空でよい）。op=inspect では必須（例: KN-01 KN-02 KN-03 GN-01）。op=deploy は 1〜12 件（12 本全部なら dify/apps/ の全番号を空白区切りで列挙。confirm も必須）"
        required: false
        type: string
        default: ""
      confirm:
        description: "kb_replace／deploy／token_revoke のときだけ必須：kb_replace は codes と完全一致する文字列、deploy は固定文字列 \"deploy\"、token_revoke は固定文字列 \"revoke\" を入力（誤操作防止。他の op では未使用）"
        required: false
        type: string
        default: ""
      env:
        description: "投入・接続先の環境（当面 cloud-master のみ）"
        required: true
        type: choice
        options:
          - cloud-master
        default: cloud-master

# 既定は read only。書き込みが要るジョブだけ job 単位で上げる（CLAUDE.md 準拠：permissions は最小）。
permissions:
  contents: read

jobs:
  # 3 ジョブ共通の入力検証。ここで落ちれば probe / tests / kb はどれも走らない
  # （needs: validate）。検証ロジックは分割前と同一（挙動を変えない）。
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      # 入力は env: 経由でのみ参照する（${{ inputs.* }} を run: の本文に直接書かない）。
      # これにより workflow_dispatch の入力文字列がそのまま shell スクリプトとして
      # 解釈されることを防ぐ（コマンドインジェクション対策）。choice 型でも API 経由の
      # 呼び出しでは任意文字列が来うるため、ここで正規表現により再検証する。
      - name: Validate inputs
        env:
          OP: ${{ inputs.op }}
          CODES: ${{ inputs.codes }}
          CONFIRM: ${{ inputs.confirm }}
          ENV_NAME: ${{ inputs.env }}
        run: |
          set -euo pipefail
          case "$OP" in
            kb_upload|kb_refresh|kb_replace|run_tests|both|probe|inspect|deploy|token_selftest|token_refresh|token_revoke) ;;
            *) echo "::error::op の値が不正です: $OP"; exit 1 ;;
          esac
          # op=probe・op=token_selftest・op=token_refresh・op=token_revoke は秘密を一切使わない、
          # または対象アプリ／KB を指定する意味が無い自己診断・セッション確認・無効化のみのため
          # codes を要求しない（設計書 §11 W4-3 PR-5・
          # docs/handoff/2026-09-09-refresh-token-writeback.md §10 PR-1・PR-3・PR-4）。
          # それ以外の op は従来どおり codes の形式を検証する（op=inspect も対象の管理番号が
          # 必須なのでここを通る）。
          if [ "$OP" = "probe" ] || [ "$OP" = "token_selftest" ] || [ "$OP" = "token_refresh" ] || [ "$OP" = "token_revoke" ]; then
            echo "op=$OP のため codes の検証をスキップします（codes=${CODES:-<空>}）"
          elif ! [[ "$CODES" =~ ^[A-Z]{2}-[0-9]{2}(\ [A-Z]{2}-[0-9]{2})*$ ]]; then
            echo "::error::codes の形式が不正です（例: KN-01 DC-01）: $CODES"
            exit 1
          fi
          case "$ENV_NAME" in
            cloud-master) ;;
            *) echo "::error::env の値が不正です: $ENV_NAME"; exit 1 ;;
          esac

          # kb_replace は文書を削除してから入れ直す（K1〜K5 は kb_upload.py 側で担保）ため、
          # ここでは呼び出し面の歯止め（歯止め K6。設計書 §4-2）を実行に入る前に検証する：
          #   1) codes は 1 件のみ（複数件を一度に削除できないようにする）
          #   2) confirm に codes と完全一致する文字列を要求する（choice の初期値のままでは
          #      通らない＝「うっかり選んだだけでは走らない」形。管理番号そのものを要求するのは、
          #      静的な固定文字列〔例: "replace"〕よりも「対象を打ち直させる」ことで
          #      別の番号を消すコピペミスも同時に防げるため）
          if [ "$OP" = "kb_replace" ]; then
            code_count=$(wc -w <<< "$CODES")
            if [ "$code_count" -ne 1 ]; then
              echo "::error::kb_replace は codes を 1 件だけ指定してください（削除を伴うため。現在: $CODES）"
              exit 1
            fi
            if [ "$CONFIRM" != "$CODES" ]; then
              echo "::error::kb_replace には confirm に対象の管理番号（$CODES）と完全一致する文字列を入力してください"
              exit 1
            fi
          fi

          # deploy は書き込み系（インポート＋公開）のため、誤操作防止の歯止めを 2 つ入れる
          # （設計書 §9-3。Issue #121 W4-4）：
          #   1) codes は最大 12 件（dify/apps/ の本数を超える一括投入を機械的に防ぐ）
          #   2) confirm に固定文字列 "deploy" の入力を要求する（choice の初期値のままでは通らない）。
          #      kb_replace と違い codes と一致させる方式にしていないのは、deploy は 1〜12 件を
          #      柔軟に指定できるため「対象を全部打ち直させる」のが非現実的（12 件を正確に
          #      再入力させるのは誤操作防止としてかえって非現実的）なため
          if [ "$OP" = "deploy" ]; then
            code_count=$(wc -w <<< "$CODES")
            if [ "$code_count" -lt 1 ] || [ "$code_count" -gt 12 ]; then
              echo "::error::deploy は codes を 1〜12 件で指定してください（現在: $code_count 件）"
              exit 1
            fi
            if [ "$CONFIRM" != "deploy" ]; then
              echo "::error::deploy には confirm に固定文字列 \"deploy\" を入力してください"
              exit 1
            fi
          fi

          # token_revoke は Dify のセッションを殺し、Environment secret DIFY_CONSOLE_REFRESH を
          # 削除する破壊的操作（手動キルスイッチ。B3'）のため、confirm に固定文字列 "revoke" の
          # 入力を要求する（設計書 §4-7・§10-5。Issue #212 PR-4）。
          if [ "$OP" = "token_revoke" ]; then
            if [ "$CONFIRM" != "revoke" ]; then
              echo "::error::token_revoke には confirm に固定文字列 \"revoke\" を入力してください"
              exit 1
            fi
          fi

          echo "検証 OK: op=$OP codes=$CODES env=$ENV_NAME"

  # op: probe。秘密を一切使わない（environment 無し・secrets 参照無し）。
  # GitHub ホストランナーから cloud.dify.ai の前段（Cloudflare）に到達できるかだけを確かめる
  # （設計書 §10・§11「W4-3」V5）。読み取りのみで Dify 側に副作用は無いため、承認ゲート
  # （environment）の外に出す（PM 決定。#121）。
  probe:
    name: "probe（op: probe）"
    needs: validate
    if: ${{ inputs.op == 'probe' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read   # push しないので read のみでよい
    timeout-minutes: 45
    steps:
      # W4-3 PR-5（#121）：GitHub ホストランナーから cloud.dify.ai の前段
      # （Cloudflare）に到達できるかだけを確かめる（設計書 §10・§11「W4-3」V5）。
      # なぜ secrets を一切参照しないか：見たいのは Cloudflare の前段だけであり、
      # 認証が通る必要が無いため。Dify のアカウントに紐づく秘密（DIFY_DATASET_KEY /
      # DIFY_APP_KEY_*）はこのジョブに一切渡らない（job に environment を付けていない。
      # load-bearing）。GET のみ（POST/PUT/DELETE を送らない）。Dify 側に副作用は出さない。
      - name: "Probe Dify Cloud reachability (op: probe)"
        run: |
          set -euo pipefail

          # console_api.py / kb_upload.py / run_tests.py と同一の User-Agent
          # （Cloudflare の error 1010 対策。DI-004 の前例）。新しい文字列は作らない。
          UA_PRIMARY="dify-scripts/1.0 (+https://github.com/shoulang0729/dify)"
          UA_FALLBACK="Mozilla/5.0 (compatible; dify-scripts-probe/1.0)"
          URL="https://cloud.dify.ai/console/api/setup"

          # $1: 使う User-Agent。/tmp/dify-ops-probe-code.txt に HTTP status
          # （接続失敗なら 000）、/tmp/dify-ops-probe-body.txt に本文を書く。
          probe_once() {
            local ua="$1"
            local out code
            out="$(mktemp)"
            if ! code="$(curl -sS -m 20 -o "$out" -w '%{http_code}' -H "User-Agent: ${ua}" "$URL")"; then
              code="000"
            fi
            echo "$code" > /tmp/dify-ops-probe-code.txt
            mv "$out" /tmp/dify-ops-probe-body.txt
          }

          # 判定（judge）の結果にかかわらず、レスポンス本文を Job Summary に残す。
          # なぜ本文をそのまま出してよいか：`GET /console/api/setup` は認証情報を
          # 送らない公開エンドポイントで、この probe ジョブは secrets.* を 1 つも
          # 参照しない（reviewer が機械的に確認済み）。**将来このステップに認証を
          # 足す場合は、この「本文をそのまま出す」前提を見直すこと**（load-bearing）。
          # 本文が「成功」判定でも人が目視で確認できないと、judge() の見逃し
          # （§10 コメントに明記した Cloudflare 表記ゆれ）に誰も気づけないため、
          # 成功・失敗を問わず必ず出す。
          # $1: 見出し（例: "1 回目"）, $2: 使った User-Agent, $3: HTTP status, $4: 本文ファイル
          dump_body_to_summary() {
            local label="$1" ua="$2" code="$3" body_file="$4"
            local max_bytes=2000
            local total_size head_content note=""
            total_size="$(wc -c < "$body_file" | tr -d ' ')"
            head_content="$(head -c "$max_bytes" "$body_file")"
            if [ "$total_size" -gt "$max_bytes" ]; then
              note=" ／先頭 ${max_bytes} 文字に切り詰め（全体 ${total_size} 文字）"
            fi
            {
              echo "<details><summary>${label}の応答本文（User-Agent: \`${ua}\`／HTTP status: \`${code}\`${note}）</summary>"
              echo
              echo '```'
              if [ -z "$head_content" ]; then
                echo "(本文なし)"
              else
                printf '%s\n' "$head_content"
              fi
              echo '```'
              echo "</details>"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Cloudflare のブロック本文特有のシグネチャだけに照合を狭める（reviewer 指摘）。
          # 設計書 §10・DEPLOY.md §4 が示す表記 "error code: 1010" に、大小文字・コロン
          # 前後の空白ゆれだけを許容して合わせる（"error code" の直後に "1010" が続く形）。
          # 単純な部分一致 "1010" だと、Cloudflare と無関係な 403（本文の request_id や
          # 件数などに偶然 "1010" という数字が含まれるだけのもの）まで「弾かれた」と誤判定する。
          #
          # 検出できる：実際に観測されている Cloudflare のブロック本文の表記
          # "error code: 1010"（大文字小文字・コロン前後の空白ゆれを含む）。
          #
          # 見逃しうる：Cloudflare がブロック本文の文言を変えた場合（例：コロンを付けない
          # "error code 1010"、見出しだけの "Error 1010"、日本語化された文言、HTML タグが
          # "code" と "1010" の間に挟まる表記）。その場合はこの probe が「成功」と誤って
          # 判定しうる。これは verify.mjs §15 の削除系 API 検査と同じ考え方（機械検査は
          # 完全ではない）で、V5 の一次判定として使い、実機で疑わしい結果が出たら本文を
          # 目視で確認すること。
          #
          # $1: HTTP status, $2: 本文ファイル
          # 戻り値：0=成功／1=Cloudflare に弾かれた（403+error code: 1010）／2=接続失敗（000）／3=想定外コード
          judge() {
            local code="$1" body_file="$2"
            if [ "$code" = "000" ]; then
              return 2
            fi
            case "$code" in
              200|401|403)
                if [ "$code" = "403" ] && grep -qiE 'error[[:space:]]*code[[:space:]]*:[[:space:]]*1010' "$body_file"; then
                  return 1
                fi
                return 0
                ;;
              *)
                return 3
                ;;
            esac
          }

          probe_once "$UA_PRIMARY"
          code1="$(cat /tmp/dify-ops-probe-code.txt)"
          cp /tmp/dify-ops-probe-body.txt /tmp/dify-ops-probe-body1.txt
          set +e
          judge "$code1" /tmp/dify-ops-probe-body1.txt
          result1=$?
          set -e

          # 403 + error code: 1010（Cloudflare）のときだけ、設計書 §10 のとおり
          # User-Agent を変えて 1 回だけ再試行する。
          retried=false
          code2=""
          result2=""
          if [ "$result1" -eq 1 ]; then
            retried=true
            probe_once "$UA_FALLBACK"
            code2="$(cat /tmp/dify-ops-probe-code.txt)"
            cp /tmp/dify-ops-probe-body.txt /tmp/dify-ops-probe-body2.txt
            set +e
            judge "$code2" /tmp/dify-ops-probe-body2.txt
            result2=$?
            set -e
          fi

          final_result="$result1"
          final_code="$code1"
          if [ "$retried" = true ]; then
            final_result="$result2"
            final_code="$code2"
          fi

          # 標準出力にも判定材料を出す（Job Summary は Actions API から読めないため。#121）。
          echo "probe: 1 回目 HTTP status=${code1}"
          if [ "$retried" = true ]; then
            echo "probe: 2 回目（再試行）HTTP status=${code2}"
          fi

          {
            echo "## probe（op: probe）— Dify Cloud への到達性確認"
            echo
            echo "設計書: docs/handoff/2026-09-08-cloud-auth-and-w4.md §10・§11（W4-3 V5）"
            echo
            echo "- 1 回目 User-Agent: \`${UA_PRIMARY}\`"
            echo "- 1 回目 HTTP status: \`${code1}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$retried" = true ]; then
            {
              echo "- 2 回目 User-Agent（再試行）: \`${UA_FALLBACK}\`"
              echo "- 2 回目 HTTP status: \`${code2}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo >> "$GITHUB_STEP_SUMMARY"

          # 成功・失敗を問わず、判定に使った本文をそのまま残す（reviewer 指摘）。
          # 「疑わしい結果が出たら本文を目視で確認する」を実行可能にするため。
          dump_body_to_summary "1 回目" "$UA_PRIMARY" "$code1" /tmp/dify-ops-probe-body1.txt
          if [ "$retried" = true ]; then
            dump_body_to_summary "2 回目（再試行）" "$UA_FALLBACK" "$code2" /tmp/dify-ops-probe-body2.txt
          fi

          case "$final_result" in
            0)
              echo "probe: 判定=成功 (final_code=${final_code})"
              echo "**結果: 成功。** 200 / 401 / 403（本文に Cloudflare のシグネチャ \`error code: 1010\` を含まない）を確認した。前段（Cloudflare）は通っている。Cookie 案（W4-3）は成立しうる。" >> "$GITHUB_STEP_SUMMARY"
              echo "OVERALL_RC=0" >> "$GITHUB_ENV"
              ;;
            1)
              echo "probe: 判定=失敗（Cloudflare error code: 1010） (final_code=${final_code})"
              echo "**結果: 失敗。Cloudflare が弾いている（403 かつ本文に \`error code: 1010\`）。** User-Agent を変えて再試行しても解消しなかった。**W4-3 は保留**とし、DI として起票すること。" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::probe 失敗: Cloudflare（error code: 1010）にホストランナーが弾かれた。W4-3 は保留。DI 起票が必要。"
              echo "OVERALL_RC=1" >> "$GITHUB_ENV"
              ;;
            2)
              echo "probe: 判定=判定不能（接続失敗）"
              echo "**結果: 判定不能。** 接続に失敗した（タイムアウト・DNS 失敗など。HTTP status を取得できなかった）。ネットワーク自体の問題の可能性がある。再実行するか、ランナーの egress を確認すること。" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::probe 判定不能: 接続に失敗した（HTTP status 000）。"
              echo "OVERALL_RC=1" >> "$GITHUB_ENV"
              ;;
            *)
              echo "probe: 判定=判定不能（想定外の HTTP status ${final_code}）"
              echo "**結果: 判定不能。** 想定外の HTTP status \`${final_code}\` を受け取った。設計書 §10 の想定（200/401/403）の外なので、手動で確認すること。" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::probe 判定不能: 想定外の HTTP status ${final_code}。"
              echo "OVERALL_RC=1" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Fail the job if probe failed
        if: always()
        run: |
          set -euo pipefail
          rc="${OVERALL_RC:-0}"
          if [ "$rc" != "0" ]; then
            echo "::error::probe が失敗しました（詳細は上のログと Job Summary を参照）。"
            exit 1
          fi

  # op: run_tests。Dify の状態を変えない読み取り専用の操作なので、承認は要らない
  # （PM 決定・案 B。#121）。**`environment: dify-cloud-master` はあえて宣言したままにする**：
  # Required reviewers は PM が GitHub の UI で外しているため承認は発生しないが、
  # environment を宣言することで DIFY_APP_KEY_*（Environment secret）をそのまま読める。
  # これにより DIFY_APP_KEY_* を Repository secret に複製する必要が無い（上部コメント参照）。
  tests:
    name: "tests（op: run_tests）"
    needs: validate
    if: ${{ inputs.op == 'run_tests' }}
    runs-on: ubuntu-latest
    # Required reviewers を外してあるため、ここで承認待ちにはならない（PM 決定・案 B）。
    # 宣言する目的は secrets/vars のスコープを dify-cloud-master に合わせることだけ。
    environment: dify-cloud-master
    permissions:
      contents: write   # 結果ブランチの push（PR は作らないので pull-requests は不要）
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install pyyaml

      # キーの値は一切出力しない。「設定されているか」だけを確認する。
      # set -x は使わない。env / printenv は使わない。
      # run_tests は DIFY_DATASET_KEY（KB 書き換え用の鍵）を使わないため確認しない。
      - name: Check secrets presence (values are never printed)
        env:
          CODES: ${{ inputs.codes }}
        run: |
          set -euo pipefail
          for code in $CODES; do
            var="DIFY_APP_KEY_${code//-/}"
            if [ -n "${!var:-}" ]; then
              echo "$var: set"
            else
              echo "$var: unset（run_tests で $code を使う場合は必要）"
            fi
          done
        # per-code の app key は次のステップで env: に列挙して渡す（GitHub Actions は
        # secrets.<name> を実行時に動的合成できないため、使いうるものを列挙する）

      - name: Run run_tests.py
        id: run
        env:
          OP: ${{ inputs.op }}
          CODES: ${{ inputs.codes }}
          ENV_NAME: ${{ inputs.env }}
          DIFY_BASE_URL: ${{ vars.DIFY_BASE_URL }}
          # 12 本の Service API キー（dify/apps/*.yml の管理番号ぶん）。無いものは空文字のまま
          # スクリプト側が「未設定」として扱う（値は出力しない）。新しいアプリを足したら
          # この一覧にも 1 行足す（dify/DEPLOY.md §7 に運用メモあり）。
          # このジョブは environment: dify-cloud-master を宣言しているので、
          # Environment secret（kb ジョブと同じもの）をそのまま読める。
          DIFY_APP_KEY_DC01: ${{ secrets.DIFY_APP_KEY_DC01 }}
          DIFY_APP_KEY_DC02: ${{ secrets.DIFY_APP_KEY_DC02 }}
          DIFY_APP_KEY_DC04: ${{ secrets.DIFY_APP_KEY_DC04 }}
          DIFY_APP_KEY_GN01: ${{ secrets.DIFY_APP_KEY_GN01 }}
          DIFY_APP_KEY_GN02: ${{ secrets.DIFY_APP_KEY_GN02 }}
          DIFY_APP_KEY_GN05: ${{ secrets.DIFY_APP_KEY_GN05 }}
          DIFY_APP_KEY_KN01: ${{ secrets.DIFY_APP_KEY_KN01 }}
          DIFY_APP_KEY_KN02: ${{ secrets.DIFY_APP_KEY_KN02 }}
          DIFY_APP_KEY_KN03: ${{ secrets.DIFY_APP_KEY_KN03 }}
          DIFY_APP_KEY_LG01: ${{ secrets.DIFY_APP_KEY_LG01 }}
          DIFY_APP_KEY_LG04: ${{ secrets.DIFY_APP_KEY_LG04 }}
          DIFY_APP_KEY_NM03: ${{ secrets.DIFY_APP_KEY_NM03 }}
        run: |
          set -euo pipefail
          overall_rc=0

          {
            echo "## dify-ops 実行結果"
            echo
            echo "- 操作: \`$OP\`"
            echo "- 対象: \`$CODES\`"
            echo "- 環境: \`$ENV_NAME\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          echo "== run_tests.py $CODES =="
          # run_tests.py 自身が末尾に "合計: 合格数 / 総数 合格" を標準出力へ print する
          # （パイプ・リダイレクトを挟まないのでそのまま Actions のログに出る。#121 観測性）。
          if python3 scripts/dify/run_tests.py --env "$ENV_NAME" $CODES; then
            echo "run_tests: 判定=全件合格 (rc=0)"
            echo "- run_tests: 全件合格" >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            if [ "$rc" -eq 2 ]; then
              echo "run_tests: 判定=設定不備 (rc=2)"
              echo "- run_tests: 設定不備（exit 2。API キー未設定などを確認）" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "run_tests: 判定=不合格あり (rc=$rc)"
              echo "- run_tests: 不合格あり（exit $rc）" >> "$GITHUB_STEP_SUMMARY"
            fi
            overall_rc=1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "OVERALL_RC=$overall_rc" >> "$GITHUB_ENV"
          # このステップ自体は失敗させない。結果の合否はサマリと生成される
          # dify/results/**/*.md（PR の diff）で判断する（設計書 §4-3）。
          exit 0

      # push の直前に、ステージ済みファイルがすべて許容パターンに一致するかを確認する。
      # 1 つでも外れたら push せずに失敗させる（#121「生成物の二重生成」対策。load-bearing）。
      - name: Stage results and guard changed paths
        run: |
          set -euo pipefail
          # 生成物の置き場だけを対象にステージする。
          # 注意：git add は複数 pathspec のうち 1 つでも存在しないと全体が失敗する。
          # dify/state/ は W2 で導入予定でまだ無いため、必ず 1 つずつ add する
          # （まとめて書くと dify/results/ までステージされない。実測で確認済み）。
          for p in dify/results/ dify/state/; do
            [ -d "$p" ] || continue
            git add -A -- "$p"
          done

          changed="$(git diff --cached --name-only)"
          if [ -z "$changed" ]; then
            echo "変更なし。push しません。" >> "$GITHUB_STEP_SUMMARY"
            echo "HAS_CHANGES=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "$changed" > /tmp/dify-ops-changed.txt

          bad=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! [[ "$f" =~ ^dify/results/[^/]+/[^/]+\.md$ ]] && ! [[ "$f" =~ ^dify/state/[^/]+\.yml$ ]]; then
              echo "::error::変更パスガード違反（許容パターン外）: $f"
              bad=1
            fi
          done < /tmp/dify-ops-changed.txt

          if [ "$bad" -eq 1 ]; then
            {
              echo ""
              echo "**変更パスガードに違反したため push していません。** dify/results/<env>/*.md・dify/state/<env>.yml 以外が生成されています。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "HAS_CHANGES=true" >> "$GITHUB_ENV"
          echo "変更パスガード: OK（$(echo "$changed" | wc -l) 件）" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push the result branch
        if: env.HAS_CHANGES == 'true'
        env:
          OP: ${{ inputs.op }}
          CODES: ${{ inputs.codes }}
          ENV_NAME: ${{ inputs.env }}
          BRANCH: bot/dify-ops-${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "dify-ops-bot"
          git config user.email "dify-ops-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit \
            -m "dify-ops(${ENV_NAME}): ${OP} ${CODES}" \
            -m "Run: ${RUN_URL}" \
            -m "Co-Authored-By: dify-ops-bot <dify-ops-bot@users.noreply.github.com>"
          git push -u origin "$BRANCH"

          {
            echo "## dify-ops 自動実行結果"
            echo
            echo "- 操作: \`${OP}\`"
            echo "- 対象: \`${CODES}\`"
            echo "- 環境: \`${ENV_NAME}\`"
            echo "- 結果ブランチ: \`${BRANCH}\`"
            echo "- 実行ログ: ${RUN_URL}"
            echo
            echo "**PR はこのワークフローでは作りません。** 人が次のリンクから作ってください。"
            echo
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/new/${BRANCH}"
            echo
            echo "PR 作成を自動化するには Settings → Actions → General の"
            echo "「Allow GitHub Actions to create and approve pull requests」を ON にする必要があるが、"
            echo "この設定は PR の**承認**能力も同時に与えるため、PM 判断で ON にしない（#121 W1）。"
            echo
            echo "**main への直 push は行っていません。マージは人が内容を読んでから**（CLAUDE.md §5）。"
            echo
            echo "### 変更ファイル"
            echo
            echo '```'
            cat /tmp/dify-ops-changed.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job if run_tests failed
        if: always()
        run: |
          set -euo pipefail
          rc="${OVERALL_RC:-0}"
          if [ "$rc" != "0" ]; then
            echo "::error::run_tests が失敗しました（詳細は Job Summary と PR の結果ファイルを参照）。"
            exit 1
          fi

  # op: inspect（PR-1b。#195 E1／設計書 docs/handoff/2026-09-09-rerank-decision.md §8 PR-1b・§9-1）。
  # 下書き（GET /console/api/apps/{id}/workflows/draft）から Rerank 関連の 6 項目だけを
  # 読み取り専用で採取する。Dify の状態を一切変更しないため、run_tests と同じ理由で承認ゲートの
  # 外に置く（Required reviewers は既に外れているため、environment を宣言しても承認待ちにはならない。
  # 宣言する目的は DIFY_CONSOLE_REFRESH（Environment secret）をそのまま読めるようにするためだけ）。
  # 書き込み系 API は一切呼ばない（scripts/dify/inspect_rerank.py は get_draft() の GET のみを使う。
  # DELETE／POST（読み取り以外）／PATCH／PUT は送らない。tools/verify.mjs §15 の「DELETE を送る
  # 関数は kb_upload.py の delete_document のみ」を破らない）。何も commit しない
  # （dify/results/**・dify/state/** 以外を書かない歯止めの対象ですらない＝そもそも何も書かない設計）。
  # 結果は Job Summary と標準出力の両方に残す（PR #198 レビュー指摘：Job Summary だけだと
  # Actions API から読めず目視確認ができないため）。
  #
  # PR-2（#212）：deploy ジョブと同じ書き戻し（Preflight → 本体 → Write back。if: always()）と
  # concurrency を持つ（inspect も DIFY_CONSOLE_REFRESH を消費するため。設計書 §4-1〜§4-5・§5）。
  inspect:
    name: "inspect（op: inspect）"
    needs: validate
    if: ${{ inputs.op == 'inspect' }}
    runs-on: ubuntu-latest
    # Required reviewers は外れているためここで承認待ちにはならない。宣言するのは
    # DIFY_CONSOLE_REFRESH（Environment secret。kb/tests ジョブと同じもの）を読むためだけ。
    environment: dify-cloud-master
    permissions:
      contents: read   # 何も commit しないため read のみでよい（書き戻しは GH_SECRETS_PAT で行う）
    timeout-minutes: 30
    concurrency:
      group: dify-console-${{ inputs.env }}
      # cancel-in-progress は絶対に true にしない（deploy ジョブのコメント参照。load-bearing）。
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install pyyaml

      # 値は一切出力しない。「設定されているか」だけを確認する（他ジョブと同じ作法）。
      - name: Check secrets presence (values are never printed)
        env:
          DIFY_CONSOLE_REFRESH: ${{ secrets.DIFY_CONSOLE_REFRESH }}
        run: |
          set -euo pipefail
          if [ -n "${DIFY_CONSOLE_REFRESH:-}" ]; then
            echo "DIFY_CONSOLE_REFRESH: set"
          else
            echo "DIFY_CONSOLE_REFRESH: unset（op: inspect に必須。dify/DEPLOY.md §8 を参照）"
          fi

      # PR-2（#212）：GH_SECRETS_PAT の有無だけを見る（値は出さない）。あれば書き戻し運用を
      # 有効にする（DIFY_REFRESH_SINK を設定）。無ければ何も設定しない＝従来どおり（B7。§4-5）。
      - name: "Preflight (write-back): PAT の有無だけを見る"
        env:
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          set -euo pipefail
          echo "JOB_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
          if [ -n "${GH_SECRETS_PAT:-}" ]; then
            echo "GH_SECRETS_PAT: set（書き戻し運用が有効になります）"
            echo "WRITEBACK=1" >> "$GITHUB_ENV"
            echo "DIFY_REFRESH_SINK=${RUNNER_TEMP}/dify-refresh.new" >> "$GITHUB_ENV"
          else
            echo "GH_SECRETS_PAT: unset"
            echo "WRITEBACK=0" >> "$GITHUB_ENV"
            {
              echo "> \`GH_SECRETS_PAT\` が未設定のため、**従来どおりの使い切り運用**で実行します（実行後にリフレッシュトークンは無効化されます。次回は取り直しが必要です）。自動更新を有効にする手順は \`dify/DEPLOY.md\` §10-2。"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Run inspect_rerank.py (op: inspect)"
        id: run
        env:
          CODES: ${{ inputs.codes }}
          ENV_NAME: ${{ inputs.env }}
          DIFY_CONSOLE_REFRESH: ${{ secrets.DIFY_CONSOLE_REFRESH }}
          DIFY_REFRESH_SINK: ${{ env.DIFY_REFRESH_SINK }}
        run: |
          set -euo pipefail
          overall_rc=0

          {
            echo "## dify-ops 実行結果（op: inspect）"
            echo
            echo "- 操作: \`inspect\`"
            echo "- 対象: \`$CODES\`"
            echo "- 環境: \`$ENV_NAME\`"
            echo "- 設計書: docs/handoff/2026-09-09-rerank-decision.md §8 PR-1b・§9-1（Issue #195・#121）"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          out_file="$(mktemp)"
          echo "== inspect_rerank.py $CODES =="
          # shellcheck disable=SC2086  # CODES は validate ジョブで正規表現検証済み（管理番号の空白区切りのみ）
          if python3 scripts/dify/inspect_rerank.py --env "$ENV_NAME" $CODES 2>&1 | tee "$out_file"; then
            echo "inspect: 判定=完了 (rc=0)"
            echo "- inspect: 完了" >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            echo "inspect: 判定=失敗 (rc=$rc)"
            echo "- inspect: 失敗（exit $rc。アプリ未検出または API エラーの可能性）" >> "$GITHUB_STEP_SUMMARY"
            overall_rc=1
          fi

          {
            echo
            echo "<details><summary>inspect_rerank.py の出力</summary>"
            echo
            echo '```'
            cat "$out_file"
            echo '```'
            echo "</details>"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$out_file"

          echo "OVERALL_RC=$overall_rc" >> "$GITHUB_ENV"
          # このステップ自体は失敗させない。合否は Fail the job ステップで判定する（他ジョブと同じ作法）。
          exit 0

      - name: "Write back the rotated refresh token, if any (PR-2. #212)"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          GH_REPO: ${{ github.repository }}
          SINK: ${{ runner.temp }}/dify-refresh.new
          TARGET_ENV: dify-cloud-master        # 固定。inputs.* からは作らない（r3）
          TARGET_SECRET: DIFY_CONSOLE_REFRESH  # 固定。inputs.* からは作らない（r3）
        run: |
          set -euo pipefail            # set -x は禁止。env / printenv も使わない

          if [ ! -s "$SINK" ]; then
            echo "[WB] rotate していないため書き戻し不要（sink が無い、または空）"
            exit 0
          fi

          fail_writeback() {
            echo "::error::[要対応] リフレッシュトークンの書き戻しに失敗しました。Environment secret DIFY_CONSOLE_REFRESH はもう使えません（この実行で rotate 済み＝古い値は失効しています）。次回の実行は必ず認証エラー（exit 3）になります。dify/DEPLOY.md §10-4 の手順で取り直してください。"
            echo "$1"
            {
              echo "## ⚠️ リフレッシュトークンの書き戻しに失敗しました（要対応）"
              echo
              echo "**いま何が起きているか**"
              echo
              echo "- この実行はリフレッシュトークンを 1 回使いました（rotate）。**Environment secret \`DIFY_CONSOLE_REFRESH\` に入っている値は、もう死んでいます。**"
              echo "- 新しい値はこのランナーの中にだけありましたが、**GitHub の secret に書き戻せませんでした**。ランナーは実行後に破棄されるため、**新しい値は失われました**。"
              echo "- **Dify 側は壊れていません**（この実行の結果は上の欄のとおりです）。次回の実行が認証エラー（exit 3）になるだけです。"
              echo
              echo "**PM がすること（3 分。1 回だけ）**"
              echo
              echo "1. \`dify/DEPLOY.md\` §10-4「取り直し」の手順でリフレッシュトークンを取り直す"
              echo "2. Environment \`dify-cloud-master\` の \`DIFY_CONSOLE_REFRESH\` を **Update** で貼り直す"
              echo "3. \`op: token_refresh\` を 1 回だけ回して、書き戻しが直っているかを確かめる（**Dify には何も書き込みません**）"
              echo
              echo "**原因の切り分け（上のログの \`[WB]\` 行を見る）**"
              echo
              echo "| \`[WB]\` の行 | 原因 | 直し方 |"
              echo "|---|---|---|"
              echo "| \`PAT 未設定\` | Environment secret \`GH_SECRETS_PAT\` が無い／空 | \`dify/DEPLOY.md\` §10-2 |"
              echo "| \`gh secret set 失敗\` かつ HTTP 403 | PAT の権限不足、または期限切れ | §10-2 の権限表を確認。期限切れなら作り直す |"
              echo "| \`gh secret set 失敗\` かつ HTTP 404 | PAT のリポジトリ選択違い／Environment 名の綴り違い | §10-2 の手順 7・10 |"
              echo "| \`形式検査に失敗\` | 実装の不具合（secret には**書き込んでいません**） | Issue を立てる。取り直しでは直らない |"
              echo "| \`反映が確認できない\` | GitHub 側の一時障害の可能性 | もう一度 \`op: token_refresh\` を試す |"
            } >> "$GITHUB_STEP_SUMMARY"
            rm -f "$SINK"
            exit 1
          }

          if [ -z "${GH_TOKEN:-}" ]; then
            fail_writeback "[WB] PAT 未設定（Environment secret GH_SECRETS_PAT が空）"
          fi

          # 形式検査（設計書 §4-7 手順 3）：想定の文字種・長さ・行数 1・末尾改行なし。
          line_count="$(awk 'END{print NR}' "$SINK")"
          trailing_nl="$(tail -c 1 "$SINK" | wc -l | tr -d ' ')"
          format_ok=0
          if LC_ALL=C grep -qE '^[A-Za-z0-9._~+/=-]{20,4096}$' "$SINK" && [ "$line_count" = "1" ] && [ "$trailing_nl" = "0" ]; then
            format_ok=1
          fi
          if [ "$format_ok" -ne 1 ]; then
            fail_writeback "[WB] 形式検査に失敗（実装の不具合。secret には書き込んでいません）"
          fi

          ok=0
          for i in 1 2 3; do
            if gh secret set "$TARGET_SECRET" --env "$TARGET_ENV" < "$SINK"; then
              ok=1
              break
            fi
            echo "gh secret set が失敗しました（${i} 回目）。再試行します…"
            sleep $((i * 5))
          done

          if [ "$ok" -ne 1 ]; then
            fail_writeback "[WB] gh secret set 失敗（3 回リトライ後）"
          fi

          rm -f "$SINK"

          # 反映確認（設計書 §4-7 手順 7）：updatedAt がこのジョブの開始時刻より後であること。
          updated_ok=0
          updated_at=""
          if gh secret list --env "$TARGET_ENV" --json name,updatedAt > "$RUNNER_TEMP/writeback-list.json" 2>/dev/null; then
            updated_at="$(python3 -c 'import json,os; data=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "writeback-list.json"), encoding="utf-8")); rows=[r.get("updatedAt") for r in data if r.get("name")==os.environ["TARGET_SECRET"]]; print(rows[0] if rows else "")')"
            if [ -n "$updated_at" ]; then
              updated_epoch="$(date -u -d "$updated_at" +%s 2>/dev/null || echo 0)"
              if [ "$updated_epoch" -gt "${JOB_START_EPOCH:-0}" ]; then
                updated_ok=1
              fi
            fi
          else
            echo "V-D: --json 未対応の gh バージョンのため名前だけのフォールバック表示を使います（値は出ません）"
            if gh secret list --env "$TARGET_ENV" | grep -q "$TARGET_SECRET"; then
              updated_ok=1   # 時刻での厳密な確認はできないため、secret の存在確認のみで成功扱いとする
            fi
          fi

          if [ "$updated_ok" -ne 1 ]; then
            fail_writeback "[WB] 反映が確認できない（gh は成功を返したが updatedAt が更新されていない）"
          fi

          echo "[WB] 書き戻し成功（updated_at: ${updated_at:-不明}）"
          {
            echo "🔑 リフレッシュトークンを更新しました（updated_at: ${updated_at:-不明}）。次回もそのまま実行できます。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job if inspect failed
        if: always()
        run: |
          set -euo pipefail
          rc="${OVERALL_RC:-0}"
          if [ "$rc" != "0" ]; then
            echo "::error::inspect が失敗しました（詳細は上のログと Job Summary を参照）。"
            exit 1
          fi

  # op: kb_upload / kb_refresh / kb_replace / both。KB を書き換えるため、
  # Environment `dify-cloud-master`（required reviewers）の承認ゲートを残す。
  kb:
    name: "kb（op: kb_upload / kb_refresh / kb_replace / both）"
    needs: validate
    if: ${{ inputs.op == 'kb_upload' || inputs.op == 'kb_refresh' || inputs.op == 'kb_replace' || inputs.op == 'both' }}
    runs-on: ubuntu-latest
    # Environment `dify-cloud-master` に required reviewers（PM）を付けるのは GitHub UI 側の設定。
    # ワークフローはこの environment を宣言するだけで、承認が済むまでここで止まる。
    environment: dify-cloud-master
    permissions:
      contents: write        # 結果ブランチの push（PR は作らないので pull-requests は不要）
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install pyyaml

      # キーの値は一切出力しない。「設定されているか」だけを確認する。
      # set -x は使わない。env / printenv は使わない。
      - name: Check secrets presence (values are never printed)
        env:
          DIFY_DATASET_KEY: ${{ secrets.DIFY_DATASET_KEY }}
          CODES: ${{ inputs.codes }}
        run: |
          set -euo pipefail
          [ -n "${DIFY_DATASET_KEY:-}" ] && echo "DIFY_DATASET_KEY: set" || echo "DIFY_DATASET_KEY: unset（kb_upload / kb_refresh / kb_replace で必要）"
          for code in $CODES; do
            var="DIFY_APP_KEY_${code//-/}"
            if [ -n "${!var:-}" ]; then
              echo "$var: set"
            else
              echo "$var: unset（both で run_tests も行う場合は必要）"
            fi
          done
        # per-code の app key は次のステップで env: に列挙して渡す（GitHub Actions は
        # secrets.<name> を実行時に動的合成できないため、使いうるものを列挙する）

      - name: Run kb_upload.py / run_tests.py
        id: run
        env:
          OP: ${{ inputs.op }}
          CODES: ${{ inputs.codes }}
          ENV_NAME: ${{ inputs.env }}
          DIFY_DATASET_KEY: ${{ secrets.DIFY_DATASET_KEY }}
          DIFY_BASE_URL: ${{ vars.DIFY_BASE_URL }}
          # 12 本の Service API キー（dify/apps/*.yml の管理番号ぶん）。無いものは空文字のまま
          # スクリプト側が「未設定」として扱う（値は出力しない）。新しいアプリを足したら
          # この一覧にも 1 行足す（dify/DEPLOY.md §7 に運用メモあり）。both のときの
          # run_tests 実行にも使う。
          DIFY_APP_KEY_DC01: ${{ secrets.DIFY_APP_KEY_DC01 }}
          DIFY_APP_KEY_DC02: ${{ secrets.DIFY_APP_KEY_DC02 }}
          DIFY_APP_KEY_DC04: ${{ secrets.DIFY_APP_KEY_DC04 }}
          DIFY_APP_KEY_GN01: ${{ secrets.DIFY_APP_KEY_GN01 }}
          DIFY_APP_KEY_GN02: ${{ secrets.DIFY_APP_KEY_GN02 }}
          DIFY_APP_KEY_GN05: ${{ secrets.DIFY_APP_KEY_GN05 }}
          DIFY_APP_KEY_KN01: ${{ secrets.DIFY_APP_KEY_KN01 }}
          DIFY_APP_KEY_KN02: ${{ secrets.DIFY_APP_KEY_KN02 }}
          DIFY_APP_KEY_KN03: ${{ secrets.DIFY_APP_KEY_KN03 }}
          DIFY_APP_KEY_LG01: ${{ secrets.DIFY_APP_KEY_LG01 }}
          DIFY_APP_KEY_LG04: ${{ secrets.DIFY_APP_KEY_LG04 }}
          DIFY_APP_KEY_NM03: ${{ secrets.DIFY_APP_KEY_NM03 }}
        run: |
          set -euo pipefail
          overall_rc=0

          {
            echo "## dify-ops 実行結果"
            echo
            echo "- 操作: \`$OP\`"
            echo "- 対象: \`$CODES\`"
            echo "- 環境: \`$ENV_NAME\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # $1: kb_upload.py に渡す追加フラグ（"" / "--refresh" / "--replace"）
          # $2: Job Summary・標準出力に出す操作名のラベル
          run_kb() {
            local flag="$1"
            local label="$2"
            local ok_count=0 fail_count=0 skip_count=0
            for code in $CODES; do
              if [ ! -d "dify/kb/$code" ]; then
                echo "kb_upload($label): $code スキップ（dify/kb/$code が無い）"
                echo "- KB \`$code\` (\`$label\`): スキップ（dify/kb/$code が無い）" >> "$GITHUB_STEP_SUMMARY"
                skip_count=$((skip_count + 1))
                continue
              fi
              echo "== kb_upload.py ${flag:+$flag }$code =="
              out_file="$(mktemp)"
              # shellcheck disable=SC2086  # flag は "" か固定の 1 語のみ（呼び出し元で決め打ち。inputs は渡さない）
              if python3 scripts/dify/kb_upload.py --env "$ENV_NAME" $flag "$code" 2>&1 | tee "$out_file"; then
                echo "kb_upload($label): $code OK"
                echo "- KB \`$code\` (\`$label\`): OK" >> "$GITHUB_STEP_SUMMARY"
                ok_count=$((ok_count + 1))
              else
                rc=$?
                echo "kb_upload($label): $code 失敗（exit $rc）"
                echo "- KB \`$code\` (\`$label\`): 失敗（exit $rc）" >> "$GITHUB_STEP_SUMMARY"
                fail_count=$((fail_count + 1))
                overall_rc=1
              fi
              # 歯止め K7（設計書 §4-2）：kb_upload.py の標準出力（--replace 時は削除前の
              # id〔マスク済み〕・name を含む）を Job Summary にも残す。Actions のログだけでなく
              # 事後にレビューしやすい場所に置くため。
              {
                echo "<details><summary>kb_upload.py ${label} ${code} の出力</summary>"
                echo
                echo '```'
                cat "$out_file"
                echo '```'
                echo "</details>"
                echo
              } >> "$GITHUB_STEP_SUMMARY"
              rm -f "$out_file"
            done
            # 標準出力にも要約を出す（Job Summary は Actions API から読めないため。#121 観測性）。
            echo "kb_upload($label) 合計: OK $ok_count / 失敗 $fail_count / スキップ $skip_count"
          }

          run_tests_op() {
            echo "== run_tests.py $CODES =="
            # run_tests.py 自身が末尾に "合計: 合格数 / 総数 合格" を標準出力へ print する
            # （パイプ・リダイレクトを挟まないのでそのまま Actions のログに出る。#121 観測性）。
            if python3 scripts/dify/run_tests.py --env "$ENV_NAME" $CODES; then
              echo "run_tests: 判定=全件合格 (rc=0)"
              echo "- run_tests: 全件合格" >> "$GITHUB_STEP_SUMMARY"
            else
              rc=$?
              if [ "$rc" -eq 2 ]; then
                echo "run_tests: 判定=設定不備 (rc=2)"
                echo "- run_tests: 設定不備（exit 2。API キー未設定などを確認）" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "run_tests: 判定=不合格あり (rc=$rc)"
                echo "- run_tests: 不合格あり（exit $rc）" >> "$GITHUB_STEP_SUMMARY"
              fi
              overall_rc=1
            fi
          }

          case "$OP" in
            kb_upload) run_kb "" "kb_upload" ;;
            kb_refresh) run_kb "--refresh" "kb_refresh" ;;
            kb_replace) run_kb "--replace" "kb_replace" ;;
            both) run_kb "" "kb_upload"; run_tests_op ;;
          esac

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "OVERALL_RC=$overall_rc" >> "$GITHUB_ENV"
          # このステップ自体は失敗させない。結果の合否はサマリと生成される
          # dify/results/**/*.md（PR の diff）で判断する（設計書 §4-3）。
          exit 0

      # push の直前に、ステージ済みファイルがすべて許容パターンに一致するかを確認する。
      # 1 つでも外れたら push せずに失敗させる（#121「生成物の二重生成」対策。load-bearing）。
      # kb_upload / kb_refresh / kb_replace はローカルファイルを書かないため通常は
      # 変更無しで終わる（HAS_CHANGES=false）。both のときだけ run_tests.py の結果が
      # dify/results/ に生成されうる。
      - name: Stage results and guard changed paths
        run: |
          set -euo pipefail
          # 生成物の置き場だけを対象にステージする。
          # 注意：git add は複数 pathspec のうち 1 つでも存在しないと全体が失敗する。
          # dify/state/ は W2 で導入予定でまだ無いため、必ず 1 つずつ add する
          # （まとめて書くと dify/results/ までステージされない。実測で確認済み）。
          for p in dify/results/ dify/state/; do
            [ -d "$p" ] || continue
            git add -A -- "$p"
          done

          changed="$(git diff --cached --name-only)"
          if [ -z "$changed" ]; then
            echo "変更なし。push しません。" >> "$GITHUB_STEP_SUMMARY"
            echo "HAS_CHANGES=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "$changed" > /tmp/dify-ops-changed.txt

          bad=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! [[ "$f" =~ ^dify/results/[^/]+/[^/]+\.md$ ]] && ! [[ "$f" =~ ^dify/state/[^/]+\.yml$ ]]; then
              echo "::error::変更パスガード違反（許容パターン外）: $f"
              bad=1
            fi
          done < /tmp/dify-ops-changed.txt

          if [ "$bad" -eq 1 ]; then
            {
              echo ""
              echo "**変更パスガードに違反したため push していません。** dify/results/<env>/*.md・dify/state/<env>.yml 以外が生成されています。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "HAS_CHANGES=true" >> "$GITHUB_ENV"
          echo "変更パスガード: OK（$(echo "$changed" | wc -l) 件）" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push the result branch
        if: env.HAS_CHANGES == 'true'
        env:
          OP: ${{ inputs.op }}
          CODES: ${{ inputs.codes }}
          ENV_NAME: ${{ inputs.env }}
          BRANCH: bot/dify-ops-${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "dify-ops-bot"
          git config user.email "dify-ops-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit \
            -m "dify-ops(${ENV_NAME}): ${OP} ${CODES}" \
            -m "Run: ${RUN_URL}" \
            -m "Co-Authored-By: dify-ops-bot <dify-ops-bot@users.noreply.github.com>"
          git push -u origin "$BRANCH"

          {
            echo "## dify-ops 自動実行結果"
            echo
            echo "- 操作: \`${OP}\`"
            echo "- 対象: \`${CODES}\`"
            echo "- 環境: \`${ENV_NAME}\`"
            echo "- 結果ブランチ: \`${BRANCH}\`"
            echo "- 実行ログ: ${RUN_URL}"
            echo
            echo "**PR はこのワークフローでは作りません。** 人が次のリンクから作ってください。"
            echo
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/new/${BRANCH}"
            echo
            echo "PR 作成を自動化するには Settings → Actions → General の"
            echo "「Allow GitHub Actions to create and approve pull requests」を ON にする必要があるが、"
            echo "この設定は PR の**承認**能力も同時に与えるため、PM 判断で ON にしない（#121 W1）。"
            echo
            echo "**main への直 push は行っていません。マージは人が内容を読んでから**（CLAUDE.md §5）。"
            echo
            echo "### 変更ファイル"
            echo
            echo '```'
            cat /tmp/dify-ops-changed.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job if any operation failed
        if: always()
        run: |
          set -euo pipefail
          rc="${OVERALL_RC:-0}"
          if [ "$rc" != "0" ]; then
            echo "::error::kb_upload / kb_refresh / kb_replace / run_tests のいずれかが失敗しました（詳細は Job Summary と PR の結果ファイルを参照）。"
            exit 1
          fi

  # op: deploy（W4-4 PR-6。#121）。scripts/dify/cloud_deploy.py を呼び、対象番号を
  # render → インポート → 公開する。書き込み系のため `kb` ジョブと同じ扱い（environment を宣言。
  # 現状 Required reviewers は外れているため承認は発生しないが、戻した場合は kb と同様に承認が要る）。
  #
  # P1（設計書 §9-2）・B3（設計書 §8-7）は cloud_deploy.py 側で実装済み（1 本でもインポートに
  # 失敗したら公開は 1 本も行わない／import・publish の成否によらずセッションを logout する）。
  # このジョブは「呼ぶだけ」で、追加のロジックは持たない。
  #
  # 生成物は無い（dify/results/**・dify/state/** のどちらにも書かない。env.yml への書き戻しが
  # 要る場合〔新規アプリを作った場合〕は、cloud_deploy.py が候補をログ・Job Summary に出すだけに
  # 留め、このジョブは commit・push しない。dify/env/** への自動書き込みは変更パスガードの許容
  # パターン外であり、`CLAUDE.md` §2-9 のとおり人が読んでから直す）。そのため
  # `kb`/`tests` ジョブと違い「Stage results and guard changed paths」「Commit and push」の
  # ステップを持たない。
  #
  # PR-2（#212）：リフレッシュトークンの自動更新（書き戻し）。rotate のたびに console_api.py が
  # ランナー一時ファイル（sink）へ書き出す値を、ジョブ末尾で Environment secret
  # DIFY_CONSOLE_REFRESH へ書き戻す（成否・キャンセルを問わず if: always()）。GH_SECRETS_PAT が
  # 未設定なら sink を作らない＝従来どおりの使い切り運用（B7。§4-5）。concurrency は
  # deploy・inspect・token_refresh・token_revoke の 4 つで同じグループ名を共有し、
  # cancel-in-progress は **false のままにする（load-bearing）**：true にすると
  # 「rotate 済み・書き戻し前」の実行が別の実行に割り込まれてキャンセルされ、rotate した新しい値が
  # ランナーごと消えて secret が死ぬ（次回 100% 認証エラー）。待たされた側は、先行ジョブの
  # 書き戻し完了後に新しい値で走るだけなので、待たせても secret は壊れない。
  # 設計書 docs/handoff/2026-09-09-refresh-token-writeback.md §3 D3・D5・§4-1〜§4-5・§5。
  deploy:
    name: "deploy（op: deploy）"
    needs: validate
    if: ${{ inputs.op == 'deploy' }}
    runs-on: ubuntu-latest
    # kb ジョブと同じ Environment。現状 Required reviewers は外れているため承認は発生しないが、
    # 戻した場合はここでも承認待ちになる（PM 決定・#121。dify/DEPLOY.md §7）。
    environment: dify-cloud-master
    permissions:
      contents: read   # 何も commit・push しないため read のみでよい（書き戻しは GH_SECRETS_PAT で行う）
    timeout-minutes: 30
    concurrency:
      group: dify-console-${{ inputs.env }}
      # cancel-in-progress は絶対に true にしない（上のコメント参照。load-bearing）。
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install pyyaml

      # 値は一切出力しない。「設定されているか」だけを確認する（他ジョブと同じ作法）。
      - name: Check secrets presence (values are never printed)
        env:
          DIFY_CONSOLE_REFRESH: ${{ secrets.DIFY_CONSOLE_REFRESH }}
        run: |
          set -euo pipefail
          if [ -n "${DIFY_CONSOLE_REFRESH:-}" ]; then
            echo "DIFY_CONSOLE_REFRESH: set"
          else
            echo "DIFY_CONSOLE_REFRESH: unset（op: deploy に必須。dify/DEPLOY.md §9 を参照）"
          fi

      # PR-2（#212）：GH_SECRETS_PAT の有無だけを見る（値は出さない）。あれば書き戻し運用を
      # 有効にする（DIFY_REFRESH_SINK を設定）。無ければ何も設定しない＝従来どおり（B7。§4-5）。
      - name: "Preflight (write-back): PAT の有無だけを見る"
        env:
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          set -euo pipefail
          echo "JOB_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
          if [ -n "${GH_SECRETS_PAT:-}" ]; then
            echo "GH_SECRETS_PAT: set（書き戻し運用が有効になります）"
            echo "WRITEBACK=1" >> "$GITHUB_ENV"
            echo "DIFY_REFRESH_SINK=${RUNNER_TEMP}/dify-refresh.new" >> "$GITHUB_ENV"
          else
            echo "GH_SECRETS_PAT: unset"
            echo "WRITEBACK=0" >> "$GITHUB_ENV"
            {
              echo "> \`GH_SECRETS_PAT\` が未設定のため、**従来どおりの使い切り運用**で実行します（実行後にリフレッシュトークンは無効化されます。次回は取り直しが必要です）。自動更新を有効にする手順は \`dify/DEPLOY.md\` §10-2。"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Run cloud_deploy.py (op: deploy)"
        id: run
        env:
          CODES: ${{ inputs.codes }}
          ENV_NAME: ${{ inputs.env }}
          DIFY_CONSOLE_REFRESH: ${{ secrets.DIFY_CONSOLE_REFRESH }}
          DIFY_REFRESH_SINK: ${{ env.DIFY_REFRESH_SINK }}
        run: |
          set -euo pipefail
          overall_rc=0

          {
            echo "## dify-ops 実行結果（op: deploy）"
            echo
            echo "- 操作: \`deploy\`"
            echo "- 対象: \`$CODES\`"
            echo "- 環境: \`$ENV_NAME\`"
            echo "- 設計書: docs/handoff/2026-09-08-cloud-auth-and-w4.md §9-2・§9-3・§11「W4-4」（Issue #121）"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          out_file="$(mktemp)"
          echo "== cloud_deploy.py --env $ENV_NAME $CODES =="
          # shellcheck disable=SC2086  # CODES は validate ジョブで正規表現・件数（1〜12）を検証済み
          if python3 scripts/dify/cloud_deploy.py --env "$ENV_NAME" $CODES 2>&1 | tee "$out_file"; then
            echo "deploy: 判定=完了 (rc=0)"
            echo "- deploy: 全件インポート成功・公開完了" >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            case "$rc" in
              2) echo "deploy: 判定=設定不備 (rc=2)"; echo "- deploy: 設定不備、または KB 紐づけの安全弁に抵触（exit 2。出力の [STOP] メッセージを確認。env・認証情報の未設定、または dataset_ids が空のまま KB を持つ番号が含まれていないかを見る。dify/DEPLOY.md §9「既知の制限」）" >> "$GITHUB_STEP_SUMMARY" ;;
              3) echo "deploy: 判定=認証エラー (rc=3)"; echo "- deploy: 認証エラー（exit 3。dify/DEPLOY.md §8 の手順で DIFY_CONSOLE_REFRESH を取り直す）" >> "$GITHUB_STEP_SUMMARY" ;;
              *) echo "deploy: 判定=失敗あり (rc=$rc)"; echo "- deploy: 1 件以上失敗（exit $rc。**P1 によりこの場合は公開を 1 件も行っていない**）" >> "$GITHUB_STEP_SUMMARY" ;;
            esac
            overall_rc=1
          fi

          {
            echo
            echo "<details><summary>cloud_deploy.py の出力</summary>"
            echo
            echo '```'
            cat "$out_file"
            echo '```'
            echo "</details>"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$out_file"

          echo "OVERALL_RC=$overall_rc" >> "$GITHUB_ENV"
          # このステップ自体は失敗させない。合否は次の Fail the job ステップで判定する（他ジョブと同じ作法）。
          exit 0

      - name: "Write back the rotated refresh token, if any (PR-2. #212)"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          GH_REPO: ${{ github.repository }}
          SINK: ${{ runner.temp }}/dify-refresh.new
          TARGET_ENV: dify-cloud-master        # 固定。inputs.* からは作らない（r3）
          TARGET_SECRET: DIFY_CONSOLE_REFRESH  # 固定。inputs.* からは作らない（r3）
        run: |
          set -euo pipefail            # set -x は禁止。env / printenv も使わない

          if [ ! -s "$SINK" ]; then
            echo "[WB] rotate していないため書き戻し不要（sink が無い、または空）"
            exit 0
          fi

          fail_writeback() {
            echo "::error::[要対応] リフレッシュトークンの書き戻しに失敗しました。Environment secret DIFY_CONSOLE_REFRESH はもう使えません（この実行で rotate 済み＝古い値は失効しています）。次回の実行は必ず認証エラー（exit 3）になります。dify/DEPLOY.md §10-4 の手順で取り直してください。"
            echo "$1"
            {
              echo "## ⚠️ リフレッシュトークンの書き戻しに失敗しました（要対応）"
              echo
              echo "**いま何が起きているか**"
              echo
              echo "- この実行はリフレッシュトークンを 1 回使いました（rotate）。**Environment secret \`DIFY_CONSOLE_REFRESH\` に入っている値は、もう死んでいます。**"
              echo "- 新しい値はこのランナーの中にだけありましたが、**GitHub の secret に書き戻せませんでした**。ランナーは実行後に破棄されるため、**新しい値は失われました**。"
              echo "- **Dify 側は壊れていません**（この実行の結果は上の欄のとおりです）。次回の実行が認証エラー（exit 3）になるだけです。"
              echo
              echo "**PM がすること（3 分。1 回だけ）**"
              echo
              echo "1. \`dify/DEPLOY.md\` §10-4「取り直し」の手順でリフレッシュトークンを取り直す"
              echo "2. Environment \`dify-cloud-master\` の \`DIFY_CONSOLE_REFRESH\` を **Update** で貼り直す"
              echo "3. \`op: token_refresh\` を 1 回だけ回して、書き戻しが直っているかを確かめる（**Dify には何も書き込みません**）"
              echo
              echo "**原因の切り分け（上のログの \`[WB]\` 行を見る）**"
              echo
              echo "| \`[WB]\` の行 | 原因 | 直し方 |"
              echo "|---|---|---|"
              echo "| \`PAT 未設定\` | Environment secret \`GH_SECRETS_PAT\` が無い／空 | \`dify/DEPLOY.md\` §10-2 |"
              echo "| \`gh secret set 失敗\` かつ HTTP 403 | PAT の権限不足、または期限切れ | §10-2 の権限表を確認。期限切れなら作り直す |"
              echo "| \`gh secret set 失敗\` かつ HTTP 404 | PAT のリポジトリ選択違い／Environment 名の綴り違い | §10-2 の手順 7・10 |"
              echo "| \`形式検査に失敗\` | 実装の不具合（secret には**書き込んでいません**） | Issue を立てる。取り直しでは直らない |"
              echo "| \`反映が確認できない\` | GitHub 側の一時障害の可能性 | もう一度 \`op: token_refresh\` を試す |"
            } >> "$GITHUB_STEP_SUMMARY"
            rm -f "$SINK"
            exit 1
          }

          if [ -z "${GH_TOKEN:-}" ]; then
            fail_writeback "[WB] PAT 未設定（Environment secret GH_SECRETS_PAT が空）"
          fi

          # 形式検査（設計書 §4-7 手順 3）：想定の文字種・長さ・行数 1・末尾改行なし。
          line_count="$(awk 'END{print NR}' "$SINK")"
          trailing_nl="$(tail -c 1 "$SINK" | wc -l | tr -d ' ')"
          format_ok=0
          if LC_ALL=C grep -qE '^[A-Za-z0-9._~+/=-]{20,4096}$' "$SINK" && [ "$line_count" = "1" ] && [ "$trailing_nl" = "0" ]; then
            format_ok=1
          fi
          if [ "$format_ok" -ne 1 ]; then
            fail_writeback "[WB] 形式検査に失敗（実装の不具合。secret には書き込んでいません）"
          fi

          ok=0
          for i in 1 2 3; do
            if gh secret set "$TARGET_SECRET" --env "$TARGET_ENV" < "$SINK"; then
              ok=1
              break
            fi
            echo "gh secret set が失敗しました（${i} 回目）。再試行します…"
            sleep $((i * 5))
          done

          if [ "$ok" -ne 1 ]; then
            fail_writeback "[WB] gh secret set 失敗（3 回リトライ後）"
          fi

          rm -f "$SINK"

          # 反映確認（設計書 §4-7 手順 7）：updatedAt がこのジョブの開始時刻より後であること。
          updated_ok=0
          updated_at=""
          if gh secret list --env "$TARGET_ENV" --json name,updatedAt > "$RUNNER_TEMP/writeback-list.json" 2>/dev/null; then
            updated_at="$(python3 -c 'import json,os; data=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "writeback-list.json"), encoding="utf-8")); rows=[r.get("updatedAt") for r in data if r.get("name")==os.environ["TARGET_SECRET"]]; print(rows[0] if rows else "")')"
            if [ -n "$updated_at" ]; then
              updated_epoch="$(date -u -d "$updated_at" +%s 2>/dev/null || echo 0)"
              if [ "$updated_epoch" -gt "${JOB_START_EPOCH:-0}" ]; then
                updated_ok=1
              fi
            fi
          else
            echo "V-D: --json 未対応の gh バージョンのため名前だけのフォールバック表示を使います（値は出ません）"
            if gh secret list --env "$TARGET_ENV" | grep -q "$TARGET_SECRET"; then
              updated_ok=1   # 時刻での厳密な確認はできないため、secret の存在確認のみで成功扱いとする
            fi
          fi

          if [ "$updated_ok" -ne 1 ]; then
            fail_writeback "[WB] 反映が確認できない（gh は成功を返したが updatedAt が更新されていない）"
          fi

          echo "[WB] 書き戻し成功（updated_at: ${updated_at:-不明}）"
          {
            echo "🔑 リフレッシュトークンを更新しました（updated_at: ${updated_at:-不明}）。次回もそのまま実行できます。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job if deploy failed
        if: always()
        run: |
          set -euo pipefail
          rc="${OVERALL_RC:-0}"
          if [ "$rc" != "0" ]; then
            echo "::error::deploy が失敗しました（詳細は上のログと Job Summary を参照。P1 により、失敗があった場合は公開を 1 件も行っていません）。"
            exit 1
          fi

  # op: token_selftest（PR-1。Issue #212）。リフレッシュトークンの自動更新（書き戻し）の前段の
  # 自己診断。**Dify を一切呼ばない**（scripts/dify/*.py を 1 つも実行しない。console_api.py の
  # refresh()/logout() も呼ばない）。固定のダミー値を捨て用の Environment secret
  # `DIFY_CONSOLE_REFRESH_SELFTEST` に `gh secret set` するだけで、書き戻し用 PAT
  # `GH_SECRETS_PAT`（Environment secret）が Environment secret を書ける権限を持つか
  # （V-A：`Secrets: Read and write` だけで足りるか、`Environments` も要るか）・`gh` の封印・
  # Environment 名 `dify-cloud-master` の綴りを、**本物のリフレッシュトークンを 1 円も
  # 消費せずに**実測する（設計書 docs/handoff/2026-09-09-refresh-token-writeback.md
  # §4-1・§10 PR-1・§11 V-A・V-D）。
  #
  # 本物のリフレッシュトークンを消費しないと言える理由：
  #   - このジョブは DIFY_CONSOLE_REFRESH を env: にすら渡さない（secrets.DIFY_CONSOLE_REFRESH を
  #     参照する行が無い）
  #   - python3 で console_api.py / cloud_deploy.py / console_session.py のいずれも呼ばない
  #   - ネットワーク呼び出しは `gh` コマンド（GitHub API）のみ。cloud.dify.ai への通信は無い
  #
  # `concurrency`（D5）は付けない：deploy・inspect・token_refresh・token_revoke の 4 つ
  # （コンソールセッションを使う操作）だけが対象で、token_selftest は Dify のコンソール
  # セッションを一切扱わないため対象外（設計書 §3 D5）。
  token_selftest:
    name: "token_selftest（op: token_selftest）"
    needs: validate
    if: ${{ inputs.op == 'token_selftest' }}
    runs-on: ubuntu-latest
    # GH_SECRETS_PAT（Environment secret）を読むためだけに宣言する。Dify 側の秘密は一切使わない。
    environment: dify-cloud-master
    permissions:
      contents: read   # 書き戻しは GITHUB_TOKEN ではなく GH_SECRETS_PAT（PAT）で行うため read のまま
    timeout-minutes: 10
    steps:
      - name: Preflight (PAT の有無だけを見る。値は出さない)
        env:
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${GH_SECRETS_PAT:-}" ]; then
            echo "GH_SECRETS_PAT: set"
          else
            echo "::error::[要対応] GH_SECRETS_PAT が未設定です（Environment dify-cloud-master の secret）。dify/DEPLOY.md §10-2 の手順で作成してください。"
            echo "[WB] PAT 未設定（Environment secret GH_SECRETS_PAT が空）"
            exit 1
          fi

      - name: "Write a dummy value to the throwaway secret (op: token_selftest)"
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          GH_REPO: ${{ github.repository }}
          TARGET_ENV: dify-cloud-master                   # 固定。inputs.* からは作らない
          TARGET_SECRET: DIFY_CONSOLE_REFRESH_SELFTEST     # 固定。捨て用（本物の DIFY_CONSOLE_REFRESH ではない）
        run: |
          set -euo pipefail            # set -x は禁止。env / printenv も使わない

          # 値はテスト用のダミー（Dify のリフレッシュトークンとは無関係）。stdin で渡す（--body は使わない）。
          dummy_file="$(mktemp)"
          printf 'selftest-dummy-%s-%s' "$(date -u +%Y%m%dT%H%M%SZ)" "$GITHUB_RUN_ID" > "$dummy_file"

          ok=0
          for i in 1 2 3; do
            if gh secret set "$TARGET_SECRET" --env "$TARGET_ENV" < "$dummy_file"; then
              ok=1
              break
            fi
            echo "gh secret set が失敗しました（${i} 回目）。再試行します…"
            sleep $((i * 5))
          done
          rm -f "$dummy_file"

          if [ "$ok" -ne 1 ]; then
            echo "::error::[要対応] token_selftest: gh secret set が失敗しました（3 回リトライ後）。PAT の権限不足（V-A：Secrets だけで 403 になる場合は Environments も要る可能性）、または Environment 名／secret 名の綴りを dify/DEPLOY.md §10-2 で確認してください。"
            echo "[WB] gh secret set 失敗（3 回リトライ後）"
            exit 1
          fi

          # V-D: --json 対応の gh バージョンかどうかもここで分かる。使えなければ名前と更新日だけの表示にフォールバックする。
          if gh secret list --env "$TARGET_ENV" --json name,updatedAt > "$RUNNER_TEMP/token-selftest-list.json" 2>/dev/null; then
            echo "V-D: gh secret list --json name,updatedAt が使えます"
            python3 -c 'import json,os; p=os.path.join(os.environ["RUNNER_TEMP"], "token-selftest-list.json"); data=json.load(open(p, encoding="utf-8")); rows=[r for r in data if r.get("name") == os.environ["TARGET_SECRET"]]; print(rows[0] if rows else "(見つかりません)")'
          else
            echo "V-D: --json 未対応の gh バージョンのため、名前と更新日だけのフォールバック表示を使います"
            gh secret list --env "$TARGET_ENV" | grep "$TARGET_SECRET" || true
          fi

          {
            echo "## token_selftest（op: token_selftest）"
            echo
            echo "設計書: docs/handoff/2026-09-09-refresh-token-writeback.md §4-1・§10 PR-1・§11 V-A・V-D（Issue #212）"
            echo
            echo "**成功。** \`GH_SECRETS_PAT\` は Environment \`${TARGET_ENV}\` の secret を書き換えられます。"
            echo "**Dify へは 1 回もアクセスしていません**（リフレッシュトークンは消費していません）。"
            echo
            echo "この結果を dify/DEPLOY.md §10-2 手順 9 の V-A 判定（\`Secrets\` だけで足りたか）に反映してください。"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "token_selftest: 成功（Dify へは 1 回もアクセスしていません）"

  # op: token_refresh（PR-3。Issue #212）。scripts/dify/console_session.py refresh を呼び、
  # DIFY_CONSOLE_REFRESH でセッションが有効なことを list_apps()（GET のみ）で確かめるだけ。
  # Dify のアプリ・KB は一切書き換えない。**logout はしない**（次回もこのセッションを引き継ぐ
  # ため。設計書 §4-6）。rotate した値は console_api.py が DIFY_REFRESH_SINK へ自動で書き、
  # deploy・inspect と同じ書き戻しステップ（if: always()）・concurrency グループ
  # dify-console-<env> を持つ（cancel-in-progress は false のまま。deploy ジョブのコメント参照）。
  # 設計書 docs/handoff/2026-09-09-refresh-token-writeback.md §4-6・§4-7・§10 PR-3。
  token_refresh:
    name: "token_refresh（op: token_refresh）"
    needs: validate
    if: ${{ inputs.op == 'token_refresh' }}
    runs-on: ubuntu-latest
    environment: dify-cloud-master
    permissions:
      contents: read   # 何も commit しないため read のみでよい（書き戻しは GH_SECRETS_PAT で行う）
    timeout-minutes: 15
    concurrency:
      group: dify-console-${{ inputs.env }}
      # cancel-in-progress は絶対に true にしない（deploy ジョブのコメント参照。load-bearing）。
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install pyyaml

      # 値は一切出力しない。「設定されているか」だけを確認する（他ジョブと同じ作法）。
      - name: Check secrets presence (values are never printed)
        env:
          DIFY_CONSOLE_REFRESH: ${{ secrets.DIFY_CONSOLE_REFRESH }}
        run: |
          set -euo pipefail
          if [ -n "${DIFY_CONSOLE_REFRESH:-}" ]; then
            echo "DIFY_CONSOLE_REFRESH: set"
          else
            echo "DIFY_CONSOLE_REFRESH: unset（op: token_refresh に必須。dify/DEPLOY.md §8 を参照）"
          fi

      # PR-2/PR-3（#212）：GH_SECRETS_PAT の有無だけを見る（値は出さない）。あれば書き戻し運用を
      # 有効にする（DIFY_REFRESH_SINK を設定）。無ければ何も設定しない＝従来どおり（B7。§4-5）。
      - name: "Preflight (write-back): PAT の有無だけを見る"
        env:
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          set -euo pipefail
          echo "JOB_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
          if [ -n "${GH_SECRETS_PAT:-}" ]; then
            echo "GH_SECRETS_PAT: set（書き戻し運用が有効になります）"
            echo "WRITEBACK=1" >> "$GITHUB_ENV"
            echo "DIFY_REFRESH_SINK=${RUNNER_TEMP}/dify-refresh.new" >> "$GITHUB_ENV"
          else
            echo "GH_SECRETS_PAT: unset"
            echo "WRITEBACK=0" >> "$GITHUB_ENV"
            {
              echo "> \`GH_SECRETS_PAT\` が未設定のため、**従来どおりの使い切り運用**で実行します（実行後にリフレッシュトークンは無効化されます。次回は取り直しが必要です）。自動更新を有効にする手順は \`dify/DEPLOY.md\` §10-2。"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Run console_session.py refresh (op: token_refresh)"
        id: run
        env:
          ENV_NAME: ${{ inputs.env }}
          DIFY_CONSOLE_REFRESH: ${{ secrets.DIFY_CONSOLE_REFRESH }}
          DIFY_REFRESH_SINK: ${{ env.DIFY_REFRESH_SINK }}
        run: |
          set -euo pipefail
          overall_rc=0

          {
            echo "## dify-ops 実行結果（op: token_refresh）"
            echo
            echo "- 操作: \`token_refresh\`"
            echo "- 環境: \`$ENV_NAME\`"
            echo "- 設計書: docs/handoff/2026-09-09-refresh-token-writeback.md §4-6・§10 PR-3（Issue #212）"
            echo "- **Dify へは読み取り専用リクエスト（アプリ一覧の GET）のみ**。KB・アプリの書き換えは行いません。logout もしません。"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          out_file="$(mktemp)"
          echo "== console_session.py refresh --env $ENV_NAME =="
          if python3 scripts/dify/console_session.py --env "$ENV_NAME" refresh 2>&1 | tee "$out_file"; then
            echo "token_refresh: 判定=完了 (rc=0)"
            echo "- token_refresh: 完了（セッションは有効）" >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            case "$rc" in
              2) echo "token_refresh: 判定=設定不備 (rc=2)"; echo "- token_refresh: 設定不備（exit 2。DIFY_CONSOLE_REFRESH の未設定などを確認。dify/DEPLOY.md §8）" >> "$GITHUB_STEP_SUMMARY" ;;
              3) echo "token_refresh: 判定=認証エラー (rc=3)"; echo "- token_refresh: 認証エラー（exit 3。dify/DEPLOY.md §10-4 の手順で取り直す）" >> "$GITHUB_STEP_SUMMARY" ;;
              4) echo "token_refresh: 判定=Cloudflare 遮断 (rc=4)"; echo "- token_refresh: Cloudflare に弾かれました（exit 4）" >> "$GITHUB_STEP_SUMMARY" ;;
              *) echo "token_refresh: 判定=失敗 (rc=$rc)"; echo "- token_refresh: 失敗（exit $rc）" >> "$GITHUB_STEP_SUMMARY" ;;
            esac
            overall_rc=1
          fi

          {
            echo
            echo "<details><summary>console_session.py refresh の出力</summary>"
            echo
            echo '```'
            cat "$out_file"
            echo '```'
            echo "</details>"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$out_file"

          echo "OVERALL_RC=$overall_rc" >> "$GITHUB_ENV"
          # このステップ自体は失敗させない。合否は Fail the job ステップで判定する（他ジョブと同じ作法）。
          exit 0

      - name: "Write back the rotated refresh token, if any (PR-2/PR-3. #212)"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          GH_REPO: ${{ github.repository }}
          SINK: ${{ runner.temp }}/dify-refresh.new
          TARGET_ENV: dify-cloud-master        # 固定。inputs.* からは作らない（r3）
          TARGET_SECRET: DIFY_CONSOLE_REFRESH  # 固定。inputs.* からは作らない（r3）
        run: |
          set -euo pipefail            # set -x は禁止。env / printenv も使わない

          if [ ! -s "$SINK" ]; then
            echo "[WB] rotate していないため書き戻し不要（sink が無い、または空）"
            exit 0
          fi

          fail_writeback() {
            echo "::error::[要対応] リフレッシュトークンの書き戻しに失敗しました。Environment secret DIFY_CONSOLE_REFRESH はもう使えません（この実行で rotate 済み＝古い値は失効しています）。次回の実行は必ず認証エラー（exit 3）になります。dify/DEPLOY.md §10-4 の手順で取り直してください。"
            echo "$1"
            {
              echo "## ⚠️ リフレッシュトークンの書き戻しに失敗しました（要対応）"
              echo
              echo "**いま何が起きているか**"
              echo
              echo "- この実行はリフレッシュトークンを 1 回使いました（rotate）。**Environment secret \`DIFY_CONSOLE_REFRESH\` に入っている値は、もう死んでいます。**"
              echo "- 新しい値はこのランナーの中にだけありましたが、**GitHub の secret に書き戻せませんでした**。ランナーは実行後に破棄されるため、**新しい値は失われました**。"
              echo "- **Dify 側は壊れていません**（この実行の結果は上の欄のとおりです）。次回の実行が認証エラー（exit 3）になるだけです。"
              echo
              echo "**PM がすること（3 分。1 回だけ）**"
              echo
              echo "1. \`dify/DEPLOY.md\` §10-4「取り直し」の手順でリフレッシュトークンを取り直す"
              echo "2. Environment \`dify-cloud-master\` の \`DIFY_CONSOLE_REFRESH\` を **Update** で貼り直す"
              echo "3. \`op: token_refresh\` を 1 回だけ回して、書き戻しが直っているかを確かめる（**Dify には何も書き込みません**）"
              echo
              echo "**原因の切り分け（上のログの \`[WB]\` 行を見る）**"
              echo
              echo "| \`[WB]\` の行 | 原因 | 直し方 |"
              echo "|---|---|---|"
              echo "| \`PAT 未設定\` | Environment secret \`GH_SECRETS_PAT\` が無い／空 | \`dify/DEPLOY.md\` §10-2 |"
              echo "| \`gh secret set 失敗\` かつ HTTP 403 | PAT の権限不足、または期限切れ | §10-2 の権限表を確認。期限切れなら作り直す |"
              echo "| \`gh secret set 失敗\` かつ HTTP 404 | PAT のリポジトリ選択違い／Environment 名の綴り違い | §10-2 の手順 7・10 |"
              echo "| \`形式検査に失敗\` | 実装の不具合（secret には**書き込んでいません**） | Issue を立てる。取り直しでは直らない |"
              echo "| \`反映が確認できない\` | GitHub 側の一時障害の可能性 | もう一度 \`op: token_refresh\` を試す |"
            } >> "$GITHUB_STEP_SUMMARY"
            rm -f "$SINK"
            exit 1
          }

          if [ -z "${GH_TOKEN:-}" ]; then
            fail_writeback "[WB] PAT 未設定（Environment secret GH_SECRETS_PAT が空）"
          fi

          # 形式検査（設計書 §4-7 手順 3）：想定の文字種・長さ・行数 1・末尾改行なし。
          line_count="$(awk 'END{print NR}' "$SINK")"
          trailing_nl="$(tail -c 1 "$SINK" | wc -l | tr -d ' ')"
          format_ok=0
          if LC_ALL=C grep -qE '^[A-Za-z0-9._~+/=-]{20,4096}$' "$SINK" && [ "$line_count" = "1" ] && [ "$trailing_nl" = "0" ]; then
            format_ok=1
          fi
          if [ "$format_ok" -ne 1 ]; then
            fail_writeback "[WB] 形式検査に失敗（実装の不具合。secret には書き込んでいません）"
          fi

          ok=0
          for i in 1 2 3; do
            if gh secret set "$TARGET_SECRET" --env "$TARGET_ENV" < "$SINK"; then
              ok=1
              break
            fi
            echo "gh secret set が失敗しました（${i} 回目）。再試行します…"
            sleep $((i * 5))
          done

          if [ "$ok" -ne 1 ]; then
            fail_writeback "[WB] gh secret set 失敗（3 回リトライ後）"
          fi

          rm -f "$SINK"

          # 反映確認（設計書 §4-7 手順 7）：updatedAt がこのジョブの開始時刻より後であること。
          updated_ok=0
          updated_at=""
          if gh secret list --env "$TARGET_ENV" --json name,updatedAt > "$RUNNER_TEMP/writeback-list.json" 2>/dev/null; then
            updated_at="$(python3 -c 'import json,os; data=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "writeback-list.json"), encoding="utf-8")); rows=[r.get("updatedAt") for r in data if r.get("name")==os.environ["TARGET_SECRET"]]; print(rows[0] if rows else "")')"
            if [ -n "$updated_at" ]; then
              updated_epoch="$(date -u -d "$updated_at" +%s 2>/dev/null || echo 0)"
              if [ "$updated_epoch" -gt "${JOB_START_EPOCH:-0}" ]; then
                updated_ok=1
              fi
            fi
          else
            echo "V-D: --json 未対応の gh バージョンのため名前だけのフォールバック表示を使います（値は出ません）"
            if gh secret list --env "$TARGET_ENV" | grep -q "$TARGET_SECRET"; then
              updated_ok=1   # 時刻での厳密な確認はできないため、secret の存在確認のみで成功扱いとする
            fi
          fi

          if [ "$updated_ok" -ne 1 ]; then
            fail_writeback "[WB] 反映が確認できない（gh は成功を返したが updatedAt が更新されていない）"
          fi

          echo "[WB] 書き戻し成功（updated_at: ${updated_at:-不明}）"
          {
            echo "🔑 リフレッシュトークンを更新しました（updated_at: ${updated_at:-不明}）。次回もそのまま実行できます。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job if token_refresh failed
        if: always()
        run: |
          set -euo pipefail
          rc="${OVERALL_RC:-0}"
          if [ "$rc" != "0" ]; then
            echo "::error::token_refresh が失敗しました（詳細は上のログと Job Summary を参照）。"
            exit 1
          fi

  # op: token_revoke（PR-4。Issue #212）。手動キルスイッチ（B3'。設計書 §4-4・§4-6・§10-5）。
  # PR-2 で B3（ジョブ末尾の自動 logout）を書き戻し運用のために止めた代わりに、PM が
  # Actions の画面から明示的に「今すぐ無効化」できる操作を用意する。
  #
  # 順序（値は一切出力しない）：
  #   1) scripts/dify/console_session.py revoke … client_from_env() → client.logout()。
  #      Dify サーバ側のセッションを無効化する（対になるリフレッシュトークンも一緒に死ぬ）。
  #   2) gh secret delete DIFY_CONSOLE_REFRESH … Environment secret 自体を削除する。
  #      次回の実行は「未設定」で exit 2 になり、事故的な再利用が起きない（§10-5）。
  #
  # 失敗時の扱い（設計書に明記が無いため、安全側で決めた。Issue #212 PR-4 の PR 本文に理由を残す）：
  # **1) の logout が失敗しても、2) の secret 削除は必ず試みる**（if: always()）。
  # 理由：logout に失敗する状況（すでにセッションが死んでいる・Dify 側の一時的な不調等）でも、
  # 「次回の実行を確実に止める」という B3' の目的は secret 削除だけで達成できる。
  # 逆に「secret 削除が失敗したら logout もしない」という順序にすると、両方失敗したときに
  # 生きたセッションと生きた secret の両方が残ってしまい、キルスイッチとして最悪の結果になる。
  # `GH_SECRETS_PAT` が未設定で secret を削除できない場合は、dify/DEPLOY.md §10-5 の手動手順
  # （ブラウザでログアウト → GitHub で DIFY_CONSOLE_REFRESH を削除）を案内してジョブを失敗させる。
  #
  # 破壊的操作（無効化）のため confirm に固定文字列 "revoke" を要求する（validate ジョブで検証済み）。
  # deploy・inspect・token_refresh と同じ concurrency グループ（cancel-in-progress は false のまま。
  # 書き戻し中の実行と衝突させないため）。
  token_revoke:
    name: "token_revoke（op: token_revoke）"
    needs: validate
    if: ${{ inputs.op == 'token_revoke' }}
    runs-on: ubuntu-latest
    environment: dify-cloud-master
    permissions:
      contents: read   # 何も commit しないため read のみでよい（secret 削除は GH_SECRETS_PAT で行う）
    timeout-minutes: 10
    concurrency:
      group: dify-console-${{ inputs.env }}
      # cancel-in-progress は絶対に true にしない（deploy ジョブのコメント参照。load-bearing）。
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install pyyaml

      # 値は一切出力しない。「設定されているか」だけを確認する（他ジョブと同じ作法）。
      - name: Check secrets presence (values are never printed)
        env:
          DIFY_CONSOLE_REFRESH: ${{ secrets.DIFY_CONSOLE_REFRESH }}
        run: |
          set -euo pipefail
          if [ -n "${DIFY_CONSOLE_REFRESH:-}" ]; then
            echo "DIFY_CONSOLE_REFRESH: set"
          else
            echo "DIFY_CONSOLE_REFRESH: unset（logout は何もせずスキップされます。secret はすでに『未設定』です）"
          fi

      # GH_SECRETS_PAT の有無だけを見る（値は出さない）。無ければ secret 削除ができないため、
      # 後続のステップで案内を出してジョブを失敗させる（§10-5 の手動手順に誘導する）。
      - name: "Preflight: GH_SECRETS_PAT の有無だけを見る"
        env:
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${GH_SECRETS_PAT:-}" ]; then
            echo "GH_SECRETS_PAT: set"
          else
            echo "GH_SECRETS_PAT: unset"
            {
              echo "> \`GH_SECRETS_PAT\` が未設定のため、\`DIFY_CONSOLE_REFRESH\` を自動削除できません。Dify 側のセッション無効化（logout）は試みますが、secret の削除は \`dify/DEPLOY.md\` §10-5 の手動手順で行ってください。"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Run console_session.py revoke (op: token_revoke)"
        id: run
        env:
          ENV_NAME: ${{ inputs.env }}
          DIFY_CONSOLE_REFRESH: ${{ secrets.DIFY_CONSOLE_REFRESH }}
        run: |
          set -euo pipefail
          overall_rc=0

          {
            echo "## dify-ops 実行結果（op: token_revoke）"
            echo
            echo "- 操作: \`token_revoke\`"
            echo "- 環境: \`$ENV_NAME\`"
            echo "- 設計書: docs/handoff/2026-09-09-refresh-token-writeback.md §4-4・§4-6・§10-5（Issue #212 PR-4）"
            echo "- **Dify のセッションを無効化します（logout）。アプリ・KB の書き換えは行いません。**"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          out_file="$(mktemp)"
          echo "== console_session.py revoke --env $ENV_NAME =="
          if python3 scripts/dify/console_session.py --env "$ENV_NAME" revoke 2>&1 | tee "$out_file"; then
            echo "token_revoke(logout): 判定=完了 (rc=0)"
            echo "- logout: 完了（Dify 側のセッションを無効化しました）" >> "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            case "$rc" in
              2) echo "token_revoke(logout): 判定=設定不備 (rc=2)"; echo "- logout: 設定不備（exit 2。DIFY_CONSOLE_REFRESH は未設定＝すでにセッションを持っていません）" >> "$GITHUB_STEP_SUMMARY" ;;
              3) echo "token_revoke(logout): 判定=認証エラー (rc=3)"; echo "- logout: 認証エラー（exit 3。すでに期限切れのセッションの可能性）" >> "$GITHUB_STEP_SUMMARY" ;;
              4) echo "token_revoke(logout): 判定=Cloudflare 遮断 (rc=4)"; echo "- logout: Cloudflare に弾かれました（exit 4）" >> "$GITHUB_STEP_SUMMARY" ;;
              *) echo "token_revoke(logout): 判定=失敗 (rc=$rc)"; echo "- logout: 失敗（exit $rc）" >> "$GITHUB_STEP_SUMMARY" ;;
            esac
            overall_rc=1
          fi

          {
            echo
            echo "<details><summary>console_session.py revoke の出力</summary>"
            echo
            echo '```'
            cat "$out_file"
            echo '```'
            echo "</details>"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$out_file"

          echo "OVERALL_RC=$overall_rc" >> "$GITHUB_ENV"
          # このステップ自体は失敗させない。合否は最後の Fail the job ステップで判定する
          # （secret 削除が logout の成否に関わらず必ず試みられるようにするため。上のコメント参照）。
          exit 0

      - name: "Delete the Environment secret DIFY_CONSOLE_REFRESH (op: token_revoke)"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          GH_REPO: ${{ github.repository }}
          TARGET_ENV: dify-cloud-master        # 固定。inputs.* からは作らない（r3 相当）
          TARGET_SECRET: DIFY_CONSOLE_REFRESH  # 固定。inputs.* からは作らない（r3 相当）
        run: |
          set -euo pipefail            # set -x は禁止。env / printenv も使わない

          fail_delete() {
            echo "::error::[要対応] DIFY_CONSOLE_REFRESH の削除に失敗しました。$1 dify/DEPLOY.md §10-5 の手動手順（ブラウザでログアウト → GitHub で DIFY_CONSOLE_REFRESH を削除）を今すぐ行ってください。"
            echo "[WB] $1"
            {
              echo "## ⚠️ DIFY_CONSOLE_REFRESH の自動削除に失敗しました（要対応）"
              echo
              echo "$1"
              echo
              echo "**今すぐ手動で行ってください（\`dify/DEPLOY.md\` §10-5）**："
              echo "1. Dify のブラウザでログアウトする"
              echo "2. GitHub → Settings → Environments → \`dify-cloud-master\` → \`DIFY_CONSOLE_REFRESH\` を削除する"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "DELETE_RC=1" >> "$GITHUB_ENV"
            exit 0
          }

          if [ -z "${GH_TOKEN:-}" ]; then
            fail_delete "Environment secret \`GH_SECRETS_PAT\` が空です。"
          fi

          ok=0
          for i in 1 2 3; do
            if gh secret delete "$TARGET_SECRET" --env "$TARGET_ENV" 2>"$RUNNER_TEMP/token-revoke-delete-err.log"; then
              ok=1
              break
            fi
            # すでに削除済み（前回の revoke がここまで成功していた等）なら目的は達成済みとみなす。
            if grep -qiE "not found|does not exist|no secret" "$RUNNER_TEMP/token-revoke-delete-err.log" 2>/dev/null; then
              echo "[WB] $TARGET_SECRET はすでに存在しません（削除済み扱い）"
              ok=1
              break
            fi
            echo "gh secret delete が失敗しました（${i} 回目）。再試行します…"
            sleep $((i * 5))
          done
          rm -f "$RUNNER_TEMP/token-revoke-delete-err.log"

          if [ "$ok" -ne 1 ]; then
            fail_delete "gh secret delete が 3 回リトライ後も失敗しました。"
          fi

          # 反映確認：一覧から消えていること（値は出さない。名前だけ）。
          gone=0
          if gh secret list --env "$TARGET_ENV" --json name > "$RUNNER_TEMP/token-revoke-list.json" 2>/dev/null; then
            if python3 -c 'import json,os,sys; p=os.path.join(os.environ["RUNNER_TEMP"], "token-revoke-list.json"); data=json.load(open(p, encoding="utf-8")); sys.exit(0 if not any(r.get("name")==os.environ["TARGET_SECRET"] for r in data) else 1)'; then
              gone=1
            fi
          else
            echo "V-D: --json 未対応の gh バージョンのため名前だけのフォールバック表示を使います（値は出ません）"
            if ! gh secret list --env "$TARGET_ENV" | grep -q "$TARGET_SECRET"; then
              gone=1
            fi
          fi

          if [ "$gone" -ne 1 ]; then
            fail_delete "gh は成功を返しましたが、一覧からまだ消えていません。"
          fi

          echo "DELETE_RC=0" >> "$GITHUB_ENV"
          echo "[WB] $TARGET_SECRET を削除しました"
          {
            echo "🔒 \`DIFY_CONSOLE_REFRESH\` を削除しました。次回の実行は「未設定」で exit 2 になります（事故的な再利用は起きません）。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job if token_revoke did not fully succeed
        if: always()
        run: |
          set -euo pipefail
          logout_rc="${OVERALL_RC:-0}"
          delete_rc="${DELETE_RC:-1}"
          if [ "$logout_rc" != "0" ] || [ "$delete_rc" != "0" ]; then
            echo "::error::token_revoke が完全には成功しませんでした（logout rc=$logout_rc, secret 削除 rc=$delete_rc）。詳細は上のログと Job Summary を参照してください。"
            exit 1
          fi
          echo "token_revoke: 完了（logout ＋ secret 削除の両方が成功しました）"
