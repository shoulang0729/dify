name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install pyyaml

      # verify + regress + dify/check.py + render.py --check + test_sync_back.py +
      # test_run_tests.py + test_lang_check.py + run_tests.py --dry-run（応答言語のスキーマ検査。
      # ネットワーク不要。管理番号は dify/env/cloud-master/env.yml の apps: から導く＝ここにベタ書きしない）
      # を npm run ci（package.json）にまとめている。設計書 docs/handoff/2026-09-11-repo-layout-v3.md §5-1・§8-1 R-P2
      - name: Run ci
        run: npm run ci
