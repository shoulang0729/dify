name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Run verify
        run: npm run verify

      - name: Run regress
        run: npm run regress

      - name: Run dify/check.py
        run: python3 dify/check.py

      - name: Run render.py --check
        run: python3 scripts/dify/render.py --env cloud-master --all --check

      - name: Run test_sync_back.py
        run: python3 scripts/dify/tests/test_sync_back.py

      - name: Run test_run_tests.py
        run: python3 scripts/dify/tests/test_run_tests.py

      - name: Run test_lang_check.py
        run: python3 scripts/dify/tests/test_lang_check.py

      - name: Run run_tests.py --dry-run (応答言語のスキーマ検査。ネットワーク不要)
        run: |
          python3 scripts/dify/run_tests.py --dry-run --out "$(mktemp -d)" \
            KN-01 KN-02 KN-03 DC-01 DC-02 DC-04 GN-01 GN-02 GN-05 LG-01 LG-04 NM-03
