name: portal-verify

# portal/（NocoBase Community。⑤ポータル）専用の CI。paths: portal/** でしか起動しない。
# 設計書 docs/handoff/2026-09-11-repo-layout-v3.md §5-1・§4-2 S-3・S-6。
# 中身はシェル 1 行（npm --prefix portal test）。判定・分岐・生成はすべて portal/tools/**・
# portal/scripts/** に置く（.gitlab-ci.yml への移行が YAML 1 枚の書き換えで済むように）。
# 使ってよいのは actions/checkout と actions/setup-node だけ（S-6）。secrets は 1 つも参照しない。

on:
  pull_request:
    paths:
      - 'portal/**'
      - '.github/workflows/portal-verify.yml'
  push:
    branches:
      - main
    paths:
      - 'portal/**'
      - '.github/workflows/portal-verify.yml'

permissions:
  contents: read

concurrency:
  group: portal-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: portal/.nvmrc

      - name: npm ci (portal/)
        run: npm --prefix portal ci

      - name: npm test (portal/)
        run: npm --prefix portal test
