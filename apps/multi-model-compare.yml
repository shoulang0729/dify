app:
  description: 同じ質問を5つのLLMに同時に投げて、回答を並べて比較できるチャットボット。ナレッジ検索(RAG)の結果を全モデルが共有して回答します。
  icon: 🧪
  icon_background: '#E0F2FE'
  icon_type: emoji
  mode: advanced-chat
  name: マルチモデル比較チャット (5モデル + RAG)
  use_icon_as_answer_icon: false
# ⚠️ LLM は OpenRouter(OpenAI-Compatible) 経由を想定。
#    インポート前に Dify の Settings → Model Provider で「OpenAI-Compatible」を追加し、
#      Base URL: https://openrouter.ai/api/v1 / API Key: <OpenRouter のキー>
#    を設定。さらに、下の5モデル(claude-3.5-sonnet / gpt-4o / gemini-2.0-flash /
#    llama-3.3-70b / deepseek-chat)を「モデル追加」で1個ずつ登録してください。
#    インポート後、各 LLM ノードの model は UI で選び直すのが確実です(非互換マーク対策)。
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - remote_url
      - local_file
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 質問すると、5つのLLMが同時に答えて結果を並べて表示します。気になる質問をどうぞ。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 各モデルの違いを比べたい質問をどうぞ
    - ナレッジには何が登録されていますか？
    - この製品の特徴を3つ教えて
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ja-JP
      voice: ''
  graph:
    edges:
