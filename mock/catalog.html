<style>
/* tokens/colors.css */
/* ============================================================
   NTT DATA — Color Tokens
   Source of truth: NTT DATA Group Corporate template theme
   ("NTT DATA Group Corp." color scheme) + VVI brand guidance.

   構成:
     1. ブランドパレット（不変・テーマで変えない）
     2. セマンティックエイリアス（ライト既定値）
     3. [data-theme="dark"] でセマンティック層のみ上書き
   ============================================================ */

:root {
  /* --- Brand core ------------------------------------------------ */
  --ntt-future-blue:      #0071BC; /* PRIMARY brand color */
  --ntt-future-blue-150:  #005B96; /* darker — depth, hovers on light */
  --ntt-future-blue-50:   #2E90FF; /* lighter Future Blue — links, accents, on-dark text */

  /* --- Neutrals / backgrounds ----------------------------------- */
  --ntt-smart-navy:       #070F26; /* primary dark background + headings */
  --ntt-text-grey:        #2E404D; /* default body text */
  --ntt-grey-100:         #949494; /* muted text, dividers, disabled */
  --ntt-black:            #000000; /* select use only (per VVI) */
  --ntt-white:            #FFFFFF;

  /* Extended neutral ramp (derived from Smart Navy / Text Grey) */
  --ntt-grey-700:         #3D4A57;
  --ntt-grey-300:         #C7CDD2;
  --ntt-grey-200:         #DDE1E5;
  --ntt-grey-100-bg:      #EEF1F3; /* subtle surface tint */
  --ntt-grey-50:          #F6F8FA; /* app canvas / off-white */

  /* --- Secondary accents ---------------------------------------- */
  --ntt-green:            #00CB5D;
  --ntt-turquoise:        #00DFED;

  /* --- Attention accents ---------------------------------------- */
  --ntt-yellow:           #FFC400;
  --ntt-orange:           #FF7A00;
  --ntt-orange-100:       #E42600;
  --ntt-orange-150:       #B22000;

  /* ============================================================
     SEMANTIC ALIASES — reference these in product UI
     ダークモードはここだけを上書きする
     ============================================================ */

  /* Surfaces */
  --surface-canvas:       var(--ntt-grey-50);
  --surface-card:         var(--ntt-white);
  --surface-sunken:       var(--ntt-grey-100-bg);
  --surface-inverse:      var(--ntt-smart-navy);
  --surface-brand:        var(--ntt-future-blue);
  --surface-header:       var(--ntt-white);
  --surface-hover:        #F2F6F9;
  --surface-selected:     #EAF3FA;
  --surface-rail:         var(--ntt-smart-navy);

  /* Text */
  --text-heading:         var(--ntt-smart-navy);
  --text-body:            var(--ntt-text-grey);
  --text-secondary:       #5A6B78;
  --text-muted:           #8A98A4;
  --text-on-brand:        var(--ntt-white);
  --text-on-inverse:      var(--ntt-white);
  --text-link:            var(--ntt-future-blue);
  --text-link-hover:      var(--ntt-future-blue-150);

  /* Borders */
  --border-subtle:        #E3E8EC;
  --border-default:       #C9D2D9;
  --border-card:          #D9DFE5;
  --border-strong:        var(--ntt-text-grey);
  --border-brand:         var(--ntt-future-blue);

  /* Interactive (primary) */
  --action-primary:       var(--ntt-future-blue);
  --action-primary-hover: var(--ntt-future-blue-150);
  --action-primary-active:#004B7A;

  /* Status / feedback */
  --status-success:       var(--ntt-green);
  --status-info:          var(--ntt-future-blue-50);
  --status-warning:       var(--ntt-yellow);
  --status-danger:        var(--ntt-orange-100);
  --status-danger-strong: var(--ntt-orange-150);
  --badge-live-bg:        rgba(0, 203, 93, 0.14);
  --badge-live-fg:        #00803B;
  --badge-trial-bg:       rgba(0, 113, 188, 0.12);
  --badge-trial-fg:       #005B96;
  --status-concept:       var(--ntt-grey-100);
  --badge-concept-bg:     rgba(148, 148, 148, 0.16);
  --badge-concept-fg:     #5A6B78;

  /* Focus ring */
  --focus-ring:           var(--ntt-future-blue-50);
}

/* ============================================================
   DARK THEME — セマンティック層のみ差し替え。
   ブランドパレット（--ntt-*）は一切変更しない。
   下地は Smart Navy から起こしたニュートラルランプ。
   ============================================================ */
:root[data-theme="dark"] {
  --surface-canvas:       #0A1220;
  --surface-card:         #111C30;
  --surface-sunken:       #070F26;
  --surface-header:       #0D1728;
  --surface-hover:        #16233A;
  --surface-selected:     #17304C;
  --surface-rail:         #050B1A;

  --text-heading:         var(--ntt-white);
  --text-body:            #DDE1E5;
  --text-secondary:       #A4B0BA;
  --text-muted:           #7A8794;
  --text-link:            var(--ntt-future-blue-50); /* on-dark 用として定義済み */
  --text-link-hover:      #6BB2FF;

  --border-subtle:        #1E2B41;
  --border-default:       #2A3A52;
  --border-card:          #223148;

  --action-primary:       var(--ntt-future-blue);
  --action-primary-hover: var(--ntt-future-blue-50);
  --action-primary-active:#1A6FB5;

  /* ダーク背景でのコントラスト確保のため明度を上げる */
  --status-success:       #2BE07E;
  --status-warning:       #FFD34D;
  --badge-live-bg:        rgba(43, 224, 126, 0.16);
  --badge-live-fg:        #5BE79B;
  --badge-trial-bg:       rgba(46, 144, 255, 0.18);
  --badge-trial-fg:       #7FC0FF;
  --status-concept:       #8A97A6;
  --badge-concept-bg:     rgba(164, 176, 186, 0.16);
  --badge-concept-fg:     #B8C3CC;
}

/* tokens/typography.css */
/* ============================================================
   NTT DATA — Typography Tokens
   Brand basics (VVI): page titles use GEORGIA, body uses ARIAL.
   Japanese: Meiryo UI (titles bold) / Meiryo (body).
   ============================================================ */

:root {
  --font-display: Georgia, "Times New Roman", "Yu Mincho", "Hiragino Mincho ProN", serif;
  --font-sans: Arial, "Helvetica Neue", Helvetica, "Yu Gothic", "Hiragino Kaku Gothic ProN", "Meiryo", system-ui, sans-serif;
  --font-jp: "Meiryo UI", Meiryo, "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Arial, sans-serif;
  --font-zh: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", sans-serif;
  --font-en: Arial, "Helvetica Neue", Helvetica, system-ui, sans-serif;
  --font-mono: "SFMono-Regular", "Consolas", "Liberation Mono", Menlo, monospace;

  --weight-regular: 400;
  --weight-medium:  500;
  --weight-bold:    700;

  --text-h1:         30px;
  --text-h2:         24px;
  --text-h3:         20px;
  --text-body-lg:    18px;
  --text-body:       16px;
  --text-body-sm:    14px;
  --text-caption:    12px;
  --text-overline:   11px;

  --leading-tight:   1.1;
  --leading-snug:    1.25;
  --leading-normal:  1.5;
  --leading-relaxed: 1.65;

  --tracking-tight:   -0.01em;
  --tracking-normal:  0;
  --tracking-wide:    0.04em;
  --tracking-overline:0.14em;
}

/* 表示言語に応じて本文フォントを切り替える */
:root[data-lang="ja"] { --font-ui: var(--font-jp); }
:root[data-lang="zh"] { --font-ui: var(--font-zh); }
:root[data-lang="en"] { --font-ui: var(--font-en); }

/* tokens/spacing.css */
:root {
  --space-1:   4px;
  --space-2:   8px;
  --space-3:   12px;
  --space-4:   16px;
  --space-5:   20px;
  --space-6:   24px;
  --space-8:   32px;
  --space-10:  40px;
  --space-12:  48px;

  --radius-none: 0;
  --radius-xs:   2px;
  --radius-sm:   4px;
  --radius-md:   6px;
  --radius-pill: 999px;

  --border-hairline: 1px;
  --border-thick:    2px;
  --border-accent:   3px;

  --shadow-sm:  0 1px 3px rgba(7, 15, 38, 0.08), 0 1px 2px rgba(7, 15, 38, 0.06);
  --shadow-md:  0 4px 12px rgba(7, 15, 38, 0.10);
  --shadow-focus: 0 0 0 3px rgba(46, 144, 255, 0.35);

  --ease-standard: cubic-bezier(0.2, 0, 0.2, 1);
  --duration-fast: 120ms;
  --duration-base: 200ms;
}
</style>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font-ui, var(--font-jp));
    color: var(--text-body);
    background: var(--surface-canvas);
    overflow: hidden;
    transition: background var(--duration-base) var(--ease-standard),
                color var(--duration-base) var(--ease-standard);
  }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: none; box-shadow: var(--shadow-focus); }

  .app { height: 100vh; display: flex; flex-direction: column; }

  /* ===== デモ用ツールバー（モック専用の足場。本番UIではない） ===== */
  .mockbar {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    gap: var(--space-4); padding: var(--space-2) var(--space-5);
    background: var(--surface-sunken); border-bottom: 1px solid var(--border-subtle);
  }
  .mockbar .label {
    font-size: var(--text-overline); letter-spacing: 0.08em;
    color: var(--text-secondary); font-weight: var(--weight-bold);
  }
  .mockbar .segwrap { display: flex; align-items: center; gap: var(--space-2); }
  .mockbar .seglabel { font-size: var(--text-overline); color: var(--text-secondary); }
  .seg { display: flex; border: 1px solid var(--border-default); }
  .seg button {
    padding: 5px 12px; font-size: 11.5px; border: none;
    background: var(--surface-card); color: var(--text-secondary);
    transition: background var(--duration-fast) var(--ease-standard);
  }
  .seg button:hover:not(.on):not(:disabled) { background: var(--surface-hover); }
  .seg button.on { background: var(--action-primary); color: var(--text-on-brand); font-weight: var(--weight-bold); }
  .seg button:disabled { opacity: 0.45; cursor: not-allowed; }

  /* ===== ヘッダー（本番にも存在する領域） ===== */
  .hdr {
    flex-shrink: 0; display: flex; align-items: center; gap: var(--space-5);
    padding: 0 var(--space-6); height: 64px;
    background: var(--surface-header); border-bottom: 1px solid var(--border-subtle);
  }
  .hdr .wordmark {
    display: inline-flex; align-items: center; justify-content: center; height: 30px; padding: 0 14px;
    border: 1px dashed var(--border-default); border-radius: var(--radius-sm);
    font-weight: var(--weight-bold); font-size: 13px; letter-spacing: var(--tracking-wide);
    color: var(--text-muted);
  }
  .hdr .vline { width: 1px; height: 28px; background: var(--border-subtle); }
  .hdr .t1 { font-size: 15px; font-weight: var(--weight-bold); color: var(--text-heading); }
  .hdr .right { margin-left: auto; display: flex; align-items: center; gap: var(--space-3); }
  .hdr .dept { font-size: 12.5px; color: var(--text-secondary); }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--action-primary);
    color: var(--text-on-brand); display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: var(--weight-bold); flex-shrink: 0;
  }

  /* 言語 / テーマ切替（プロダクト機能） */
  .ctrl { display: flex; align-items: center; gap: var(--space-1); }
  .lang-select {
    appearance: none; font-family: inherit; font-size: 12.5px; color: var(--text-body);
    background: var(--surface-card); border: 1px solid var(--border-default);
    border-radius: var(--radius-sm); padding: 6px 26px 6px 10px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%),
                      linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  .lang-select:hover { border-color: var(--action-primary); }
  .theme-btn {
    width: 34px; height: 32px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border-default); border-radius: var(--radius-sm);
    background: var(--surface-card); color: var(--text-secondary); font-size: 14px; line-height: 1;
    transition: border-color var(--duration-fast) var(--ease-standard);
  }
  .theme-btn:hover { border-color: var(--action-primary); color: var(--action-primary); }

  .body { flex: 1; min-height: 0; display: flex; }

  /* ===== ① 階層ナビ型 ===== */
  nav.side {
    flex-shrink: 0; overflow-y: auto;
    border-right: 1px solid var(--border-subtle);
    width: 264px; background: var(--surface-card); padding: var(--space-3) 0 var(--space-6) 0;
  }
  .nav-item {
    display: flex; align-items: baseline; gap: var(--space-2); width: 100%;
    padding: 10px var(--space-5); border: none; background: transparent; text-align: left;
    transition: background var(--duration-fast) var(--ease-standard);
  }
  .nav-item:hover { background: var(--surface-hover); }
  .nav-item.on { background: var(--surface-selected); }
  .nav-item .n-label { font-size: 13.5px; font-weight: var(--weight-bold); color: var(--text-heading); }
  .nav-item.on .n-label { color: var(--action-primary); }
  .nav-item .cnt { margin-left: auto; font-size: var(--text-overline); color: var(--text-muted); }
  .nav-sub {
    display: flex; align-items: baseline; gap: var(--space-2); width: 100%;
    padding: var(--space-2) var(--space-5) var(--space-2) 34px;
    border: none; background: transparent; text-align: left;
    transition: background var(--duration-fast) var(--ease-standard);
  }
  .nav-sub:hover { background: var(--surface-hover); }
  .nav-sub.on { background: var(--surface-selected); }
  .nav-sub .n-label { font-size: 13px; color: var(--text-body); }
  .nav-sub.on .n-label { color: var(--action-primary); font-weight: var(--weight-bold); }
  .nav-sub .cnt { margin-left: auto; font-size: var(--text-overline); color: var(--text-muted); }
  .chev {
    margin-left: auto; width: 7px; height: 7px; flex-shrink: 0; align-self: center;
    border-right: 2px solid var(--text-muted); border-bottom: 2px solid var(--text-muted);
    transform: rotate(-45deg); transition: transform 160ms var(--ease-standard);
  }
  .chev.open { transform: rotate(45deg); }
  .nav-divider { height: 1px; background: var(--border-subtle); margin: 6px var(--space-5); }

  /* ===== 右ペイン ===== */
  main {
    flex: 1; min-width: 0; overflow-y: auto;
    background: var(--surface-canvas); display: flex; flex-direction: column;
  }

  .list-wrap { padding: var(--space-8) 36px var(--space-12) 36px; }
  .list-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: var(--space-6); flex-wrap: wrap; margin-bottom: var(--space-6);
  }
  .crumb {
    font-size: var(--text-overline); letter-spacing: 0.1em;
    font-weight: var(--weight-bold); color: var(--action-primary); margin-bottom: 6px;
  }
  .list-title { display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; }
  .list-title h1 { margin: 0; font-size: var(--text-h2); font-weight: var(--weight-bold); color: var(--text-heading); }
  .count { font-size: 12.5px; color: var(--text-secondary); margin-top: 6px; }
  .search {
    width: 280px; padding: 9px var(--space-3); font-size: 13px;
    border: 1px solid var(--border-default); border-radius: var(--radius-xs);
    background: var(--surface-card); color: var(--text-body); outline: none; font-family: inherit;
  }
  .search::placeholder { color: var(--text-muted); }
  .search:focus { border-color: var(--action-primary); box-shadow: var(--shadow-focus); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-4); }
  .card {
    background: var(--surface-card); border: 1px solid var(--border-card);
    border-bottom: 2px solid var(--border-card);
    padding: var(--space-5); cursor: pointer; display: flex; flex-direction: column; gap: 7px;
    transition: border-bottom-color 160ms var(--ease-standard), background var(--duration-fast) var(--ease-standard);
  }
  .card:hover { border-bottom-color: var(--action-primary); }
  .card .c-crumb {
    font-size: 10.5px; letter-spacing: 0.08em;
    font-weight: var(--weight-bold); color: var(--action-primary);
  }
  .card .c-name { font-size: 15.5px; font-weight: var(--weight-bold); color: var(--text-heading); line-height: 1.4; }
  .card .c-desc {
    font-size: 12.5px; color: var(--text-body); line-height: var(--leading-relaxed);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .c-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .status {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: var(--text-overline); color: var(--text-secondary); margin-right: var(--space-1);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.live { background: var(--status-success); }
  .dot.trial { background: var(--status-warning); }
  .dot.concept { background: var(--status-concept); }
  .tag {
    font-size: var(--text-overline); color: var(--text-secondary);
    border: 1px solid var(--border-card); border-radius: var(--radius-sm);
    padding: 2px var(--space-2); background: var(--surface-canvas);
  }
  .empty { padding: 64px 0; text-align: center; color: var(--text-muted); font-size: 13.5px; line-height: 2; }

  /* ===== 詳細 ===== */
  .detail-wrap { padding: var(--space-6) 36px var(--space-12) 36px; max-width: 920px; }
  .backlink {
    border: none; background: transparent; padding: 6px 0; font-size: 13px; color: var(--text-link);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .backlink:hover { color: var(--text-link-hover); }
  .backlink .arrow {
    width: 7px; height: 7px; border-left: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: rotate(45deg);
  }
  .detail-card {
    margin-top: var(--space-3); background: var(--surface-card);
    border: 1px solid var(--border-card); padding: var(--space-10);
  }
  .detail-card .d-crumb {
    font-size: var(--text-overline); letter-spacing: 0.1em;
    font-weight: var(--weight-bold); color: var(--action-primary); margin-bottom: var(--space-3);
  }
  .detail-card h1 {
    margin: 0 0 6px 0; font-size: 28px; font-weight: var(--weight-bold);
    color: var(--text-heading); line-height: 1.35;
  }
  .detail-card .d-meta { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin: var(--space-4) 0 28px; }
  .badge {
    display: inline-flex; align-items: center; font-size: 11.5px;
    font-weight: var(--weight-bold); padding: 3px 10px; border-radius: var(--radius-xs);
  }
  .badge.live { background: var(--badge-live-bg); color: var(--badge-live-fg); }
  .badge.trial { background: var(--badge-trial-bg); color: var(--badge-trial-fg); }
  .badge.concept { background: var(--badge-concept-bg); color: var(--badge-concept-fg); }
  .keyline { width: 32px; height: var(--border-accent); background: var(--action-primary); margin-bottom: var(--space-4); }
  .sec-label { font-size: 13px; font-weight: var(--weight-bold); color: var(--text-heading); margin-bottom: 10px; }
  .d-desc { margin: 0 0 var(--space-8) 0; font-size: 14.5px; line-height: 1.9; color: var(--text-body); }
  .cta-row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
  .btn-primary {
    border: none; background: var(--action-primary); color: var(--text-on-brand);
    font-size: 15px; font-weight: var(--weight-bold); padding: 13px 28px; border-radius: var(--radius-xs);
    transition: background 160ms var(--ease-standard);
  }
  .btn-primary:hover { background: var(--action-primary-hover); }
  .btn-primary:active { background: var(--action-primary-active); }
  .cta-note { font-size: 11.5px; color: var(--text-muted); }

  /* ===== チャット ===== */
  .chat-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .chat-hdr {
    flex-shrink: 0; display: flex; align-items: center; gap: var(--space-4);
    padding: 14px 36px; background: var(--surface-card); border-bottom: 1px solid var(--border-subtle);
  }
  .chat-hdr .vline { width: 1px; height: 24px; background: var(--border-subtle); }
  .chat-hdr .ct1 { font-size: 14px; font-weight: var(--weight-bold); color: var(--text-heading); }
  .chat-hdr .status { margin-left: auto; }
  .msgs {
    flex: 1; min-height: 0; overflow-y: auto; padding: 28px 36px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .bubble {
    max-width: 560px; padding: var(--space-3) var(--space-4); font-size: 13.5px; line-height: 1.75;
    white-space: pre-line; border-radius: var(--radius-xs);
    background: var(--surface-card); color: var(--text-body); border: 1px solid var(--border-card);
  }
  .msg-row.user .bubble {

  { id: 'lg3', cat: 'lg', sub: 'align', st: 2, tags: ['procedure', 'translate'],
    name: { ja: '現地スタッフとの認識合わせ（手順の中国語書き下し）', zh: '与现地员工的共识确认（工序中文化与确认项明示）', en: 'Alignment with Local Staff (Procedures in Chinese)' },
    desc: { ja: '日本人駐在員が口頭や日本語メモで伝えた作業指示を、手順ごとに番号を付けた中国語の指示文に書き下し、「確認すべき点」「よくある誤解」を明示します。現地スタッフの理解確認質問（3 問程度）も自動生成し、伝わったかを確かめられます。',
            zh: '将日方驻在员口头或日文备注下达的作业指示，改写为逐条编号的中文指示，并明示"需确认事项"与"常见误解"。自动生成约3道理解确认问题，便于确认现地员工是否理解到位。',
            en: 'Rewrites instructions given verbally or in Japanese notes by expatriate staff into numbered Chinese steps, highlighting points to confirm and common misunderstandings. Generates about three comprehension-check questions so you can confirm the message landed.' } },
  { id: 'lg4', cat: 'lg', sub: 'align', st: 1, tags: ['mail'],
    name: { ja: 'ビジネスメール作成（日中往復）', zh: '商务邮件撰写（中日往来）', en: 'Business Email Writer (JP–CN Correspondence)' },
    desc: { ja: '要件と相手（本社・顧客・サプライヤー・当局）を伝えると、敬語・商務中文の適切な文面を作成します。受け取った中国語メールの日本語要約と返信案、日本語メールの中国語返信案など、日中往復のやり取りをまとめて支援します。',
            zh: '说明事项与对象（总部、客户、供应商、主管部门）后，生成措辞得体的日文敬语或商务中文邮件。支持中文来信的日文摘要与回复草案、日文来信的中文回复草案，全面辅助中日往来沟通。',
            en: 'Writes appropriately formal Japanese or business Chinese email given your intent and the recipient (HQ, customer, supplier, authority). Summarizes incoming Chinese mail in Japanese and drafts replies in either direction.' } },

  /* ---- nm: 見積・数字 ---- */
  { id: 'nm1', cat: 'nm', sub: 'cost', st: 3, tags: ['costing'],
    name: { ja: '見積り・原価計算', zh: '报价与成本计算', en: 'Quotation & Cost Estimation' },
    desc: { ja: '図面・仕様・数量から、材料費・加工費・金型償却・物流費を社内の原価テーブルで積み上げ、見積書ドラフトと原価内訳を作成します。過去の類似品見積との比較や、為替・材料市況の変動による感度も提示します。',
            zh: '根据图纸、规格与数量，按公司成本表累计材料费、加工费、模具摊销与物流费，生成报价单草案与成本明细。可与历史类似品报价比较，并提示汇率、原材料行情变动的敏感度。',
            en: 'Builds material, processing, tooling-amortization and logistics costs from drawings, specs and volumes using your cost tables, producing a quotation draft and cost breakdown. Compares with similar past quotes and shows sensitivity to FX and material prices.' } },
  { id: 'nm2', cat: 'nm', sub: 'cost', st: 2, tags: ['purchase', 'costing'],
    name: { ja: '購買見積の比較', zh: '采购报价比较', en: 'Purchase Quote Comparison' },
    desc: { ja: '複数サプライヤーの見積書（形式・通貨・単位がばらばら）を読み取って同じ条件に正規化し、単価・MOQ・納期・支払条件の比較表を作成します。前回発注価格との差や、値上げ理由の妥当性チェックにも使えます。',
            zh: '读取多家供应商格式、货币、单位各不相同的报价单，归一到同一条件后生成单价、MOQ、交期、付款条件的比较表。可与上次采购价对比，并检查涨价理由的合理性。',
            en: 'Reads supplier quotes in differing formats, currencies and units, normalizes them to like-for-like terms and builds a comparison of unit price, MOQ, lead time and payment terms. Also compares with the last order price and sanity-checks price-increase reasons.' } },
  { id: 'nm3', cat: 'nm', sub: 'actual', st: 1, tags: ['kpi', 'summary'],
    name: { ja: '日報・実績の集計と要約', zh: '日报与实绩汇总摘要', en: 'Daily Report & KPI Roll-up' },
    desc: { ja: 'ライン別の生産日報・品質日報・設備稼働記録を集計し、生産数・不良率・稼働率・主要トピックスを日次／週次で要約します。中国語で書かれた日報から日本語の週報を自動で作ることができ、異常値には解説コメントを付けます。',
            zh: '汇总各生产线的生产日报、质量日报与设备运行记录，按日／周概括产量、不良率、稼动率与主要事项。可由中文日报自动生成日文周报，并对异常值附加说明。',
            en: 'Aggregates line-level production, quality and equipment logs into daily and weekly summaries of output, defect rate, utilization and key topics. Produces a Japanese weekly report from Chinese daily reports, with commentary on outliers.' } },
  { id: 'nm4', cat: 'nm', sub: 'actual', st: 2, tags: ['inventory', 'faq'],
    name: { ja: '在庫・納期の問い合わせ回答', zh: '库存与交期咨询应答', en: 'Inventory & Lead-Time Inquiry Answers' },
    desc: { ja: '「この品番の在庫はいくつ？」「来週の出荷に間に合う？」といった営業・顧客・本社からの問い合わせに、在庫・生産計画・入荷予定を照会して回答します。回答文はそのまま返信に使える形で作成し、確認が必要な前提条件を明示します。',
            zh: '针对销售、客户、总部提出的"该品号库存多少""能否赶上下周出货"等问题，查询库存、生产计划与到货预定后作答。回复以可直接转发的形式生成，并明示需确认的前提条件。',
            en: 'Answers stock and delivery questions from sales, customers and HQ — "how many of this part are in stock?", "can we make next week\'s shipment?" — by querying inventory, production plans and inbound schedules. Replies are ready to forward, with assumptions stated.' } },
  { id: 'nm5', cat: 'nm', sub: 'actual', st: 2, tags: ['analysis', 'kpi'],
    name: { ja: 'データ分析アシスタント', zh: '数据分析助手', en: 'Data Analysis Assistant' },
    desc: { ja: '自然言語の質問から生産・品質・原価のデータを集計・可視化し、示唆をコメント付きで返します。「ライン別の不良率推移を見せて」「残業時間と不良の相関は？」など、SQL や BI ツールの知識がなくても分析できます。',
            zh: '通过自然语言提问，对生产、质量、成本数据进行汇总与可视化，并附带分析洞察。例如"看一下各线不良率趋势""加班时间与不良是否相关"，无需SQL或BI工具知识。',
            en: 'Aggregates and charts production, quality and cost data from plain-language questions — "show defect-rate trends by line", "is overtime correlated with defects?" — with written insights. No SQL or BI skills required.' } },

  /* ---- en: 図面・BOM・技術文書 ---- */
  { id: 'en1', cat: 'en', sub: 'spec', st: 2, tags: ['spec', 'glossary'],
    name: { ja: '仕様改訂の差分検出・取引先用語対応', zh: '规格修订差异检出与客户术语对应', en: 'Spec Revision Diff & Customer Terminology Mapping' },
    desc: { ja: '完成車メーカーの要求仕様書・作業標準書・手順書の新旧版を比較し、変更箇所と影響（管理項目・検査方法・記録様式）を一覧にします。メーカーごとに異なる用語を社内呼称に対応づけて読解し、改訂版の社内文書ドラフトも作成します。',
            zh: '比较整车厂要求规格书、作业标准书与作业指导书的新旧版本，列出变更点及影响（管理项目、检验方法、记录表单）。将各厂商不同的术语对应到公司内部称谓进行解读，并生成修订版内部文件草案。',
            en: 'Compares old and new versions of OEM requirement specs, work standards and procedures, listing changes and their impact on control items, inspection methods and record forms. Maps each OEM\'s terminology to your in-house terms and drafts the revised internal documents.' } },
  { id: 'en2', cat: 'en', sub: 'bom', st: 2, tags: ['bom'],
    name: { ja: 'BOM逆引き', zh: 'BOM反查', en: 'Reverse BOM Lookup' },
    desc: { ja: '部品番号・材料ロット・サプライヤー名から、それが使われている製品・上位アセンブリ・出荷先・出荷時期を逆引きします。不具合発生時の影響範囲特定や、材料変更時の対象製品の洗い出しに使います。',
            zh: '根据零件号、材料批次或供应商名称，反向查出所用产品、上级装配、出货对象与出货时间。用于不良发生时的影响范围确定，以及材料变更时的对象产品筛查。',
            en: 'Traces a part number, material lot or supplier back to the products, parent assemblies, customers and shipment dates that used it. Used to scope the impact of a defect or identify products affected by a material change.' } },
  { id: 'en3', cat: 'en', sub: 'bom', st: 3, tags: ['drawing', 'search'],
    name: { ja: '図面の類似検索', zh: '图纸相似检索', en: 'Similar Drawing Search' },
    desc: { ja: '新規引合の図面を入力すると、形状・寸法・材質・加工要件が近い過去の図面を検索し、その製品の工程・原価・不具合履歴を提示します。見積の初期検討や、既存治具・金型の流用可否判断に使います。',
            zh: '输入新询价的图纸后，检索形状、尺寸、材质、加工要求相近的历史图纸，并给出该产品的工艺、成本与不良履历。用于报价初期评估以及既有治具、模具能否沿用的判断。',
            en: 'Given a drawing from a new inquiry, finds past drawings with similar geometry, dimensions, material and machining requirements and shows their process, cost and defect history. Supports early quoting and jig/mold reuse decisions.' } },

  /* ---- gn: 汎用業務支援 ---- */
  { id: 'gn1', cat: 'gn', sub: 'office', st: 1, tags: ['finance'],
    name: { ja: '経費精算チェック', zh: '报销审核辅助', en: 'Expense Report Checker' },
    desc: { ja: '発票（領収書）と精算申請の内容を照合し、規程違反・金額不一致・発票の記載不備（抬頭・税号）を自動で検出してコメントします。駐在員の日本円建て精算や出張規程との照合にも対応します。',
            zh: '核对发票与报销申请内容，自动检测违规、金额不一致以及发票信息缺漏（抬头、税号）并给出说明。支持驻在员日元报销及与出差规定的核对。',
            en: 'Matches fapiao receipts against expense claims and flags policy breaches, amount mismatches and receipt defects (company title, tax ID) with explanations. Handles expatriates\' yen-denominated claims and travel-policy checks.' } },
  { id: 'gn2', cat: 'gn', sub: 'office', st: 1, tags: ['finance'],
    name: { ja: '請求書（発票）処理', zh: '发票处理', en: 'Invoice (Fapiao) Processing' },
    desc: { ja: '受領した増値税発票・請求書をデータ化し、発注・入庫との三点照合、仕訳候補の提案、支払期日の管理を行います。発票の真偽確認に必要な項目の抜き出しや、会計システムへの登録案の作成にも対応します。',
            zh: '将收到的增值税发票与账单数据化，与采购订单、入库进行三单匹配，提出记账科目建议并管理付款期限。支持提取发票查验所需信息，并生成财务系统录入草案。',
            en: 'Digitizes incoming VAT fapiao and invoices, performs three-way matching against POs and receipts, proposes journal entries and tracks payment due dates. Extracts the fields needed for fapiao verification and drafts accounting-system entries.' } },
  { id: 'gn3', cat: 'gn', sub: 'office', st: 2, tags: ['order'],
    name: { ja: '受注・発注書の読み取りと登録支援', zh: '订单与采购单读取及录入辅助', en: 'Order Document Reading & Entry Support' },
    desc: { ja: '顧客からの注文書・内示・発注メールや、サプライヤーへの発注書の内容を構造化し、基幹システムへの登録案を作成します。形式がばらばらな帳票や、日中混在の記載にも対応し、数量・納期・単価の前回との差分を指摘します。',
            zh: '将客户订单、预示、订货邮件以及对供应商的采购单内容结构化，生成核心系统录入草案。支持格式各异的单据与中日混合的记载，并指出数量、交期、单价与上次的差异。',
            en: 'Structures customer POs, forecasts and order emails as well as your own purchase orders into draft entries for the core system. Copes with inconsistent formats and mixed Japanese/Chinese content, and highlights changes in quantity, delivery and price versus last time.' } },
  { id: 'gn4', cat: 'gn', sub: 'daily', st: 2, tags: ['calendar', 'meeting'],
    name: { ja: 'スケジュール調整', zh: '日程协调', en: 'Scheduling Assistant' },
    desc: { ja: '日本本社・中国工場・サプライヤーの参加者の空き状況と時差・両国の祝日を踏まえて候補日時を提示し、日中 2 言語の招集メールまで作成します。定例会議の振替や来訪・監査の日程調整にも使えます。',
            zh: '结合日本总部、中国工厂与供应商参会者的空闲情况、时差及两国节假日，提出候选时间并生成中日双语的会议邀请。也可用于例会改期以及来访、审核的日程协调。',
            en: 'Proposes meeting times across HQ, the China plant and suppliers, accounting for availability, time difference and both countries\' holidays, and drafts the bilingual invitation. Also handles rescheduling regular meetings and visit or audit dates.' } },
  { id: 'gn5', cat: 'gn', sub: 'daily', st: 1, tags: ['summary'],
    name: { ja: '文書要約', zh: '文档摘要', en: 'Document Summarizer' },
    desc: { ja: '長文の報告書・仕様書・通達・メールスレッドを、目的に応じた粒度の要点サマリーに変換します。中国語の長文を日本語 1 枚に要約する、日本語の本社資料を中国語の箇条書きにするなど、言語をまたいだ要約に対応します。',
            zh: '将长篇报告、规格书、通知与邮件往来压缩为不同粒度的要点摘要。支持跨语言摘要，例如将中文长文概括为一页日文，或将日文总部资料整理为中文要点。',
            en: 'Condenses long reports, specifications, notices and email threads into summaries at your chosen level of detail. Works across languages — a one-page Japanese summary of a Chinese document, or Chinese bullet points from Japanese HQ materials.' } },

  /* ---- pt: パートナー連携（構想中のパートナー 6 者。役割名で扱う） ---- */
  { id: 'pt1', cat: 'pt', sub: 'data', st: 2, tags: ['partner_infovendor', 'credit'],
    name: { ja: '取引先・サプライヤーの与信・リスク監視', zh: '客户与供应商信用及风险监控', en: 'Customer & Supplier Credit and Risk Monitoring' },
    desc: { ja: '情報ベンダの企業財務・信用・供給網・ニュースのデータフィードを取り込み、取引先やサプライヤーの与信状況と供給リスク（財務悪化・支払遅延・株主変更・上流原材料の集中）を照会します。新規取引や年間契約更新の前に、社内の購買実績・見積比較・契約条件と並べて判断材料を作り、監視対象に変化があれば通知します。',
            zh: '接入信息服务商的企业财务、信用、供应链与新闻数据，查询客户和供应商的信用状况与供应风险（财务恶化、付款拖延、股东变更、上游原材料集中）。在新开交易或年度合同更新前，与公司内部的采购实绩、报价比较和合同条件并列形成判断依据，监控对象发生变化时发出通知。',
            en: 'Pulls corporate financials, credit, supply-chain and news feeds from an information vendor to check the credit standing and supply risk of customers and suppliers — deteriorating financials, late payments, ownership changes, upstream material concentration. Lines the findings up with your purchase history, quote comparisons and contract terms before new deals or renewals, and alerts you when a monitored company changes.' } },
  { id: 'pt2', cat: 'pt', sub: 'data', st: 2, tags: ['partner_infovendor', 'market'],
    name: { ja: '業界・材料相場リサーチ（本社報告の外部根拠）', zh: '行业与原材料行情调研（总部汇报的外部依据）', en: 'Industry & Material Market Research for HQ Reporting' },
    desc: { ja: '情報ベンダの業界レポート・材料相場・ニュース速報を、テーマと期間を指定して要点にまとめます。サプライヤーの値上げ理由の妥当性確認、競合や完成車メーカーの動きの把握、見積・原価の前提となる材料単価の更新に使え、出典付きの短文として本社報告資料へそのまま貼れる形で出力します。',
            zh: '按主题与期间，把信息服务商的行业报告、原材料行情与新闻快讯整理为要点。可用于核实供应商涨价理由、掌握竞争对手与整车厂动向、更新报价与成本所依据的材料单价，并以附出处的短文形式输出，可直接粘贴到总部汇报资料中。',
            en: 'Summarizes industry reports, material price indices and breaking news from an information vendor for a chosen topic and period. Use it to verify supplier price-increase reasons, track competitors and OEMs, and refresh material prices behind quotes and costing. Outputs short, sourced paragraphs ready to paste into headquarters reports.' } },
  { id: 'pt3', cat: 'pt', sub: 'data', st: 2, tags: ['partner_archive', 'search'],
    name: { ja: '業界誌・技術記事アーカイブの横断検索', zh: '行业期刊与技术文章档案的跨库检索', en: 'Trade Journal & Technical Article Archive Search' },
    desc: { ja: '記事アーカイブ検索サービスが持つ業界誌・広告・技術記事の過去記事を横断検索し、要点と出典を返します。社内ナレッジに無い他社事例・新工法・材料や設備の情報を補い、社内の技術記録と並べて「社外ではどう解決しているか」を示します。本社への提案や報告の裏付けにも使えます。',
            zh: '跨库检索文章档案检索服务所收录的行业期刊、广告与技术文章（含历史文章），返回要点与出处。补充公司知识库中没有的他社案例、新工艺、材料与设备信息，并与内部技术记录并列，展示「外部是如何解决的」。也可作为向总部提案与汇报的依据。',
            en: 'Searches the back catalog of trade journals, advertisements and technical articles held by an article-archive service and returns key points with sources. Fills gaps in internal knowledge — other companies cases, new methods, materials and equipment — and shows them beside your own technical records. Also backs proposals and reports to headquarters.' } },
  { id: 'pt4', cat: 'pt', sub: 'data', st: 3, tags: ['partner_salarydb', 'hr'],
    name: { ja: '現地給与水準の照会と給与改定の妥当性確認', zh: '当地薪酬水平查询与调薪合理性确认', en: 'Local Salary Benchmark Lookup & Pay Review Check' },
    desc: { ja: '給与 DB サービスから職種・経験・地域・企業規模ごとの給与水準、手当・福利厚生の相場、法定変更（最低賃金・社会保険基数）の解説を照会し、社内の等級別水準と並べて給与改定やオファー金額の妥当性を確認します。外部へ送るのは等級別の集計値のみで、個人の給与データは社外に出しません。本社への説明資料も作成します。',
            zh: '从薪酬数据库服务查询按职种、经验、地区、企业规模划分的薪酬水平、津贴与福利行情，以及法定变更（最低工资、社保基数）的解读，并与公司内部的职级水平并列，确认调薪与录用报价的合理性。向外部发送的仅为职级汇总值，个人薪酬数据不出公司。同时可生成给总部的说明资料。',
            en: 'Queries a salary database service for pay levels by role, experience, region and company size, allowance and benefit norms, and explanations of statutory changes (minimum wage, social-insurance base). Places them beside your own grade-level figures to check pay reviews and offer amounts. Only aggregated grade data leaves the company — never individual salaries. Also drafts the explanation for headquarters.' } },
  { id: 'pt5', cat: 'pt', sub: 'service', st: 3, tags: ['partner_recruit', 'hr'],

   pattern を切り替えても選択位置は保持され、直接比較できる
   ============================================================ */

  lang: 'ja',
  theme: 'light',
  openCats: { kn: true },
  selCat: null,
  selSub: null,
  lastCat: 'kn',
  selSvc: null,
  view: 'list',          // 'list' | 'detail' | 'chat' | 'demo'
  query: '',
  log: []                // デモで消費した台本ターン [{ lang: 'ja'|'zh', q: string, a: string }]
};

/* ============================================================
   4. ヘルパー
   ============================================================ */
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
/** 多言語オブジェクトから現在言語の文字列を取り出す */
const L = (obj) => (obj && (obj[state.lang] ?? obj.ja)) || '';
const t = (key) => L(T[key]);
const tag = (key) => L(TAGS[key]) || key;

const catOf = (id) => CATS.find(c => c.id === id);
const subOf = (catId, subId) => { const c = catOf(catId); return c && c.subs.find(b => b.id === subId); };
const svcOf = (id) => SVCS.find(x => x.id === id);
const countSub = (subId) => SVCS.filter(x => x.sub === subId).length;
const countCat = (catId) => SVCS.filter(x => x.cat === catId).length;
/* st: 1 提供中 / 2 試行版 / 3 構想 */
const statusText = (st) => st === 1 ? t('statusLive') : st === 2 ? t('statusTrial') : t('statusConcept');
const statusClass = (st) => st === 1 ? 'live' : st === 2 ? 'trial' : 'concept';

/** 入力テキストの言語を判定（ひらがな/カタカナ→ja、漢字のみ→zh、それ以外→UI言語）
    エージェントは UI 言語と無関係に日本語・中国語どちらの入力も受け付ける */
function detectLang(s) {
  if (/[぀-ヿ]/.test(s)) return 'ja';
  if (/[一-鿿]/.test(s)) return 'zh';
  return state.lang;
}
const countText = (n) => state.lang === 'en' ? (n + t('countUnit')) : (n + t('countUnit'));

function filtered() {
  let list = SVCS;
  if (state.selSub) list = list.filter(x => x.sub === state.selSub);
  else if (state.selCat) list = list.filter(x => x.cat === state.selCat);
  const q = state.query.trim().toLowerCase();
  if (q) {
    list = list.filter(x => {
      const hay = [x.name.ja, x.name.zh, x.name.en, x.desc.ja, x.desc.zh, x.desc.en,
                   ...x.tags.map(k => [TAGS[k].ja, TAGS[k].zh, TAGS[k].en].join(''))].join('');
      return hay.toLowerCase().indexOf(q) >= 0;
    });
  }
  return list;
}

/* ---- デモ（業務デモ画面）ヘルパー（§2-4） ---- */
/** demo view の agent 返答遅延タイマー。renderMain() 再実行時に消し忘れると
    連打・言語切替で古い #msgs へ二重に addMsg してしまうため保持する */
let demoReplyTimer = null;
const scnOf = (id) => SCENARIOS[id] || null;
/** 台本は ja / zh のみ。UI が en のときは ja の台本を使う（§2-5：エージェント本体は日中） */
const scriptLang = (l) => (l === 'zh' ? 'zh' : 'ja');
/** 次に消費する台本ターン（尽きていれば null） */
const nextTurn = (scn, lang) => scn.script[lang][state.log.length] || null;

function consume(lang, qOverride) {
  const scn = scnOf(state.selSvc); if (!scn) return false;
  const turn = nextTurn(scn, lang); if (!turn) return false;
  state.log.push({ lang, q: qOverride ?? turn.q, a: turn.a });
  return true;
}

/* ============================================================
   5. 設定の永続化（言語 / テーマ）
   ============================================================ */
function loadPrefs() {
  try {
    const lang = localStorage.getItem('mock.lang');
    const theme = localStorage.getItem('mock.theme');
    if (lang && ['ja', 'zh', 'en'].includes(lang)) state.lang = lang;
    if (theme && ['light', 'dark'].includes(theme)) state.theme = theme;
  } catch (e) { /* プライベートモード等では既定値のまま */ }
}
function savePrefs() {
  try {
    localStorage.setItem('mock.lang', state.lang);
    localStorage.setItem('mock.theme', state.theme);
  } catch (e) { /* 保存できなくても動作に影響なし */ }
}
function applyPrefs() {
  const root = document.documentElement;
  root.setAttribute('data-theme', state.theme);
  root.setAttribute('data-lang', state.lang);
  root.setAttribute('lang', state.lang);
  document.getElementById('lang-select').value = state.lang;
  const btn = document.getElementById('theme-btn');
  btn.textContent = state.theme === 'dark' ? '☀' : '☾';
  btn.title = state.theme === 'dark' ? t('themeToLight') : t('themeToDark');
}

    <div class="c-crumb">${esc(L(c.name))}・${esc(L(sb.name))}</div>
    <div class="c-name">${esc(L(x.name))}</div>

      ${x.tags.map(k => `<span class="tag">${esc(tag(k))}</span>`).join('')}

}

function gridHTML(list) {

  return `<div class="grid">${list.map(cardHTML).join('')}</div>`;

/** 結果パネルの中身。items（縦積み）か columns+rows（表）のどちらか一方 */
function resultHTML(r) {
  const titleHTML = `<div class="kv"><div class="k">${esc(r.title)}</div></div>`;
  if (r.columns) {
    return titleHTML + `
      <table class="tbl">
        <thead><tr>${r.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${r.rows.map(row => `<tr>${row.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>`;
  }
  return titleHTML + r.items.map(it => `<div class="kv"><div class="k">${esc(it.k)}</div><div class="v">${esc(it.v)}</div></div>`).join('');
}

/** work-pane の中身（入力パネル＋結果パネル）。テンプレートごとに入力 UI だけ分岐する */
function panelHTML(scn) {
  const done = state.log.length > 0;
  const lang0 = done ? state.log[0].lang : scriptLang(state.lang);
  const inp = scn.input[lang0];
  let inputInner = '';
  if (scn.template === 'upload') {
    inputInner = `<div class="drop">${esc(t('dropHint'))}</div>` +
      inp.files.map(f => `<span class="file">📄 ${esc(f)}</span>`).join('');
  } else if (scn.template === 'form') {
    inputInner = inp.fields.map(f => `
      <div class="field"><label>${esc(f.label)}</label><div class="val">${esc(f.value)}</div></div>`).join('');
  } else if (scn.template === 'diff') {
    inputInner = `
      <div class="diff-in">
        <span class="file">📄 ${esc(t('beforeLabel'))}：${esc(inp.left)}</span>
        <span>⇄</span>
        <span class="file">📄 ${esc(t('afterLabel'))}：${esc(inp.right)}</span>
      </div>`;
  } else if (scn.template === 'lookup') {
    inputInner = `<div class="field"><div class="val">🔍 ${esc(inp.query)}</div></div>`;
  }
  return `
    <div class="panel${done ? ' done' : ''}">
      <div class="panel-h">${esc(t('inputPanel'))}</div>
      ${inputInner}
      <div class="run-row"><button class="btn-primary" data-act="run"${done ? ' disabled' : ''}>${esc(done ? t('runDone') : t('run'))}</button></div>
    </div>
    ${done ? `<div class="panel"><div class="panel-h">${esc(t('resultPanel'))}</div>${resultHTML(scn.result[lang0])}</div>` : ''}`;
}

/** チップ行（質問例）。qa 型 または 実行後は台本の次ターン、それ以外（実行前）は誘導文 */
function chipsHTML(scn) {
  const tJa = nextTurn(scn, 'ja'), tZh = nextTurn(scn, 'zh');
  if (scn.template !== 'qa' && state.log.length === 0) return `<span>${esc(t('runHint'))}</span>`;
  if (!tJa && !tZh) return `<span>${esc(t('demoDone'))}</span>`;
  return `<span>${esc(t('chipsLabel'))}</span>` +
    (tJa ? `<button class="chip" data-act="chip" data-arg="ja"><span class="cl">${esc(t('chipJa'))}</span>${esc(tJa.q)}</button>` : '') +
    (tZh ? `<button class="chip" data-act="chip" data-arg="zh"><span class="cl">${esc(t('chipZh'))}</span>${esc(tZh.q)}</button>` : '');
}

function renderMain() {
  const el = document.getElementById('main');

  const pat = PATTERNS.find(p => p.id === state.pattern);
  if (pat && !pat.ready) { el.innerHTML = todoHTML(pat); return; }

  if (state.view === 'list') {
    let title = t('allServices'), crumb = 'AI AGENT CATALOG';
    if (state.selSub) {
      const c = catOf(state.selCat), sb = subOf(state.selCat, state.selSub);
      title = L(sb.name);
      crumb = t('home') + ' ／ ' + L(c.name) + ' ／ ' + L(sb.name);
    } else if (state.selCat) {
      const c = catOf(state.selCat);
      title = L(c.name);
      crumb = t('home') + ' ／ ' + L(c.name);
    }
    const list = filtered();
    el.innerHTML = `
    <div class="list-wrap" data-screen-label="サービス一覧">
      <div class="list-head">
        <div>
          <div class="crumb">${esc(crumb)}</div>
          <div class="list-title"><h1>${esc(title)}</h1></div>
          <div class="count" id="count">${esc(countText(list.length))}</div>
        </div>
        <input class="search" id="search" placeholder="${esc(t('searchPh'))}" value="${esc(state.query)}">
      </div>
      <div id="grid-holder">${gridHTML(list)}</div>
    </div>`;
    const search = document.getElementById('search');
    search.addEventListener('input', () => {
      state.query = search.value;
      const l = filtered();
      document.getElementById('grid-holder').innerHTML = gridHTML(l);
      document.getElementById('count').textContent = countText(l.length);
    });

  } else if (state.view === 'detail') {
    const x = svcOf(state.selSvc);
    const c = catOf(x.cat), sb = subOf(x.cat, x.sub);
    const scn = scnOf(x.id);
    el.innerHTML = `
    <div class="detail-wrap" data-screen-label="サービス詳細">
      <button class="backlink" data-act="back"><span class="arrow"></span>${esc(t('backToList'))}</button>
      <div class="detail-card">
        <div class="d-crumb">${esc(L(c.name))}・${esc(L(sb.name))}</div>
        <h1>${esc(L(x.name))}</h1>
        <div class="d-meta">
          <span class="badge ${statusClass(x.st)}">${esc(statusText(x.st))}</span>
          ${x.tags.map(k => `<span class="tag">${esc(tag(k))}</span>`).join('')}
        </div>
        <div class="keyline"></div>
        <div class="sec-label">${esc(t('overview'))}</div>
        <p class="d-desc">${esc(L(x.desc))}</p>
        ${scn ? `
        <div class="d-two">
          <div>
            <div class="sec-label">${esc(t('personaLabel'))}</div>
            <div class="persona">
              <div class="avatar">${esc(L(scn.persona.name).charAt(0))}</div>
              <div>
                <div class="p-name">${esc(L(scn.persona.name))}</div>
                <div class="p-role">${esc(L(scn.persona.role))} ／ ${esc(L(scn.persona.site))}</div>
                <div class="p-native">${esc(t('nativeLabel'))}：${esc(scn.persona.native === 'ja' ? t('nativeJa') : t('nativeZh'))}</div>
              </div>
            </div>
          </div>
          <div>
            <div class="sec-label">${esc(t('screenType'))}</div>
            <span class="tpl-badge" title="${esc(t('tplBadge'))}">${esc(L(TEMPLATES[scn.template].name))}</span>
          </div>
        </div>
        <div class="sec-label">${esc(t('scenarioLabel'))}</div>
        <ol class="steps" aria-label="${esc(t('stepPrefix'))}">
          ${scn.steps[state.lang].map(s => `<li>${esc(s)}</li>`).join('')}
        </ol>` : ''}
        <div class="cta-row">
          <button class="btn-primary" data-act="start">${esc(scn ? t('startDemo') : t('startUse'))}</button>
          <span class="cta-note">${esc(t('mockNote'))}</span>
        </div>
      </div>
    </div>`;

  } else if (state.view === 'demo') {
    const x = svcOf(state.selSvc);
    const scn = scnOf(state.selSvc);
    el.innerHTML = `
    <div class="demo-wrap" data-screen-label="業務デモ">
      <div class="chat-hdr">
        <button class="backlink" data-act="backdetail"><span class="arrow"></span>${esc(t('backToDetail'))}</button>
        <div class="vline"></div>
        <div class="ct1">${esc(L(x.name))}</div>
        <span class="tpl-badge" title="${esc(t('tplBadge'))}">${esc(L(TEMPLATES[scn.template].name))}</span>
        <span class="who">${esc(L(scn.persona.name))}・${esc(L(scn.persona.site))}</span>
        <span class="status"><span class="dot ${statusClass(x.st)}"></span>${esc(statusText(x.st))}</span>
        <button class="backlink restart" data-act="restart">${esc(t('restart'))}</button>
      </div>
      <div class="demo-body">
        ${scn.template !== 'qa' ? `<div class="work-pane">${panelHTML(scn)}</div>` : ''}
        <div class="chat-pane">
          <div class="msgs" id="msgs"></div>
          <div class="chips" id="chips">${chipsHTML(scn)}</div>
          <div class="chat-input-row">
            <input class="chat-input" id="chat-input" placeholder="${esc(t('chatPh'))}">
            <button class="btn-send" data-act="send">${esc(t('send'))}</button>
          </div>
        </div>
      </div>
    </div>`;
    const sl = scriptLang(state.lang);
    addMsg('agent', T.chatHello[sl].replace('{name}', x.name[sl]));
    /* log の復元。最後の 1 ターンだけ agent 返答を遅らせ、それ以前は即時描画する。
       renderMain() は #msgs を作り直すので、前回の遅延がまだ残っていれば消しておく
       （連打時に古い #msgs へ二重に描画されるのを防ぐ） */
    if (demoReplyTimer) { clearTimeout(demoReplyTimer); demoReplyTimer = null; }
    state.log.forEach((turn, i) => {
      addMsg('user', turn.q);
      if (i === state.log.length - 1) demoReplyTimer = setTimeout(() => addMsg('agent', turn.a), 700);
      else addMsg('agent', turn.a);
    });
    const input = document.getElementById('chat-input');
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });
    input.focus();

  } else {
    const x = svcOf(state.selSvc);
    el.innerHTML = `
    <div class="chat-wrap" data-screen-label="チャット画面">
      <div class="chat-hdr">
        <button class="backlink" data-act="backdetail"><span class="arrow"></span>${esc(t('backToDetail'))}</button>
        <div class="vline"></div>
        <div class="ct1">${esc(L(x.name))}</div>
        <span class="status"><span class="dot ${statusClass(x.st)}"></span>${esc(statusText(x.st))}</span>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="chat-input-row">
        <input class="chat-input" id="chat-input" placeholder="${esc(t('chatPh'))}">
        <button class="btn-send" data-act="send">${esc(t('send'))}</button>
      </div>
    </div>`;
    addMsg('agent', t('chatHello').replace('{name}', L(x.name)));
    const input = document.getElementById('chat-input');
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });
    input.focus();
  }
  el.scrollTop = 0;
}

function addMsg(who, text) {
  const box = document.getElementById('msgs');
  if (!box) return;
  const row = document.createElement('div');
  row.className = 'msg-row ' + who;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

function sendChat() {
  const input = document.getElementById('chat-input');
  const v = input.value.trim();
  if (!v) return;
  const x = svcOf(state.selSvc);
  /* 返答は「入力された言語」に合わせる（メニュー表示言語とは独立） */
  const lang = detectLang(v);
  if (state.view === 'demo') {
    const sl = scriptLang(lang);
    input.value = '';
    if (consume(sl, v)) { renderMain(); return; }        // 台本があれば台本の a を返す（q は入力文で置換）
    addMsg('user', v);                                    // 台本が尽きたら従来の汎用返答
    setTimeout(() => addMsg('agent', T.chatReply[sl].replace('{name}', x.name[sl])), 700);
    return;
  }
  /* --- 以下は既存のまま（chat view） --- */
  addMsg('user', v); input.value = '';
  setTimeout(() => addMsg('agent', T.chatReply[lang].replace('{name}', x.name[lang])), 700);
}

/* ============================================================
   10. イベント（遷移ロジック — 全パターン共通）
   ============================================================ */
function renderAll() { renderChrome(); renderSeg(); renderSidebar(); renderMain(); }

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn || btn.disabled) return;
  const act = btn.dataset.act, arg = btn.dataset.arg;

  if (act === 'pattern') { state.pattern = arg; renderAll(); }
  else if (act === 'all') { state.selCat = null; state.selSub = null; state.view = 'list'; renderAll(); }
  else if (act === 'cat') {
    const open = !!state.openCats[arg];
    state.openCats[arg] = !open;
    if (!open) { state.selCat = arg; state.selSub = null; state.lastCat = arg; state.view = 'list'; }
    renderAll();
  }
  else if (act === 'sub') {
    const [c, sb] = arg.split(':');
    state.selCat = c; state.selSub = sb; state.lastCat = c; state.openCats[c] = true; state.view = 'list';
    renderAll();
  }
  else if (act === 'svc') { state.selSvc = arg; state.view = 'detail'; state.log = []; renderMain(); }
  else if (act === 'back') { state.view = 'list'; renderAll(); }
  else if (act === 'backdetail') { state.view = 'detail'; renderMain(); }
  else if (act === 'start') {
    if (scnOf(state.selSvc)) { state.log = []; state.view = 'demo'; }
    else { state.view = 'chat'; }
    renderMain();
  }
  else if (act === 'run') { if (state.log.length === 0) { consume(scriptLang(state.lang)); renderMain(); } }
  else if (act === 'chip') { consume(arg); renderMain(); }
  else if (act === 'restart') { state.log = []; renderMain(); }
  else if (act === 'send') { sendChat(); }
});

document.getElementById('lang-select').addEventListener('change', (e) => {
  state.lang = e.target.value;
  savePrefs(); applyPrefs(); renderAll();
});

document.getElementById('theme-btn').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  savePrefs(); applyPrefs();
});

/* ================= 起動 ================= */
loadPrefs();
applyPrefs();
renderAll();
</script>
</body>
</html>
