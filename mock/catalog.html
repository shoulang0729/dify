<!DOCTYPE html>
<html lang="ja" data-theme="light" data-lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIエージェントカタログ ／ AI智能体服务目录 ／ AI Agent Catalog</title>
<template id="__bundler_thumbnail" data-bg-color="#070F26">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect x="360" y="240" width="120" height="320" fill="#0071BC"/>
    <rect x="510" y="240" width="330" height="90" fill="#FFFFFF" opacity="0.92"/>
    <rect x="510" y="355" width="330" height="90" fill="#FFFFFF" opacity="0.55"/>
    <rect x="510" y="470" width="330" height="90" fill="#FFFFFF" opacity="0.3"/>
  </svg>
</template>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="app">

  <!-- レビュー用の足場。本番UIには存在しない領域 -->
  <div class="mockbar" data-screen-label="モックツールバー">
    <div class="label" id="mock-label">CONCEPT MOCK</div>
    <div class="segwrap">
      <span class="seglabel" id="ind-label">業種:</span>
      <div class="seg" id="ind-seg"></div>
      <span class="seglabel" id="seg-label">パターン:</span>
      <div class="seg" id="seg"></div>
    </div>
  </div>

  <!-- ここから下が本番相当の画面 -->
  <header class="hdr">
    <span class="wordmark" id="wordmark">会社ロゴ</span>
    <div class="vline"></div>
    <div class="t1" id="app-title">AIエージェントカタログ</div>
    <div class="right">
      <div class="ctrl">
        <select class="lang-select" id="lang-select" aria-label="Language">
          <option value="ja">日本語</option>
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
        <button class="theme-btn" id="theme-btn" aria-label="Theme"></button>
      </div>
      <span class="dept" id="dept">情報システム部</span>
      <div class="avatar">S</div>
    </div>
  </header>

  <div class="body">
    <div id="sidebar" style="display: contents;"></div>
    <main id="main"></main>
  </div>
</div>

<!-- データ層（純粋なリテラルのみ。実行時副作用なし） -->
<script src="js/data/ui.js"></script>
<script src="js/data/catalog.js"></script>
<script src="js/data/home.js"></script>
<script src="js/data/style.js"></script>
<script src="js/data/scenarios/mfg/kn.js"></script>
<script src="js/data/scenarios/mfg/qa.js"></script>
<script src="js/data/scenarios/mfg/dc.js"></script>
<script src="js/data/scenarios/mfg/lg.js"></script>
<script src="js/data/scenarios/mfg/nm.js"></script>
<script src="js/data/scenarios/mfg/en.js"></script>
<script src="js/data/scenarios/mfg/gn.js"></script>
<script src="js/data/scenarios/mfg/pt.js"></script>
<!-- アプリ層 -->
<script src="js/app.js"></script>
<script src="js/render.js"></script>
<script src="js/events.js"></script>
</body>
</html>
