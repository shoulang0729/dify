<!-- データ層（純粋なリテラルのみ。実行時副作用なし） -->
<script src="js/data/ui.js"></script>
<script src="js/data/catalog.js"></script>
<script src="js/data/home.js"></script>
<script src="js/data/style.js"></script>
<script src="js/data/scenarios/kn.js"></script>
<script src="js/data/scenarios/qa.js"></script>
<script src="js/data/scenarios/dc.js"></script>
<script src="js/data/scenarios/lg.js"></script>
<script src="js/data/scenarios/nm.js"></script>
<script src="js/data/scenarios/en.js"></script>
<script src="js/data/scenarios/gn.js"></script>
<script src="js/data/scenarios/pt.js"></script>
<!-- アプリ層 -->
<script>
'use strict';

/* ============================================================
   3. 状態（共通レイヤー）
   pattern を切り替えても選択位置は保持され、直接比較できる
   ============================================================ */
const state = {
  pattern: 'nav',
  lang: 'ja',
  theme: 'light',
  openCats: { kn: true },
  selCat: null,
  selSub: null,
  lastCat: 'kn',
  selSvc: null,
  view: 'list',          // 'list' | 'detail' | 'chat' | 'demo'
  query: '',
  log: []                // デモで消費した台本ターン [{ lang: 'ja'|'zh', q: string, a: string }]
};

/* ============================================================
   4. ヘルパー
   ============================================================ */
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
/** 多言語オブジェクトから現在言語の文字列を取り出す */
const L = (obj) => (obj && (obj[state.lang] ?? obj.ja)) || '';
const t = (key) => L(T[key]);
const tag = (key) => L(TAGS[key]) || key;

const catOf = (id) => CATS.find(c => c.id === id);
const subOf = (catId, subId) => { const c = catOf(catId); return c && c.subs.find(b => b.id === subId); };
const svcOf = (id) => SVCS.find(x => x.id === id);
const countSub = (subId) => SVCS.filter(x => x.sub === subId).length;
const countCat = (catId) => SVCS.filter(x => x.cat === catId).length;
/* st: 1 提供中 / 2 試行版 / 3 構想 */
const statusText = (st) => st === 1 ? t('statusLive') : st === 2 ? t('statusTrial') : t('statusConcept');
const statusClass = (st) => st === 1 ? 'live' : st === 2 ? 'trial' : 'concept';

const pad2 = (n) => String(n).padStart(2, '0');
/** サービス id → 管理番号（kn2 → KN-02）。表示のためだけの変換。データには持たせない */
const svcCode = (id) => {
  const m = /^([a-z]+)(\d+)$/.exec(id);
  return m ? `${m[1].toUpperCase()}-${pad2(m[2])}` : String(id).toUpperCase();
};

/* ---- NEW 表示（SVCS[].added。§2-3：state もデータも増やさず、その場で計算する） ----
   DEMO_DATE に 'YYYY-MM-DD' を入れるとその日を「今日」として固定できる（デモ当日に
   30 日を過ぎていても NEW を出し続けたいとき）。null なら実際の今日。
   コミットする既定値は null。固定したまま main に入れないこと（verify §7 が warn する） */
const NEW_DAYS = 30;
const DEMO_DATE = null;   // 例: '2026-09-20'
/** 今日（ローカル時刻）の 'YYYY-MM-DD'。DEMO_DATE があればそれを返す */
const today = () => {
  if (DEMO_DATE) return DEMO_DATE;
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
};
/** 追加日からの経過日数。added が無い / 解釈できないときは null */
const daysSince = (added) => {
  if (typeof added !== 'string') return null;
  const a = Date.parse(added + 'T00:00:00Z'), n = Date.parse(today() + 'T00:00:00Z');
  if (Number.isNaN(a) || Number.isNaN(n)) return null;
  return Math.floor((n - a) / 86400000);
};
/** NEW を出すか（追加日から NEW_DAYS 日以内。未来日も NEW 扱い） */
const isNew = (x) => { const d = daysSince(x && x.added); return d !== null && d < NEW_DAYS; };
/** 新着サービスを added の新しい順に返す（同日は SVCS の並び順を保つ＝安定ソート） */
const newSvcs = () => SVCS.filter(isNew).sort((a, b) => (a.added < b.added ? 1 : a.added > b.added ? -1 : 0));

/** 分類アイコン。size は 'ic-sm'(16) / ''(20) / 'ic-lg'(24) / 'ic-xl'(28)
    未知の分類 id でも _fallback で必ず描ける（§2-9） */
const catIcon = (id, size) => `<svg class="ic ${size || ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${(CAT_STYLE[id] || CAT_STYLE._fallback).icon}</svg>`;
/** 分類アクセント色を要素に載せるクラス。未定義分類は空文字＝既定色（--cat-accent）のまま */
const catClass = (id) => (CAT_STYLE[id] ? `cat-${id}` : '');

/** 入力テキストの言語を判定（ひらがな/カタカナ→ja、漢字のみ→zh、それ以外→UI言語）
    エージェントは UI 言語と無関係に日本語・中国語どちらの入力も受け付ける */
function detectLang(s) {
  if (/[぀-ヿ]/.test(s)) return 'ja';
  if (/[一-鿿]/.test(s)) return 'zh';
  return state.lang;
}
const countText = (n) => state.lang === 'en' ? (n + t('countUnit')) : (n + t('countUnit'));

function filtered() {
  let list = SVCS;
  if (state.selSub) list = list.filter(x => x.sub === state.selSub);
  else if (state.selCat) list = list.filter(x => x.cat === state.selCat);
  const q = state.query.trim().toLowerCase();
  if (q) {
    list = list.filter(x => {
      const hay = [x.name.ja, x.name.zh, x.name.en, x.desc.ja, x.desc.zh, x.desc.en,
                   ...x.tags.map(k => [TAGS[k].ja, TAGS[k].zh, TAGS[k].en].join(''))].join('');
      return hay.toLowerCase().indexOf(q) >= 0;
    });
  }
  return list;
}

/* ---- デモ（業務デモ画面）ヘルパー（§2-4） ---- */
/** demo view の agent 返答遅延タイマー。renderMain() 再実行時に消し忘れると
    連打・言語切替で古い #msgs へ二重に addMsg してしまうため保持する */
let demoReplyTimer = null;
/** Issue #39：エージェントが「処理している」感を出すための返答遅延パラメータ。
    delay = base + perChar*文字数 を min〜max にクランプ。PM が体感を見て調整してよい */
const DEMO_REPLY_MS = { base: 1200, perChar: 25, min: 1500, max: 3500 };
const demoDelay = (text) => Math.min(DEMO_REPLY_MS.max,
  Math.max(DEMO_REPLY_MS.min, DEMO_REPLY_MS.base + (text ? text.length : 0) * DEMO_REPLY_MS.perChar));
/** true の間、agent の返答は表示待ち（考え中）。send/chip/run はこの間無視して二重消費を防ぐ。
    scripted（state.log に積んだ台本ターン）の pending は renderMain() 再実行後も保持して再スケジュールするが、
    freeform（台本が尽きた後の汎用返答）の pending は再描画されたら諦める（msgs 自体が作り直されるため） */
let demoPending = false;
let demoPendingFreeform = false;
const scnOf = (id) => SCENARIOS[id] || null;
/** 台本は ja / zh のみ。UI が en のときは ja の台本を使う（§2-5：エージェント本体は日中） */
const scriptLang = (l) => (l === 'zh' ? 'zh' : 'ja');
/** 次に消費する台本ターン（尽きていれば null） */
const nextTurn = (scn, lang) => scn.script[lang][state.log.length] || null;

function consume(lang, qOverride) {
  const scn = scnOf(state.selSvc); if (!scn) return false;
  const turn = nextTurn(scn, lang); if (!turn) return false;
  state.log.push({ lang, q: qOverride ?? turn.q, a: turn.a });
  return true;
}

/* ============================================================
   5. 設定の永続化（言語 / テーマ）
   ============================================================ */
function loadPrefs() {
  try {
    const lang = localStorage.getItem('mock.lang');
    const theme = localStorage.getItem('mock.theme');
    if (lang && ['ja', 'zh', 'en'].includes(lang)) state.lang = lang;
    if (theme && ['light', 'dark'].includes(theme)) state.theme = theme;
  } catch (e) { /* プライベートモード等では既定値のまま */ }
}
function savePrefs() {
  try {
    localStorage.setItem('mock.lang', state.lang);
    localStorage.setItem('mock.theme', state.theme);
  } catch (e) { /* 保存できなくても動作に影響なし */ }
}
function applyPrefs() {
  const root = document.documentElement;
  root.setAttribute('data-theme', state.theme);
  root.setAttribute('data-lang', state.lang);
  root.setAttribute('lang', state.lang);
  document.getElementById('lang-select').value = state.lang;
  const btn = document.getElementById('theme-btn');
  btn.textContent = state.theme === 'dark' ? '☀' : '☾';
  btn.title = state.theme === 'dark' ? t('themeToLight') : t('themeToDark');
}

/* ============================================================
   6. 描画 — 固定文言
   ============================================================ */
function renderChrome() {
  document.getElementById('mock-label').textContent = t('mockLabel');
  document.getElementById('seg-label').textContent = t('segLabel');
  document.getElementById('wordmark').textContent = t('wordmark');
  document.getElementById('app-title').textContent = t('appTitle');
  document.getElementById('dept').textContent = t('dept');
  document.title = T.appTitle.ja + ' ／ ' + T.appTitle.zh + ' ／ ' + T.appTitle.en;
}

/* ============================================================
   7. 描画 — パターン選択（モック用の足場）
   ============================================================ */
function renderSeg() {
  document.getElementById('seg').innerHTML = PATTERNS.map(p =>
    `<button class="${state.pattern === p.id ? 'on' : ''}"${p.ready ? '' : ' disabled'}
       data-act="pattern" data-arg="${p.id}" title="${esc(L(p.desc))}">${esc(L(p.name))}</button>`
  ).join('');
}

/* ============================================================
   8. 描画 — サイドバー（① 階層ナビ型）
   ============================================================ */
function renderSidebar() {
  const el = document.getElementById('sidebar');
  if (state.pattern !== 'nav') { el.innerHTML = ''; return; }
  el.innerHTML = `
  <nav class="side" data-screen-label="階層ナビ">
    <button class="nav-item ${!state.selCat && !state.selSub ? 'on' : ''}" data-act="all">
      <span class="n-label">${esc(t('allServices'))}</span>
      <span class="cnt">${SVCS.length}</span>
    </button>
    <div class="nav-divider"></div>
    ${CATS.map(c => {
      const open = !!state.openCats[c.id];
      const on = state.selCat === c.id && !state.selSub;
      return `
      <button class="nav-item ${on ? 'on' : ''} ${catClass(c.id)}" data-act="cat" data-arg="${c.id}">
        ${catIcon(c.id)}
        <span class="n-label">${esc(L(c.name))}</span>
        <span class="chev ${open ? 'open' : ''}"></span>
      </button>
      ${open ? c.subs.map(sb => `
        <button class="nav-sub ${state.selSub === sb.id ? 'on' : ''}" data-act="sub" data-arg="${c.id}:${sb.id}">
          <span class="n-label">${esc(L(sb.name))}</span>
          <span class="cnt">${countSub(sb.id)}</span>
        </button>`).join('') : ''}`;
    }).join('')}
  </nav>`;
}

/* ============================================================
   9. 描画 — 右ペイン
   ============================================================ */
/** NEW バッジ 1 個。新着でなければ空文字（呼び出し側に分岐を書かない） */
const newBadgeHTML = (x) => isNew(x) ? `<span class="badge-new">${esc(t('newBadge'))}</span>` : '';

function cardHTML(x) {
  const c = catOf(x.cat), sb = subOf(x.cat, x.sub);
  return `
  <div class="card ${catClass(x.cat)}" data-act="svc" data-arg="${x.id}">
    <div class="c-top">
      <span class="c-tile">${catIcon(x.cat)}</span>
      <div class="c-head">
        <div class="c-crumb">${esc(L(c.name))}・${esc(L(sb.name))}</div>
        <div class="c-name">${esc(L(x.name))}</div>
      </div>
      <span class="c-code">${newBadgeHTML(x)}<span class="code">${esc(svcCode(x.id))}</span></span>
    </div>
    <div class="c-desc">${esc(L(x.desc))}</div>
    <div class="c-meta">
      <span class="status"><span class="dot ${statusClass(x.st)}"></span>${esc(statusText(x.st))}</span>
      ${x.tags.map(k => `<span class="tag">${esc(tag(k))}</span>`).join('')}
    </div>
  </div>`;
}

function gridHTML(list) {
  if (!list.length) return `<div class="empty">${esc(t('noResults'))}</div>`;
  return `<div class="grid">${list.map(cardHTML).join('')}</div>`;
}

/** ②③ 未実装パターンの説明プレースホルダ */
function todoHTML(p) {
  return `
  <div class="todo-wrap" data-screen-label="準備中">
    <div class="todo-card">
      <div class="t-eyebrow">${esc(t('todoEyebrow'))}</div>
      <h2>${esc(L(p.name))} — ${esc(t('todoTitle'))}</h2>
      <p>${esc(L(p.desc))}</p>
    </div>
  </div>`;
}

/* ============================================================
   9a. 描画 — ② ダッシュボード（ホーム）
   ============================================================ */
/** ②③ ホームの検索欄を束ねる。sectionsFn() はホーム本体の HTML を返す関数（§3-5）
    renderMain() を呼ばないので IME 変換中のフォーカス/キャレットが保持される */
function bindHomeSearch(sectionsFn) {
  const s = document.getElementById('search');
  const h = document.getElementById('home-holder');
  if (!s || !h) return;
  s.addEventListener('input', () => {
    state.query = s.value;
    const q = state.query.trim();
    if (!q) { h.innerHTML = sectionsFn(); return; }      // 空に戻したらホームを復元
    const list = filtered();
    h.innerHTML = `<div class="home-count">${esc(countText(list.length))}</div>` + gridHTML(list);
  });
}

/** ② ダッシュボード：ホーム本体（検索で差し替える範囲） */
function dashSectionsHTML() {
  const maxUses = Math.max(...HOME.frequent.map(f => f.uses));
  const freqHTML = `
    <div class="dash-sec">
      <div class="sec-h">
        <h2>${esc(t('dashFreq'))}</h2>
        <span class="sec-note">${esc(t('dashFreqNote'))}</span>
      </div>
      <div class="use-list">
        ${HOME.frequent.map((f, i) => {
          const x = svcOf(f.id), c = catOf(x.cat);
          const w = Math.round(f.uses / maxUses * 100);
          return `
          <button class="use-row ${catClass(x.cat)}" data-act="svc" data-arg="${x.id}">
            <span class="use-rank">${i + 1}</span>
            <span class="use-main">
              <span class="use-name">${catIcon(x.cat, 'ic-sm')}${esc(L(x.name))}
                <span class="code">${esc(svcCode(x.id))}</span></span>
              <span class="use-sub">${esc(L(c.name))}
                <span class="status"><span class="dot ${statusClass(x.st)}"></span>${esc(statusText(x.st))}</span></span>
            </span>
            <span class="use-bar"><span class="use-fill" style="width:${w}%"></span></span>
            <span class="use-n">${esc(t('usesUnit').replace('{n}', f.uses))}</span>
            <span class="cat-chev"></span>
          </button>`;
        }).join('')}
      </div>
    </div>`;

  const recoHTML = `
    <div class="dash-sec reco-panel">
      <div class="sec-h">
        <h2>${esc(t('dashReco'))}</h2>
        <span class="sec-note">${esc(t('dashRecoNote'))}</span>
      </div>
      <div class="reco-grid">
        ${HOME.recommended.map(r => {
          const x = svcOf(r.id);
          return `
          <div class="reco-item ${catClass(x.cat)}">
            ${cardHTML(x)}
            <div class="r-why"><span class="r-why-l">${esc(t('recoWhy'))}</span>${esc(L(r.why))}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;

  const legendHTML = `
    <span class="legend" title="${esc(t('dashCatsNote'))}">
      <span class="lg-i"><span class="dot live"></span>${esc(t('statusLive'))}</span>
      <span class="lg-i"><span class="dot trial"></span>${esc(t('statusTrial'))}</span>
      <span class="lg-i"><span class="dot concept"></span>${esc(t('statusConcept'))}</span>
    </span>`;

  const catsHTML = `
    <div class="dash-sec">
      <div class="sec-h">
        <h2>${esc(t('dashCats'))}</h2>
        ${legendHTML}
      </div>
      ${CATS.map(c => {
        const list = SVCS.filter(x => x.cat === c.id);
        const maxCat = Math.max(...CATS.map(cc => SVCS.filter(x => x.cat === cc.id).length));
        const cn1 = list.filter(x => x.st === 1).length;
        const cn2 = list.filter(x => x.st === 2).length;
        const cn3 = list.filter(x => x.st === 3).length;
        const total = list.length || 1;
        return `
        <button class="cat-row ${catClass(c.id)}" data-act="gocat" data-arg="${c.id}">
          <span class="cat-tile">${catIcon(c.id, 'ic-lg')}</span>
          <span class="c-nm">${esc(L(c.name))}</span>
          <span class="cat-mix">${esc(countText(list.length))}</span>
          <span class="cat-bar-track"><span class="cat-bar" style="width:${Math.round(list.length / maxCat * 100)}%">
            ${cn1 ? `<span class="s-live" style="width:${(cn1 / total * 100)}%"></span>` : ''}
            ${cn2 ? `<span class="s-trial" style="width:${(cn2 / total * 100)}%"></span>` : ''}
            ${cn3 ? `<span class="s-concept" style="width:${(cn3 / total * 100)}%"></span>` : ''}
          </span></span>
          <span class="cat-mix">${cn1} / ${cn2} / ${cn3}</span>
          <span class="cat-chev"></span>
        </button>`;
      }).join('')}
    </div>`;

  /* 新しく追加されたエージェント（added 降順で最新 3 件）。新着 0 件なら帯ごと出さない。
     HOME には書かない＝データは SVCS[].added が唯一の出どころ */
  const nw = newSvcs().slice(0, 3);
  const newHTML = !nw.length ? '' : `
    <div class="dash-sec dash-new">
      <div class="sec-h">
        <h2>${esc(t('dashNew'))}</h2>
        <span class="sec-note">${esc(t('dashNewNote').replace('{n}', NEW_DAYS))}</span>
      </div>
      <div class="grid">
        ${nw.map(x => `
          <div class="new-item">
            ${cardHTML(x)}
            <div class="new-date">${esc(t('addedOn').replace('{d}', x.added))}</div>
          </div>`).join('')}
      </div>
    </div>`;

  return `${newHTML}<div class="dash-duo">${recoHTML}<div class="dash-col">${freqHTML}${catsHTML}</div></div>`;
}

function renderDash(el) {
  const n1 = SVCS.filter(x => x.st === 1).length;
  const n2 = SVCS.filter(x => x.st === 2).length;
  const n3 = SVCS.filter(x => x.st === 3).length;
  el.innerHTML = `
  <div class="dash-wrap" data-screen-label="ダッシュボード">
    <section class="hero">
      <svg class="hero-bg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g opacity="0.3">
          <line class="h-line" x1="0" y1="64" x2="1200" y2="64"></line>
          <line class="h-line" x1="0" y1="150" x2="1200" y2="150"></line>
          <line class="h-line" x1="0" y1="236" x2="1200" y2="236"></line>
        </g>
        <g opacity="0.55">
          <line class="h-belt" x1="0" y1="64" x2="1200" y2="64"></line>

   管理番号は出さない（PM 判断 D-14）。

/** kind → ラベル文言。verify.mjs は `t('...')` のリテラル引数しか参照追跡しないため、
    分岐で個別に呼ぶ（`t(KIND_LABEL[kind])` のような間接参照にしない） */
const kindLabel = (kind) => kind === 'due' ? t('kindDue') : kind === 'notify' ? t('kindNotify') : t('kindRoutine');

/** ③「お知らせ」に自動で足す新着行。FEED.items には書かない（データの出どころは SVCS[].added だけ）。
    FEED.items に同じ id が既にあるものは二重表示になるので除く */
const newFeedItems = () => {
  const listed = new Set(FEED.items.map(i => i.id));
  return newSvcs().filter(x => !listed.has(x.id)).map(x => {
    const code = svcCode(x.id);
    const fill = (o) => ({ ja: o.ja.replace('{code}', code), zh: o.zh.replace('{code}', code), en: o.en.replace('{code}', code) });
    return { id: x.id, kind: 'notify', when: fill(T.feedNewWhen), note: fill(T.feedNewAgent) };
  });
};

/** 「考え中」インジケータ（3 点脈打つドット）。文言は使わない（§2-2/Issue #39） */
const dotsHTML = () => `<span class="think-dots"><span></span><span></span><span></span></span>`;

const pendingHTML = () => `<div class="processing">${dotsHTML()}</div>`;

/** 結果パネルの中身。items（縦積み）か columns+rows（表）のどちらか一方 */
function resultHTML(r) {
  const titleHTML = `<div class="kv"><div class="k">${esc(r.title)}</div></div>`;
  if (r.columns) {
    return titleHTML + `
      <table class="tbl">
        <thead><tr>${r.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${r.rows.map(row => `<tr>${row.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>`;
  }
  return titleHTML + r.items.map(it => `<div class="kv"><div class="k">${esc(it.k)}</div><div class="v">${esc(it.v)}</div></div>`).join('');
}

/** work-pane の中身（入力パネル＋結果パネル）。テンプレートごとに入力 UI だけ分岐する */
function panelHTML(scn) {
  const done = state.log.length > 0;

  if (scn.template === 'upload') {
    inputInner = `<div class="drop">${esc(t('dropHint'))}</div>` +
      inp.files.map(f => `<span class="file">📄 ${esc(f)}</span>`).join('');

    inputInner = inp.fields.map(f => `
      <div class="field"><label>${esc(f.label)}</label><div class="val">${esc(f.value)}</div></div>`).join('');

    inputInner = `

  } else if (scn.template === 'lookup') {
    inputInner = `<div class="field"><div class="val">🔍 ${esc(inp.query)}</div></div>`;
  }
  return `
    <div class="panel${done ? ' done' : ''}">
      <div class="panel-h">${esc(t('inputPanel'))}</div>

function addMsg(who, text) {
  const box = document.getElementById('msgs');
  if (!box) return;
  const row = document.createElement('div');
  row.className = 'msg-row ' + who;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

/** agent 側の「考え中」バブル（3 点ドット）。文言は使わない（Issue #39） */
function showTyping() {
  const box = document.getElementById('msgs');
  if (!box || document.getElementById('typing-row')) return;
  const row = document.createElement('div');
  row.className = 'msg-row agent';
  row.id = 'typing-row';
  const b = document.createElement('div');
  b.className = 'bubble typing';
  b.innerHTML = dotsHTML();
  row.appendChild(b);
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}
function hideTyping() {
  const row = document.getElementById('typing-row');
  if (row) row.remove();
}

/** 台本が尽きた後の汎用返答（T.chatReply）。demo / chat どちらの view でも同じ遅延・インジケータにする */
function scheduleFreeReply(text) {
  demoPending = true;
  demoPendingFreeform = true;
  showTyping();
  demoReplyTimer = setTimeout(() => {
    hideTyping();
    addMsg('agent', text);
    demoPending = false;
    demoPendingFreeform = false;
    demoReplyTimer = null;
  }, demoDelay(text));
}

function sendChat() {
  if (demoPending) return; // 返答待ちの間は二重送信を無視（Issue #39）
  const input = document.getElementById('chat-input');
  const v = input.value.trim();
  if (!v) return;
  const x = svcOf(state.selSvc);
  /* 返答は「入力された言語」に合わせる（メニュー表示言語とは独立） */
  const lang = detectLang(v);
  if (state.view === 'demo') {
    const sl = scriptLang(lang);
    input.value = '';
    if (consume(sl, v)) { demoPending = true; renderMain(); return; }  // 台本があれば台本の a を返す（q は入力文で置換）
    addMsg('user', v);                                                  // 台本が尽きたら従来の汎用返答
    scheduleFreeReply(T.chatReply[sl].replace('{name}', x.name[sl]));
    return;
  }
  /* --- 以下は既存のまま（chat view） --- */
  addMsg('user', v); input.value = '';
  scheduleFreeReply(T.chatReply[lang].replace('{name}', x.name[lang]));
}

function renderAll() { renderChrome(); renderSeg(); renderSidebar(); renderMain(); }

document.addEventListener('click', (e) => {

  if (act === 'pattern') { state.pattern = arg; renderAll(); }
  else if (act === 'all') { state.selCat = null; state.selSub = null; state.view = 'list'; renderAll(); }
  else if (act === 'cat') {
    const open = !!state.openCats[arg];
    state.openCats[arg] = !open;
    if (!open) { state.selCat = arg; state.selSub = null; state.lastCat = arg; state.view = 'list'; }
    renderAll();
  }
  else if (act === 'gocat') {
    state.selCat = arg; state.selSub = null; state.lastCat = arg;
    state.openCats[arg] = true; state.view = 'list'; state.query = '';
    renderAll();
  }
  else if (act === 'sub') {
    const [c, sb] = arg.split(':');
    state.selCat = c; state.selSub = sb; state.lastCat = c; state.openCats[c] = true; state.view = 'list';
    renderAll();
  }
  else if (act === 'svc') { state.selSvc = arg; state.view = 'detail'; state.log = []; renderMain(); }
  else if (act === 'back') { state.view = 'list'; renderAll(); }
  else if (act === 'backdetail') { state.view = 'detail'; renderMain(); }
  else if (act === 'start') {
    if (scnOf(state.selSvc)) { state.log = []; state.view = 'demo'; }
    else { state.view = 'chat'; }
    renderMain();
  }
  else if (act === 'run') {
    if (demoPending) return; // 返答待ちの間は二重消費を無視（Issue #39）
    if (state.log.length === 0 && consume(scriptLang(state.lang))) { demoPending = true; renderMain(); }
  }
  else if (act === 'chip') {
    if (demoPending) return; // 返答待ちの間は二重消費を無視（Issue #39）
    if (consume(arg)) { demoPending = true; renderMain(); }
  }
  else if (act === 'restart') { state.log = []; demoPending = false; demoPendingFreeform = false; renderMain(); }
  else if (act === 'send') { sendChat(); }
});

document.getElementById('lang-select').addEventListener('change', (e) => {
  state.lang = e.target.value;
  savePrefs(); applyPrefs(); renderAll();
});

document.getElementById('theme-btn').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  savePrefs(); applyPrefs();
});

/* ================= 起動 ================= */
loadPrefs();
applyPrefs();
renderAll();
</script>
</body>
</html>
