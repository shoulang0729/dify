style=\"font-size:10.5px;color:#8A98A4;\">AIエージェントポータル<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <span class=\"vline\"><\u002Fspan>\n    <span class=\"pill\">Powered by Dify<\u002Fspan>\n    <div style=\"margin-left:auto;display:flex;align-items:center;gap:14px;\">\n      <span style=\"font-size:12.5px;color:#5A6B78;\">信息系统部&nbsp;<span style=\"color:#B6BFC7;\">/ 情報システム部<\u002Fspan><\u002Fspan>\n      <span class=\"avatar\">佐<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div id=\"stage\"><\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n'use strict';\n\n/* ============ 統一アイコンシステム ============ */\nconst TILE = {\n  doc:  { ink:'#0071BC', bg:'#E6F1F9' },\n  ana:  { ink:'#1E9E6A', bg:'#E4F5EC' },\n  kn:   { ink:'#0098A6', bg:'#E0F5F7' },\n  auto: { ink:'#C77800', bg:'#FBF1DA' },\n  cs:   { ink:'#C2410C', bg:'#FBEAE2' },\n  dev:  { ink:'#3D4A57', bg:'#EEF1F3' }\n};\nconst GLYPH = {\n  doc:'<path d=\"M8 3h6l4 4v13.4a.6.6 0 0 1-.6.6H8.6a.6.6 0 0 1-.6-.6V3.6A.6.6 0 0 1 8 3z\"/><path d=\"M14 3v4h4\"/><path d=\"M9.6 12.4h4.8\"/><path d=\"M9.6 15.8h4.8\"/>',\n  ana:'<path d=\"M4 4v16h16\"/><path d=\"M8 16.5v-3.5\"/><path d=\"M12.5 16.5V8\"/><path d=\"M17 16.5v-5.5\"/>',\n  kn:'<circle cx=\"11\" cy=\"11\" r=\"6\"/><path d=\"M20 20l-4.7-4.7\"/>',\n  auto:'<path d=\"M13 3L5.5 13H11l-1 8 8.5-11H13z\"/>',\n  cs:'<path d=\"M5 6a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H10l-4 4v-4H6a1 1 0 0 1-1-1z\"/><circle cx=\"9.5\" cy=\"10\" r=\"0.9\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"12.5\" cy=\"10\" r=\"0.9\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"15.5\" cy=\"10\" r=\"0.9\" fill=\"currentColor\" stroke=\"none\"/>',\n  dev:'<path d=\"M9 8l-5 4 5 4\"/><path d=\"M15 8l5 4-5 4\"/>'\n};\nfunction tile(cat, size){\n  const c = TILE[cat] || TILE.doc;\n  const isz = Math.round(size * 0.54);\n  const r = Math.round(size * 0.26);\n  return `<span style=\"width:${size}px;height:${size}px;border-radius:${r}px;background:${c.bg};color:${c.ink};display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;\">`\n    + `<svg width=\"${isz}\" height=\"${isz}\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${GLYPH[cat]||GLYPH.doc}<\u002Fsvg><\u002Fspan>`;\n}\n\n/* ============ データ ============ */\nconst ST = { 1:{ zh:'提供中', ja:'提供中', dot:'#00CB5D' }, 2:{ zh:'试用版', ja:'試行版', dot:'#FFC400' } };\nconst CATZH = { doc:'文档创作', ana:'分析与报告', kn:'检索与知识', auto:'自动化与流程', cs:'客户服务', dev:'开发与IT' };\n\nconst SVC = {\n  m1:{ cat:'doc', zh:'会议纪要生成', ja:'議事録作成エージェント', st:1, dzh:'基于会议录音或转写文本，自动生成包含决议事项、待办与发言要点的会议纪要，并支持套用公司标准格式。' },\n  a1:{ cat:'ana', zh:'数据分析助手', ja:'データ分析アシスタント', st:1, dzh:'通过自然语言提问，对企业数据进行汇总与可视化，并附带分析洞察，无需 SQL 或 BI 工具知识。' },\n  s1:{ cat:'kn', zh:'公司规章检索', ja:'社内規程検索', st:1, dzh:'从公司规章制度文档中引用依据条款回答员工提问，例如出差报销的相关规定。' },\n  f1:{ cat:'auto', zh:'报销审核辅助', ja:'経費精算チェック', st:1, dzh:'核对发票与申请内容，自动检测违规与缺漏并给出说明，大幅减少财务审核工作。' },\n  s2:{ cat:'kn', zh:'技术知识问答', ja:'技術ナレッジQA', st:1, dzh:'跨设计文档、故障单与知识文章检索，回答技术问题，助力经验传承。' },\n  d4:{ cat:'doc', zh:'商务邮件撰写', ja:'ビジネスメール作成', st:1, dzh:'根据事项与对方关系，生成措辞得体的商务邮件文案，支持回复邮件与英文邮件。' },\n  c1:{ cat:'cs', zh:'咨询一线应答', ja:'問い合わせ一次対応', st:1, dzh:'全天候自动应答网页与邮件咨询，必要时转接人工，应答记录自动归档分类。' },\n  g1:{ cat:'dev', zh:'代码评审辅助', ja:'コードレビュー支援', st:2, dzh:'分析合并请求，指出缺陷风险、规范问题与改进建议，减少评审标准的不一致。' }\n};\n\nconst RECENTS = [\n  { id:'a1', when:'今天', whenJa:'今日' },\n  { id:'m1', when:'昨天', whenJa:'昨日' },\n  { id:'s1', when:'3天前', whenJa:'3日前' },\n  { id:'f1', when:'上周', whenJa:'先週' }\n];\nconst POPULARS = [\n  { id:'m1', uses:'1,240' }, { id:'a1', uses:'980' }, { id:'s2', uses:'870' },\n  { id:'d4', uses:'760' }, { id:'c1', uses:'540' }, { id:'g1', uses:'430' }\n];\nconst CATS = [\n  { id:'doc',  zh:'文档创作',     ja:'文書作成',           count:7, subs:['纪要与摘要','文稿起草'] },\n  { id:'ana',  zh:'分析与报告',   ja:'分析・レポート',      count:5, subs:['数据分析','客户与市场'] },\n  { id:'kn',   zh:'检索与知识',   ja:'検索・ナレッジ',      count:5, subs:['内部知识','法规与外部'] },\n  { id:'auto', zh:'自动化与流程', ja:'自動化・ワークフロー', count:6, subs:['财务与采购','业务流程'] },\n  { id:'cs',   zh:'客户服务',     ja:'顧客対応',           count:5, subs:['咨询应答','销售支持'] },\n  { id:'dev',  zh:'开发与IT',     ja:'開発・IT',           count:5, subs:['开发辅助','运维支持'] }\n];\nconst STATS = [\n  { zh:'智能体总数', ja:'エージェント数', v:'33',     u:'',  d:'+5' },\n  { zh:'本月调用',   ja:'今月の利用回数', v:'12,480', u:'次', d:'+18%' },\n  { zh:'活跃用户',   ja:'アクティブ利用者', v:'386',  u:'人', d:'+12%' },\n  { zh:'节省工时',   ja:'削減工数',       v:'1,250',  u:'h', d:'本月' }\n];\nconst NEWS = [\n  { tag:'NEW',  ink:'#fff',    bg:'#0071BC', zh:'数据分析助手 升级至 v2.1', ja:'データ分析アシスタントを v2.1 に更新', date:'06-15' },\n  { tag:'新增', ink:'#1E9E6A', bg:'#E4F5EC', zh:'新增「合同草拟辅助」智能体', ja:'「契約書ドラフト支援」を追加', date:'06-12' },\n  { tag:'公告', ink:'#C77800', bg:'#FBF1DA', zh:'本周六 02:00–04:00 系统维护', ja:'今週土曜 02:00–04:00 メンテナンス', date:'06-10' },\n  { tag:'NEW',  ink:'#fff',    bg:'#0071BC', zh:'报销审核辅助 支持电子发票', ja:'経費精算チェックが電子インボイス対応', date:'06-08' }\n];\nconst FAQS = [\n  { ico:'▶', zh:'如何开始使用智能体', ja:'エージェントの使い方' },\n  { ico:'◆', zh:'数据安全与隐私说明', ja:'データの取り扱い' },\n  { ico:'＋', zh:'申请开发新智能体',   ja:'新規エージェントの申請' },\n  { ico:'?',  zh:'常见问题 FAQ',       ja:'よくある質問' }\n];\n\n/* ============ 部品（HTML文字列） ============ */\nfunction svc(id){ return SVC[id]; }\n\nfunction searchBar(big){\n  const h = big ? 54 : 46;\n  return `<div style=\"flex:1;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #E3E8EC;border-radius:10px;padding:0 16px;height:${h}px;\">\n    <svg width=\"${big?20:18}\" height=\"${big?20:18}\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#8A98A4\" stroke-width=\"1.8\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"6\"><\u002Fcircle><path d=\"M20 20l-4.7-4.7\"><\u002Fpath><\u002Fsvg>\n    <input placeholder=\"搜索智能体、场景或关键词 / エージェントを検索\" style=\"flex:1;border:none;outline:none;font-size:${big?15:14}px;color:#2E404D;background:transparent;\">\n  <\u002Fdiv>`;\n}\n\nfunction statCard(s){\n  return `<div class=\"card\" style=\"paddi t-size:11px;color:#9AA6B0;margin-top:2px;\">本月 <b style=\"color:#3D4A57;\">${a.uses}<\u002Fb> 次<\u002Fdiv>\n    <\u002Fdiv>\n    <button style=\"flex-shrink:0;border:none;background:#0071BC;color:#fff;font-size:12.5px;font-weight:700;padding:9px 18px;border-radius:9px;\">使用 →<\u002Fbutton>\n  <\u002Fdiv>`; }).join('');\n  const tileBig = catId==='all'\n    ? `<span style=\"width:50px;height:50px;border-radius:13px;background:#0071BC;color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;\">▦<\u002Fspan>`\n    : tile(catId,50);\n  return sidebar(catId) + `<div class=\"scroll\" data-screen-label=\"カテゴリ画面 ${c.zh}\">\n    <div style=\"max-width:1080px;margin:0 auto;padding:26px 40px 56px;\">\n      <button data-nav=\"home\" style=\"display:inline-flex;align-items:center;gap:7px;border:none;background:transparent;color:#5A6B78;font-size:12.5px;font-weight:600;padding:6px 4px;\">← 返回首页 / ホームへ戻る<\u002Fbutton>\n      <div style=\"display:flex;align-items:center;gap:18px;margin-top:10px;padding-bottom:22px;border-bottom:1px solid #E9EDF1;\">\n        ${tileBig}\n        <div style=\"flex:1;min-width:0;\">\n          <div style=\"font-size:24px;font-weight:800;color:#070F26;\">${c.zh}<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#9AA6B0;margin-top:2px;\">${c.ja} · 共 ${list.length} 个智能体<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;width:min(360px,40%);\">${searchBar(false)}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:22px;display:flex;flex-direction:column;gap:12px;\">${rows}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\n/* ============ 個別業務画面（チャット実行） ============ */\nconst EXAMPLES = {\n  doc:['请根据这段录音转写生成会议纪要','帮我把要点整理成正式邮件','把这份长报告浓缩成5条摘要'],\n  ana:['本季度各区域销售对比如何？','找出环比下滑最明显的产品','用图表展示月度活跃用户趋势'],\n  kn:['出差住宿费的报销上限是多少？','VPN连接失败应如何排查？','请给出对应的规章条款依据'],\n  auto:['这张发票能否通过报销审核？','帮我走一遍采购申请的审批流程','校验这份录入表单是否有异常'],\n  cs:['客户咨询发货延迟，请给出应答话术','把这条工单分类并指派团队','生成一份满意度回访话术'],\n  dev:['请评审这段合并请求的代码','为这个函数生成单元测试','分析这段运维日志的异常原因']\n};\nfunction agentMeta(id){ return CATALOG.find(a => a.id===id) || CATALOG[0]; }\n\nfunction bubble(role, text){\n  if (role==='user'){\n    return `<div style=\"display:flex;justify-content:flex-end;\"><div style=\"max-width:78%;background:#0071BC;color:#fff;border-radius:14px 14px 4px 14px;padding:11px 15px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;\">${text}<\u002Fdiv><\u002Fdiv>`;\n  }\n  return `<div style=\"display:flex;gap:10px;align-items:flex-start;\">${tile(role,30)}<div style=\"max-width:78%;background:#fff;border:1px solid #E9EDF1;color:#2E404D;border-radius:14px 14px 14px 4px;padding:11px 15px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;\">${text}<\u002Fdiv><\u002Fdiv>`;\n}\n\nfunction agentScreen(id){\n  const a = agentMeta(id), st = ST[a.st];\n  const ex = EXAMPLES[a.cat] || [];\n  const greet = `您好，这里是「${a.zh}」智能体。请描述您的需求，我会立即处理。\\nこんにちは。「${a.ja}」エージェントです。ご用件を入力してください。`;\n  return sidebar(a.cat) + `<div style=\"flex:1;display:flex;flex-direction:column;height:100%;min-width:0;\" data-screen-label=\"業務画面 ${a.zh}\">\n    <div style=\"flex-shrink:0;padding:18px 32px 16px;border-bottom:1px solid #E9EDF1;background:#fff;\">\n      <button data-nav=\"back\" style=\"display:inline-flex;align-items:center;gap:7px;border:none;background:transparent;color:#5A6B78;font-size:12.5px;font-weight:600;padding:2px 0 10px;\">← 返回 / 戻る<\u002Fbutton>\n      <div style=\"display:flex;align-items:center;gap:15px;\">\n        ${tile(a.cat,46)}\n        <div style=\"flex:1;min-width:0;\">\n          <div style=\"display:flex;align-items:center;gap:10px;\"><span style=\"font-size:18px;font-weight:800;color:#070F26;\">${a.zh}<\u002Fspan><span style=\"font-size:12px;color:#9AA6B0;\">${a.ja}<\u002Fspan><span style=\"display:flex;align-items:center;gap:5px;font-size:10.5px;color:#6B7984;border:1px solid #E6EAEE;border-radius:9px;padding:1px 8px;\"><span style=\"width:6px;height:6px;border-radius:50%;background:${st.dot};\"><\u002Fspan>${st.zh}<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:12px;color:#8A98A4;margin-top:3px;\">${CATZH[a.cat]} · 本月 ${a.uses} 次调用<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-height:0;display:flex;\">\n      <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;background:#F6F8FA;\">\n        <div id=\"agentMsgs\" style=\"flex:1;min-height:0;overflow-y:auto;padding:24px 32px;display:flex;flex-direction:column;gap:16px;\"><\u002Fdiv>\n        <div style=\"flex-shrink:0;padding:14px 32px 20px;border-top:1px solid #E9EDF1;background:#fff;\">\n          <div style=\"display:flex;gap:10px;\">\n            <input id=\"agentInput\" placeholder=\"输入消息 / メッセージを入力\" style=\"flex:1;border:1px solid #E3E8EC;border-radius:10px;padding:0 16px;height:48px;font-size:14px;color:#2E404D;outline:none;\">\n            <button data-send=\"1\" style=\"border:none;background:#0071BC;color:#fff;font-size:14px;font-weight:700;padding:0 26px;border-radius:10px;height:48px;\">发送 / 送信<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#B6BFC7;margin-top:8px;\">※ 本画面はコンセプト確認用のモックです。応答はダミーです。 / 演示用，回复为模拟内容。<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <aside style=\"width:300px;flex-shrink:0;border-left:1px solid #E9EDF1;background:#fff;padding:22px 22px;overflow-y:auto;\">\n        <div style=\"font-size:10.5px;font-weight:700;letter-spacing:0.1em;color:#A7B1BA;\">概要 / 概述<\u002Fdiv>\n        <div style=\"font-size:13px;color:#5A6B78;line-height:1.7;margin-top:8px;\">${a.dzh}<\u002Fdiv>\n        <div style=\"height:1px;background:#EEF1F4;margin:18px 0;\"><\u002Fdiv>\n        <div style=\"font-size:10.5px;font-weight:700;letter-spacing:0.1em;color:#A7B1BA;\">示例提问 / 例<\u002Fdiv>\n        <div style=\"margin-top:10px;display:flex;flex-direction:column;gap:9px;\">\n          ${ex.map(q => `<button data-ex=\"${q}\" class=\"card hoverable\" style=\"text-align:left;border-radius:10px;padding:11px 13px;font-size:12.5px;color:#3D4A57;line-height:1.5;\">${q}<\u002Fbutton>`).join('')}\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction initAgentChat(id){\n  const a = agentMeta(id);\n  const msgs = document.getElementById('agentMsgs');\n  const input = document.getElementById('agentInput');\n  if (!msgs || !input) return;\n  const push = (role, text) => { msgs.insertAdjacentHTML('beforeend', bubble(role, text)); msgs.scrollTop = msgs.scrollHeight; };\n  push(a.cat, `您好，这里是「${a.zh}」智能体。请描述您的需求，我会立即处理。\\nこんにちは。「${a.ja}」エージェントです。ご用件を入力してください。`);\n  const send = () => {\n    const v = input.value.trim(); if (!v) return;\n    push('user', v); input.value = '';\n    setTimeout(() => push(a.cat, `已收到您的请求，正在处理「${v}」…\\n（これはモック応答です。実際のAI処理は行っていません。）`), 450);\n  };\n  input.addEventListener('keydown', (e) => { if (e.key==='Enter') send(); });\n  document.querySelector('[data-send]').addEventListener('click', send);\n  document.querySelectorAll('[data-ex]').forEach(b => b.addEventListener('click', () => { input.value = b.dataset.ex; input.focus(); }));\n  input.focus();\n}\n\n/* ============ 状態 / 描画 ============ */\nconst LAYOUTS = { '1': cand1, '2': cand2, '3': cand3 };\nconst LABELS = { '1':'案1 ダッシュボード', '2':'案2 バナー＋カテゴリ', '3':'案3 業務フィード型' };\nlet current = localStorage.getItem('dify_top_layout') || '1';\nif (!LAYOUTS[current]) current = '1';\n\nfunction renderSeg(){\n  document.getElementById('seg').innerHTML = ['1','2','3'].map(k =>\n    `<button class=\"${current===k?'on':''}\" data-k=\"${k}\">${LABELS[k]}<\u002Fbutton>`).join('');\n}\nlet view = { type:'home', cat:null, agent:null, from:null }; // 'home' | 'cat' | 'agent'\nfunction render(){\n  renderSeg();\n  const stage = document.getElementById('stage');\n  if (view.type === 'agent') {\n    stage.innerHTML = agentScreen(view.agent);\n  } else if (view.type === 'cat') {\n    stage.innerHTML = catScreen(view.cat);\n  } else {\n    stage.innerHTML = LAYOUTS[current]();\n  }\n  stage.scrollTop = 0;\n  if (view.type === 'agent') initAgentChat(view.agent);\n}\ndocument.getElementById('seg').addEventListener('click', (e) => {\n  const b = e.target.closest('button[data-k]');\n  if (!b) return;\n  current = b.dataset.k;\n  localStorage.setItem('dify_top_layout', current);\n  view = { type:'home', cat:null, agent:null, from:null };\n  render();\n});\n// 遷移: メニュー→カテゴリ / カード→業務画面 / 戻る\ndocument.getElementById('stage').addEventListener('click', (e) => {\n  const nb = e.target.closest('[data-nav]');\n  if (nb) {\n    if (nb.dataset.nav === 'home') view = { type:'home', cat:null, agent:null, from:null };\n    else if (nb.dataset.nav === 'back') view = view.from || { type:'home', cat:null, agent:null, from:null };\n    render(); return;\n  }\n  const ag = e.target.closest('[data-agent]');\n  if (ag) { view = { type:'agent', agent: ag.dataset.agent, from: { ...view } }; render(); return; }\n  const nav = e.target.closest('[data-cat]');\n  if (nav) { view = { type:'cat', cat: nav.dataset.cat, agent:null, from:null }; render(); return; }\n});\nrender();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
