  .nav-item .cnt { margin-left: auto; font-size: 11px; color: #8A98A4; }

  .nav-sub.on { background: #EAF3FA; }

  .panel .phead .zh-l { font-size: 11px; color: #8A98A4; }

  .list-wrap { padding: 32px 36px 48px 36px; }
  .list-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; }
  .crumb { font-size: 11px; letter-spacing: 0.1em; font-weight: 700; color: #0071BC; margin-bottom: 6px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card {
    background: #FFFFFF; border: 1px solid #D9DFE5; border-bottom: 2px solid #D9DFE5;
    padding: 20px; cursor: pointer; display: flex; flex-direction: column; gap: 7px;

  .card .c-zh { font-size: 12px; color: #5A6B78; }

  .detail-card { margin-top: 12px; background: #FFFFFF; border: 1px solid #D9DFE5; padding: 40px; }
  .detail-card .d-crumb { font-size: 11px; letter-spacing: 0.1em; font-weight: 700; color: #0071BC; margin-bottom: 12px; }
  .detail-card h1 { margin: 0 0 6px 0; font-size: 28px; font-weight: 700; color: #070F26; line-height: 1.35; }
  .detail-card .d-zh { font-size: 16px; color: #5A6B78; margin-bottom: 16px; }

  .badge.trial { background: rgba(0, 113, 188, 0.12); color: #005B96; }
  .keyline { width: 32px; height: 3px; background: #0071BC; margin-bottom: 16px; }
  .sec-label { font-size: 13px; font-weight: 700; color: #070F26; margin-bottom: 10px; }
  .d-ja-p { margin: 0 0 12px 0; font-size: 14.5px; line-height: 1.9; color: #2E404D; }

  .btn-primary {

  /* ===== チャット ===== */
  .chat-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .chat-hdr {
    flex-shrink: 0; display: flex; align-items: center; gap: 16px;

  .chat-hdr .vline { width: 1px; height: 24px; background: #E3E8EC; }
  .chat-hdr .ct1 { font-size: 14px; font-weight: 700; color: #070F26; }
  .chat-hdr .ct2 { font-size: 11px; color: #8A98A4; }
  .chat-hdr .status { margin-left: auto; }
  .msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 28px 36px; display: flex; flex-direction: column; gap: 14px; }
  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .bubble {
    max-width: 560px; padding: 12px 16px; font-size: 13.5px; line-height: 1.75;

  .msg-row.user .bubble { background: #0071BC; color: #FFFFFF; border-color: #0071BC; }
  .chat-input-row {
    flex-shrink: 0; display: flex; gap: 12px; padding: 16px 36px;
    background: #FFFFFF; border-top: 1px solid #E3E8EC;
  }
  .chat-input {
    flex: 1; padding: 11px 14px; font-size: 13.5px; border: 1px solid #C9D2D9;
    border-radius: 2px; color: #2E404D; outline: none; font-family: inherit;
  }
  .chat-input:focus { border-color: #0071BC; box-shadow: 0 0 0 3px rgba(46, 144, 255, 0.25); }
  .btn-send {
    border: none; background: #0071BC; color: #FFFFFF; font-size: 13.5px; font-weight: 700;
    padding: 0 24px; border-radius: 2px;
  }
  .btn-send:hover { background: #005B96; }
</style>

/* ================= 状態 ================= */
const state = {
  nav: 'A',
  openCats: { doc: true },
  selCat: null,
  selSub: null,
  lastCat: 'doc',
  selSvc: null,
  view: 'list',
  query: ''
};

/* ================= ヘルパー ================= */
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const catOf = (id) => CATS.find(c => c.id === id);
const subOf = (catId, subId) => catOf(catId).subs.find(b => b.id === subId);
const svcOf = (id) => SVCS.find(x => x.id === id);
const countSub = (subId) => SVCS.filter(x => x.sub === subId).length;
const countCat = (catId) => SVCS.filter(x => x.cat === catId).length;
const statusJa = (st) => st === 1 ? '提供中' : '試行版';
const dotColor = (st) => st === 1 ? '#00CB5D' : '#FFC400';

function filtered() {
  let list = SVCS;
  if (state.selSub) list = list.filter(x => x.sub === state.selSub);
  else if (state.selCat) list = list.filter(x => x.cat === state.selCat);
  const q = state.query.trim().toLowerCase();
  if (q) list = list.filter(x => (x.ja + x.zh + x.dja + x.dzh + x.tags.join('')).toLowerCase().indexOf(q) >= 0);
  return list;
}

/* ================= 描画: ナビ切替セグメント ================= */
function renderSeg() {
  const labels = { A: 'A アコーディオン', B: 'B カテゴリレール', C: 'C 全展開ツリー' };
  document.getElementById('seg').innerHTML = ['A', 'B', 'C'].map(k =>
    `<button class="${state.nav === k ? 'on' : ''}" data-act="nav" data-arg="${k}">${labels[k]}</button>`
  ).join('');
}

        <span class="zh-l zh">全部服务</span>
        <span class="cnt">${SVCS.length}</span>
      </button>
      <div class="nav-divider"></div>
      ${CATS.map(c => {
        const open = !!state.openCats[c.id];
        const on = state.selCat === c.id && !state.selSub;
        return `
        <button class="nav-item ${on ? 'on' : ''}" data-act="cat" data-arg="${c.id}">

          <span class="ja-l">すべて</span>
          <span class="cnt">${countCat(panelCat.id)}</span>

        ${panelCat.subs.map(sb => `
          <button class="nav-sub ${state.selSub === sb.id ? 'on' : ''}" data-act="sub" data-arg="${panelCat.id}:${sb.id}">
            <span class="ja-l">${esc(sb.ja)}</span>

            <span class="cnt">${countSub(sb.id)}</span>
          </button>`).join('')}
      </div>
    </nav>`;
  } else {
    el.innerHTML = `
    <nav class="side nav-c" data-screen-label="左ナビ案C">
      <button class="nav-item ${!state.selCat && !state.selSub ? 'on' : ''}" data-act="all">

/* ================= 描画: 右ペイン ================= */
function cardHTML(x) {
  const c = catOf(x.cat), sb = subOf(x.cat, x.sub);
  return `
  <div class="card" data-act="svc" data-arg="${x.id}">
    <div class="c-crumb">${esc(c.ja)}・${esc(sb.ja)}</div>
    <div class="c-ja">${esc(x.ja)}</div>
    <div class="c-zh zh">${esc(x.zh)}</div>
    <div class="c-desc">${esc(x.dja)}</div>
    <div class="c-meta">
      <span class="status"><span class="dot" style="background: ${dotColor(x.st)};"></span>${statusJa(x.st)}</span>
      ${x.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}
    </div>
  </div>`;
}

function gridHTML(list) {
  if (!list.length) return '<div class="empty">該当するサービスがありません。<br><span class="zh">没有符合条件的服务。</span></div>';
  return `<div class="grid">${list.map(cardHTML).join('')}</div>`;
}

function renderMain() {
  const el = document.getElementById('main');

  if (state.view === 'list') {
    let titleJa = 'すべてのサービス', titleZh = '全部服务', crumb = 'AI AGENT CATALOG';
    if (state.selSub) {
      const c = catOf(state.selCat), sb = subOf(state.selCat, state.selSub);
      titleJa = sb.ja; titleZh = sb.zh;
      crumb = 'ホーム ／ ' + c.ja + ' ／ ' + sb.ja;
    } else if (state.selCat) {
      const c = catOf(state.selCat);
      titleJa = c.ja; titleZh = c.zh;
      crumb = 'ホーム ／ ' + c.ja;
    }
    const list = filtered();
    el.innerHTML = `
    <div class="list-wrap" data-screen-label="サービス一覧">
      <div class="list-head">
        <div>
          <div class="crumb">${esc(crumb)}</div>
          <div class="list-title">
            <h1>${esc(titleJa)}</h1>
            <span class="zh-t zh">${esc(titleZh)}</span>
          </div>
          <div class="count" id="count">${list.length}件のサービス ／ <span class="zh">共${list.length}项服务</span></div>
        </div>
        <input class="search" id="search" placeholder="サービスを検索 ／ 搜索服务" value="${esc(state.query)}">
      </div>
      <div id="grid-holder">${gridHTML(list)}</div>
    </div>`;
    const search = document.getElementById('search');
    search.addEventListener('input', () => {
      state.query = search.value;
      const l = filtered();
      document.getElementById('grid-holder').innerHTML = gridHTML(l);

        <p class="d-zh-p zh">${esc(x.dzh)}</p>
        <div class="cta-row">
          <button class="btn-primary" data-act="start">利用開始する ／ 开始使用</button>
          <span class="cta-note">※ 本画面はコンセプト確認用のモックです ／ <span class="zh">本页面为概念验证演示</span></span>
        </div>
      </div>
    </div>`;

  } else {
    const x = svcOf(state.selSvc);
    el.innerHTML = `
    <div class="chat-wrap" data-screen-label="チャット画面">
      <div class="chat-hdr">
        <button class="backlink" data-act="backdetail"><span class="arrow"></span>詳細へ戻る ／ 返回详情</button>
        <div class="vline"></div>
        <div>
          <div class="ct1">${esc(x.ja)}</div>
          <div class="ct2 zh">${esc(x.zh)}</div>
        </div>
        <span class="status"><span class="dot" style="background: ${dotColor(x.st)};"></span>${statusJa(x.st)}</span>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="chat-input-row">
        <input class="chat-input" id="chat-input" placeholder="メッセージを入力 ／ 请输入消息">
        <button class="btn-send" data-act="send">送信 ／ 发送</button>
      </div>
    </div>`;
    addMsg('agent', 'こんにちは。「' + x.ja + '」エージェントです。ご用件を入力してください。\n您好，这里是「' + x.zh + '」智能体，请输入您的需求。');
    const input = document.getElementById('chat-input');
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });
    input.focus();
  }
  el.scrollTop = 0;
}

function addMsg(who, text) {
  const box = document.getElementById('msgs');
  if (!box) return;
  const row = document.createElement('div');
  row.className = 'msg-row ' + who;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

function sendChat() {
  const input = document.getElementById('chat-input');
  const t = input.value.trim();
  if (!t) return;
  addMsg('user', t);
  input.value = '';
  const x = svcOf(state.selSvc);
  setTimeout(() => {
    addMsg('agent', '（モック応答）ご入力ありがとうございます。実際のサービスでは、「' + x.ja + '」がここで回答を生成します。\n（模拟回复）感谢您的输入。正式版中，「' + x.zh + '」将在此生成回答。');
  }, 700);
}

/* ================= イベント ================= */
function renderAll() { renderSeg(); renderSidebar(); renderMain(); }

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act, arg = btn.dataset.arg;

  if (act === 'nav') { state.nav = arg; renderAll(); }
  else if (act === 'all') { state.selCat = null; state.selSub = null; state.view = 'list'; renderAll(); }
  else if (act === 'cat') { /* 案A: トグル+選択 */
    const open = !!state.openCats[arg];
    state.openCats[arg] = !open;
    if (!open) { state.selCat = arg; state.selSub = null; state.lastCat = arg; state.view = 'list'; }
    renderAll();
  }
  else if (act === 'catsel') { state.selCat = arg; state.selSub = null; state.lastCat = arg; state.openCats[arg] = true; state.view = 'list'; renderAll(); }
  else if (act === 'sub') {
    const [c, sb] = arg.split(':');
    state.selCat = c; state.selSub = sb; state.lastCat = c; state.openCats[c] = true; state.view = 'list';
    renderAll();
  }
  else if (act === 'svc') { state.selSvc = arg; state.view = 'detail'; renderMain(); }
  else if (act === 'back') { state.view = 'list'; renderAll(); }
  else if (act === 'backdetail') { state.view = 'detail'; renderMain(); }
  else if (act === 'start') { state.view = 'chat'; renderMain(); }
  else if (act === 'send') { sendChat(); }
});

renderAll();
</script>
</body>
</html>
